<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prma · status</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a3038;
    --fg:#e6e9ef; --muted:#8b94a3; --accent:#3ea6ff; --green:#5fd99a;
    --warn:#ffb454; --red:#ff6b6b; --chip:#262c37;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header {
    position:sticky; top:0; z-index:5; background:var(--panel);
    border-bottom:1px solid var(--line); padding:12px 18px;
  }
  .titlebar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .titlebar h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
  .counts { color:var(--muted); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .counts b { color:var(--fg); font-weight:600; }
  .grow { flex:1; }
  button {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:7px 12px; cursor:pointer; font-size:13px;
  }
  button:hover { border-color:var(--accent); }
  .navlink {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:7px 12px; font-size:13px; text-decoration:none;
  }
  .navlink:hover { border-color:var(--accent); }
  main { padding:18px; max-width:1000px; margin:0 auto; }

  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .stat {
    flex:1; min-width:150px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:14px 16px;
  }
  .stat .v { font-size:24px; font-weight:700; }
  .stat .l { color:var(--muted); font-size:12px; margin-top:2px; }

  .stage { margin-bottom:14px; }
  .stage .hd { cursor:pointer; border-radius:8px; padding:4px 6px; margin:-4px -6px; }
  .stage .hd:hover { background:var(--panel); }
  .stage .row { display:flex; align-items:baseline; gap:10px; margin-bottom:5px; }
  .stage .caret { color:var(--muted); width:12px; flex:none; transition:transform .12s ease; display:inline-block; }
  .stage.open .caret { transform:rotate(90deg); }
  .stage .name { font-weight:600; width:160px; flex:none; }
  .stage .nums { color:var(--muted); font-size:12px; }
  .stage .nums b { color:var(--fg); }
  .stage .nums .miss { color:var(--warn); }
  .stage .nums .fail { color:var(--red); }
  .stage .pct { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  .track { height:12px; border-radius:7px; background:var(--panel2); overflow:hidden; display:flex; }
  .track .done { background:var(--green); height:100%; }
  .track .fail { background:var(--red); height:100%; }
  .track .miss { background:transparent; height:100%; }

  .drill { display:none; margin-top:10px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .stage.open .drill { display:block; }
  .drill .dhint { color:var(--muted); font-size:12px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    text-align:left; color:var(--muted); font-weight:600; font-size:12px;
    padding:7px 12px; border-bottom:1px solid var(--line); background:var(--panel); white-space:nowrap;
  }
  thead th.sortable { cursor:pointer; user-select:none; }
  thead th.sortable:hover { color:var(--fg); }
  thead th.active { color:var(--accent); }
  tbody td { padding:7px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:var(--panel); }
  td.tt { max-width:560px; }
  td.tt .key { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; margin-top:2px; }
  td.yr, td.ad { width:1%; white-space:nowrap; color:var(--muted); font-variant-numeric:tabular-nums; }
  td.st { width:1%; white-space:nowrap; }
  td.lk { width:1%; white-space:nowrap; }
  td.lk a { color:var(--accent); text-decoration:none; margin-right:9px; }
  td.lk a:hover { text-decoration:underline; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:var(--chip); }
  .pill.missing { background:#3a2a13; color:var(--warn); }
  .pill.failed  { background:#3a1a1a; color:var(--red); }

  .section-title { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; margin:26px 0 10px; }
  .empty { color:var(--muted); padding:48px; text-align:center; }
  .empty.ok { color:var(--green); }
  code { background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1>prma · status</h1>
    <div class="counts" id="counts"></div>
    <div class="grow"></div>
    <a class="navlink" href="/">← Dashboard</a>
    <a class="navlink" href="/review">✎ Review</a>
    <a class="navlink" href="/errors">⚠ Errors</a>
    <button id="reload">↻ Reload</button>
  </div>
</header>
<main id="main"></main>
<script>
const PROXY = "https://doi-org.ezproxy.libraries.wright.edu/";
const ROW_CAP = 500;   // cap drill-down rows so a 2000-missing stage stays snappy
const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmt = n => (n||0).toLocaleString();
const when = s => esc(String(s||"").replace("T"," ").replace("+00:00"," UTC"));

let DATA = { papers:[], stages:[] };
const openStages = new Set();   // which stages are expanded ( survives reload )
// Drill-down sort. Default : most recently ADDED to the manager first.
let sortSpec = { key:"added", dir:"desc" };
const SORT_DEFAULT_DIR = { added:"desc", year:"desc", title:"asc", state:"asc" };

function renderCounts(D){
  const t = D.totals || {};
  $("#counts").innerHTML =
    `<span><b>${fmt(t.papers)}</b> papers</span>`+
    `<span><b>${fmt(t.with_pdf)}</b> with PDF</span>`+
    `<span><b>${fmt(t.with_doi)}</b> with DOI</span>`+
    (D.generated_at?`<span>as of ${when(D.generated_at)}</span>`:"");
}

// Per-paper links : local PDF ( served by /pdf?key= ) + DOI / Proxy.
function paperLinks(r){
  const out = [];
  if(r.pdf) out.push(`<a href="/pdf?key=${encodeURIComponent(r.key)}" target="_blank">PDF</a>`);
  if(r.doi){
    out.push(`<a href="https://doi.org/${esc(r.doi)}" target="_blank">DOI</a>`);
    out.push(`<a href="${PROXY}${esc(r.doi)}" target="_blank">Proxy</a>`);
  }
  return out.join(" ");
}
function paperRow(r, stageKey){
  const state = r.states[stageKey];
  const title = r.title || "(untitled)";
  const titleCell = r.pdf
    ? `<a href="/pdf?key=${encodeURIComponent(r.key)}" target="_blank">${esc(title)}</a>`
    : esc(title);
  const added = r.added ? esc(r.added.slice(0,10)) : "";
  return `<tr>
    <td class="tt">${titleCell}<div class="key">${esc(r.key)}</div></td>
    <td class="yr">${r.year||""}</td>
    <td class="ad">${added}</td>
    <td class="st"><span class="pill ${state}">${esc(state)}</span></td>
    <td class="lk">${paperLinks(r)}</td>
  </tr>`;
}
// Papers that are incomplete ( missing or failed ) for a given stage.
function incompleteFor(stageKey){
  return DATA.papers.filter(r => { const s=r.states[stageKey]; return s==="missing"||s==="failed"; });
}
function sortRows(rows, stageKey){
  const { key, dir } = sortSpec;
  const mul = dir==="desc" ? -1 : 1;
  const val = r => {
    if(key==="year")  return r.year || 0;
    if(key==="added") return r.added || "";
    if(key==="state") return r.states[stageKey] || "";
    return String(r.title||"").toLowerCase();
  };
  // Stable-ish: blanks always sink to the bottom regardless of direction.
  return rows.slice().sort((a,b)=>{
    const va=val(a), vb=val(b);
    const ae=(va===""||va===0), be=(vb===""||vb===0);
    if(ae&&!be) return 1;
    if(be&&!ae) return -1;
    if(va<vb) return -1*mul;
    if(va>vb) return  1*mul;
    return String(a.title||"").localeCompare(String(b.title||""));
  });
}
function sortHead(){
  const cols = [
    { k:"title", label:"Title" },
    { k:"year",  label:"Year" },
    { k:"added", label:"Added" },
    { k:"state", label:"State" },
    { k:null,    label:"Links" },
  ];
  return "<tr>"+cols.map(c=>{
    if(!c.k) return `<th>${c.label}</th>`;
    const on = c.k===sortSpec.key;
    const arrow = on ? (sortSpec.dir==="desc"?" ▼":" ▲") : "";
    return `<th class="sortable${on?' active':''}" data-k="${c.k}">${c.label}${arrow}</th>`;
  }).join("")+"</tr>";
}
function drillHtml(stageKey){
  const all = incompleteFor(stageKey);
  if(!all.length) return `<div class="drill"><div class="dhint">Nothing incomplete here — all caught up. ✓</div></div>`;
  const rows = sortRows(all, stageKey);
  const shown = rows.slice(0, ROW_CAP);
  const note = rows.length>shown.length ? ` · showing first ${fmt(shown.length)}` : "";
  return `<div class="drill">
    <div class="dhint">${fmt(rows.length)} paper${rows.length===1?'':'s'} incomplete${note}</div>
    <table><thead>${sortHead()}</thead><tbody>${shown.map(r=>paperRow(r, stageKey)).join("")}</tbody></table>
  </div>`;
}
// Re-render every open drill ( e.g. after a sort change ).
function refreshOpenDrills(){
  document.querySelectorAll(".stage[data-stage].open").forEach(card=>{
    const k = card.dataset.stage;
    card.querySelector(".drill")?.remove();
    card.insertAdjacentHTML("beforeend", drillHtml(k));
    wireDrill(card);
  });
}
// Wire a stage's drill-table column headers to the global sort.
function wireDrill(card){
  card.querySelectorAll(".drill th.sortable").forEach(th=>{
    th.onclick = (e)=>{
      e.stopPropagation();
      const k = th.dataset.k;
      if(sortSpec.key===k) sortSpec.dir = sortSpec.dir==="desc" ? "asc" : "desc";
      else sortSpec = { key:k, dir:SORT_DEFAULT_DIR[k]||"asc" };
      refreshOpenDrills();
    };
  });
}
function stageHtml(s){
  const appl = s.applicable || 0;
  const donePct = appl ? (100*s.done/appl) : 100;
  const failPct = appl ? (100*s.failed/appl) : 0;
  const missPct = Math.max(0, 100 - donePct - failPct);
  const nums =
    `<b>${fmt(s.done)}</b>/${fmt(appl)} done`+
    (s.missing?` · <span class="miss">${fmt(s.missing)} missing</span>`:"")+
    (s.failed?` · <span class="fail">${fmt(s.failed)} failed</span>`:"");
  const open = openStages.has(s.key);
  return `<div class="stage ${open?'open':''}" data-stage="${esc(s.key)}">
    <div class="hd">
      <div class="row">
        <span class="caret">▸</span>
        <span class="name">${esc(s.label)}</span>
        <span class="nums">${nums}</span>
        <span class="pct">${(s.pct!=null?s.pct:donePct).toFixed(0)}%</span>
      </div>
      <div class="track">
        <div class="done" style="width:${donePct}%"></div>
        <div class="fail" style="width:${failPct}%"></div>
        <div class="miss" style="width:${missPct}%"></div>
      </div>
    </div>
    ${open ? drillHtml(s.key) : ""}
  </div>`;
}

function render(D){
  DATA = D;
  renderCounts(D);
  const t = D.totals || {};
  const refs = D.references || {};
  const cards = [
    { v:fmt(t.papers),   l:"papers in library" },
    { v:fmt(t.with_pdf), l:"have a PDF on disk" },
    { v:fmt(t.no_doi),   l:"no DOI yet" },
    { v:fmt((D.problems||{}).total), l:"problems logged" },
  ];
  const refLine = (refs.cached!=null)
    ? `<div class="section-title">OpenAlex reference cache</div>`+
      `<div class="stage"><div class="row" style="padding:4px 6px"><span class="name">References</span>`+
      `<span class="nums"><b>${fmt(refs.cached)}</b> cached`+
      (refs.failed?` · <span class="fail">${fmt(refs.failed)} empty/failed</span>`:"")+
      `</span></div><div class="nums" style="color:var(--muted);font-size:12px;margin:2px 6px">`+
      `shared pool — one file per referenced work, across all papers</div></div>` : "";
  const probLink = (D.problems&&D.problems.total)
    ? `<div style="margin-top:8px"><a class="navlink" href="/errors">⚠ View ${fmt(D.problems.total)} problems</a></div>` : "";
  $("#main").innerHTML =
    `<div class="cards">${cards.map(c=>`<div class="stat"><div class="v">${c.v}</div><div class="l">${esc(c.l)}</div></div>`).join("")}</div>`+
    `<div class="section-title">Per-paper pipeline completeness — click a stage to list incomplete papers</div>`+
    (D.stages||[]).map(stageHtml).join("")+
    refLine+
    probLink;
  // wire up expand/collapse
  $("#main").querySelectorAll(".stage[data-stage]").forEach(card=>{
    const k = card.dataset.stage;
    card.querySelector(".hd").onclick = ()=>{
      if(openStages.has(k)){ openStages.delete(k); card.classList.remove("open"); card.querySelector(".drill")?.remove(); }
      else { openStages.add(k); card.classList.add("open"); card.insertAdjacentHTML("beforeend", drillHtml(k)); wireDrill(card); }
    };
    if(openStages.has(k)) wireDrill(card);   // re-rendered already-open stage
  });
}

function renderUnavailable(D){
  $("#counts").innerHTML = "";
  $("#main").innerHTML =
    `<div class="empty">No status report yet`+
    (D.error?` <span class="empty">(${esc(D.error)})</span>`:"")+
    `.<br><br>Run <code>prma status</code> to generate one`+
    ` — it snapshots your library and tallies pipeline completeness.</div>`;
}

// Opening ( or reloading ) the page recomputes the tally fresh from the
// on-disk DB via ?regen=1 , so it always reflects the latest pipeline runs.
async function load(){
  $("#counts").innerHTML = "";
  $("#main").innerHTML = `<div class="empty">Generating fresh status — walking the library…</div>`;
  $("#reload").disabled = true;
  let D;
  try { D = await (await fetch("/api/status?regen=1")).json(); }
  catch(e){ $("#main").innerHTML = `<div class="empty">Couldn't load /api/status: ${esc(e.message||e)}</div>`; $("#reload").disabled=false; return; }
  $("#reload").disabled = false;
  if(!D || !D.available){ renderUnavailable(D||{}); return; }
  render(D);
}

$("#reload").addEventListener("click", load);
load();
</script>
</body>
</html>
