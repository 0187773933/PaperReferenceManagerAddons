<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prma tiers</title>
<!-- Same pre-paint theme restore as the dashboard, so there's no flash. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("prma-theme")||"light";}catch(e){document.documentElement.dataset.theme="light";}</script>
<style>
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#ffffff; --line:#dce1e8;
    --fg:#1a1d23; --muted:#5b6470; --accent:#1a73e8; --green:#046A38;
    --chip:#eceff3; --warn:#c1670c; --row:#ffffff;
  }
  :root[data-theme="dark"] {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a3038;
    --fg:#e6e9ef; --muted:#8b94a3; --accent:#3ea6ff; --green:#046A38;
    --chip:#262c37; --warn:#e8a33d; --row:#141821;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; }
  .titlebar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .titlebar h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
  .counts { color:var(--muted); font-size:12px; display:flex; gap:12px; flex-wrap:wrap; }
  .counts b { color:var(--fg); font-weight:600; }
  .grow { flex:1; }
  button {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; cursor:pointer; font-size:13px;
  }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .navlink {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; font-size:13px; text-decoration:none;
  }
  .navlink:hover { border-color:var(--accent); }
  .savestate { font-size:12px; color:var(--muted); min-width:104px; text-align:right; }
  .savestate.dirty { color:var(--warn); }

  /* ---- toolbar : search + paint chips ---- */
  .toolbar { display:flex; gap:10px; align-items:flex-start; margin-top:9px; flex-wrap:wrap; }
  .searchwrap { position:relative; flex:1; min-width:320px; }
  input[type=search], input[type=text] {
    width:100%; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px;
  }
  input[type=search]:focus, input[type=text]:focus { outline:none; border-color:var(--accent); }
  select { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 9px; font-size:13px; }
  .results {
    display:none; position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:40;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    max-height:56vh; overflow:auto; box-shadow:0 12px 34px rgba(0,0,0,.30);
  }
  .results.show { display:block; }
  .hit { display:flex; gap:10px; align-items:flex-start; padding:8px 11px; border-bottom:1px solid var(--line); cursor:grab; }
  .hit:last-child { border-bottom:none; }
  .hit.sel { background:var(--panel2); }
  .hit .ht { font-weight:500; }
  .hit .hm { color:var(--muted); font-size:12px; margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .hit .add { flex:none; }
  .hit .in { flex:none; color:var(--green); font-size:12px; white-space:nowrap; padding-top:3px; }
  .rhint { padding:7px 11px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }

  .paintbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:9px; }
  .pblabel { color:var(--muted); font-size:12px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .chip {
    display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:2px 8px;
    border-radius:11px; background:var(--chip); color:var(--fg); border:1px solid transparent;
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .chip:hover { filter:brightness(.96); }
  /* Every chip is drawn in ITS OWN colour ( see colorOf ) , so a row's
     modalities read as a pattern rather than as words you have to parse. The
     states below are outlines, not fills, so the colour survives them :
       .on   armed for painting · every selected row has it · in the filter
       .half only some of the selected rows have it */
  .chip.on   { outline:2px solid var(--accent); outline-offset:1px; font-weight:600; }
  .chip.half { outline:2px dashed var(--accent); outline-offset:1px; }
  .chip .x { color:inherit; opacity:.5; font-size:11px; cursor:pointer; }
  .chip .x:hover { opacity:1; color:#8b1a1a; }
  .chip .n { opacity:.55; font-size:11px; }
  .chip.ghost { background:transparent; border:1px dashed var(--line); color:var(--muted); }
  .newtag { width:118px !important; padding:3px 8px !important; font-size:12px !important; border-radius:11px !important; }
  body.painting .rows .row { cursor:crosshair; }
  .paintnote { color:var(--accent); font-size:12px; }
  .pbtn { padding:3px 9px; font-size:12px; line-height:1.35; }
  .pbtn.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  /* Dragging a chip along its bar reorders that bar ( see reorderVocab ) : the
     order is the document's, so a group you build here is there tomorrow.
     Modalities and tags reorder within their OWN bar -- they're separate
     vocabularies, and mixing them would say something the document can't hold. */
  .chips .chip[draggable="true"] { cursor:grab; }
  .chips .chip.tdrag { opacity:.35; }
  .chips .chip.dropL { box-shadow:-3px 0 0 var(--accent); }
  .chips .chip.dropR { box-shadow:3px 0 0 var(--accent); }
  /* the colour editor ( 🎨 Colors ) */
  .tagrow { display:flex; align-items:center; gap:9px; padding:4px 0; border-bottom:1px solid var(--line); }
  .tagrow:last-child { border-bottom:none; }
  .tagrow input[type=color] { width:30px; height:24px; padding:0; border:1px solid var(--line); border-radius:5px; background:none; cursor:pointer; }
  .tagrow .grow { flex:1; }
  .tagrow .cnt { color:var(--muted); font-size:12px; white-space:nowrap; }
  .tagrow button { padding:2px 7px; font-size:11px; }
  .sheet h4 { margin:14px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }

  /* ---- board ---- */
  main { padding:12px 16px 120px; }
  .colhead, .row { display:grid; grid-template-columns:var(--grid); align-items:stretch; }
  .colhead {
    position:sticky; top:var(--headh,132px); z-index:9; background:var(--bg);
    color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    border-bottom:1px solid var(--line); padding:4px 0;
  }
  .colhead > div { padding:2px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .colhead .colname { cursor:pointer; }
  .tier { margin:14px 0 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .tierhead {
    display:flex; align-items:center; gap:9px; padding:7px 10px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--tc) 26%, transparent), transparent 62%);
    border-bottom:1px solid var(--line);
  }
  .tierhead.target { box-shadow:inset 0 0 0 2px var(--accent); }
  .tbadge {
    flex:none; text-align:center; font-weight:700; font-size:15px;
    background:var(--tc); color:#10131a; border-radius:7px; padding:5px 6px;
  }
  .tlabel { width:72px; background:transparent; border:none; color:inherit; font:inherit; text-align:center; padding:0; }
  .tlabel:focus { outline:1px solid rgba(0,0,0,.35); }
  .tdesc { flex:1; min-width:120px; background:transparent; border:1px solid transparent; color:var(--fg); border-radius:6px; padding:3px 7px; font-size:13px; }
  .tdesc:hover { border-color:var(--line); }
  .tdesc:focus { outline:none; border-color:var(--accent); background:var(--panel2); }
  .tcount { color:var(--muted); font-size:12px; white-space:nowrap; }
  .tierhead input[type=color] { width:26px; height:24px; padding:0; border:1px solid var(--line); border-radius:5px; background:none; cursor:pointer; }
  .tbtn { padding:3px 7px; font-size:12px; line-height:1.2; }
  .rows { min-height:34px; padding:2px 0; }
  .rows.dropinto { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .row { border-bottom:1px solid var(--line); background:var(--row); }
  .row:last-child { border-bottom:none; }
  .row:hover { background:var(--panel2); }
  .row.dragging { opacity:.4; }
  .row.drop-before { box-shadow:inset 0 2px 0 var(--accent); }
  .row.drop-after  { box-shadow:inset 0 -2px 0 var(--accent); }
  .row.selected { background:color-mix(in srgb, var(--accent) 9%, var(--row)); }
  .row.selected .c:first-child { box-shadow:inset 3px 0 0 var(--accent); }
  .row.selected .c { border-top:1px solid var(--accent); border-bottom:1px solid var(--accent); }
  .row.flash { animation:flash 1.1s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 26%, transparent); } }
  .row.hide { display:none; }
  .c { padding:7px 8px; min-width:0; border-right:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .c:last-child { border-right:none; }
  /* The row's rank inside its tier : type a number in to send it there, or grab
     the grip underneath and drag it ( to anywhere, in any tier ). */
  .numc { text-align:center; padding:7px 3px; }
  .numin {
    width:36px; text-align:center; background:transparent; border:1px solid transparent;
    color:var(--fg); border-radius:6px; padding:2px 3px; font:600 13px/1.2 inherit;
    font-variant-numeric:tabular-nums;
  }
  .numin:hover { border-color:var(--line); }
  .numin:focus { outline:none; border-color:var(--accent); background:var(--panel2); }
  .handle { cursor:grab; color:var(--muted); user-select:none; text-align:center; padding:0; font-size:11px; opacity:.6; display:block; }
  .handle:hover { opacity:1; color:var(--accent); }
  .handle:active { cursor:grabbing; }
  .titlec .tt { font-weight:500; }
  /* The title is TEXT, not a link : as a link it took the browser's visited
     colour the moment you opened the paper from any other prma page, so half
     the board turned gold for reasons that had nothing to do with the board.
     The link strip underneath is how you open it. */
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .links { margin-top:3px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:8px; font-size:12px; white-space:nowrap; }
  .links a:hover { text-decoration:underline; }
  .loose { color:var(--warn); font-size:11px; }
  .cellchips { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .chipin {
    width:52px; min-width:52px; background:transparent; border:1px dashed var(--line);
    color:var(--fg); border-radius:11px; padding:2px 7px; font-size:12px;
  }
  .chipin:focus { outline:none; width:118px; min-width:118px; border-style:solid; border-color:var(--accent); }
  .notecell textarea {
    width:100%; min-height:44px; resize:vertical; background:transparent; color:var(--fg);
    border:1px solid transparent; border-radius:6px; padding:4px 6px; font:13px/1.4 inherit;
  }
  .notecell textarea:hover { border-color:var(--line); }
  .notecell textarea:focus { outline:none; border-color:var(--accent); background:var(--panel2); min-height:110px; }
  .rowtools { display:flex; gap:5px; align-items:flex-start; }
  .rowtools select { padding:3px 4px; font-size:11px; max-width:74px; }
  .xbtn { padding:2px 8px; font-size:13px; color:var(--muted); }
  .xbtn:hover { color:#fff; background:#c0392b; border-color:#c0392b; }
  .emptyrow { color:var(--muted); font-size:12px; padding:9px 12px; }

  /* ---- autocomplete popup ---- */
  #acpop {
    display:none; position:absolute; z-index:80; min-width:170px; max-height:220px; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.32); padding:4px;
  }
  #acpop.show { display:block; }
  .acopt { padding:5px 9px; border-radius:6px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .acopt.sel, .acopt:hover { background:var(--panel2); color:var(--accent); }
  .acnew { color:var(--muted); font-size:11px; padding:4px 9px; }

  /* ---- overlay ( import options / help ) ---- */
  /* ---- the staging shelf : imported references, not on the board yet ---- */
  #stage { display:none; margin-bottom:13px; border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  #stage.show { display:block; }
  .stagehead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 11px; background:var(--panel2); border-bottom:1px solid var(--line); }
  .stagehead b { font-size:13px; }
  .stagehead .hint { color:var(--muted); font-size:12px; }
  .stagehead button { padding:3px 9px; font-size:12px; }
  .stagehead .grow { flex:1; }
  .stagetagin { width:118px !important; padding:3px 9px !important; font-size:12px !important; border-radius:11px !important; }
  .srows { max-height:54vh; overflow:auto; }
  .srow { display:grid; grid-template-columns:24px minmax(230px,2.2fr) minmax(130px,.9fr) minmax(130px,.9fr) 118px; gap:9px; align-items:start; padding:7px 11px; border-bottom:1px solid var(--line); }
  .srow:last-child { border-bottom:none; }
  .srow:hover { background:var(--panel2); }
  .srow .pick { margin-top:7px; }
  .stitle { width:100%; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--fg); font:500 14px/1.4 inherit; padding:3px 5px; }
  .stitle:hover { border-color:var(--line); }
  .stitle:focus { outline:none; border-color:var(--accent); background:var(--panel2); }
  .sauth { color:var(--muted); font-size:12px; padding:1px 6px 0; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .srow .links { padding-left:6px; }
  .stools { display:flex; gap:5px; justify-content:flex-end; }
  .stools button { padding:2px 8px; font-size:12px; }
  .badge { font-size:11px; border-radius:9px; padding:1px 7px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .badge.have { color:var(--green); font-weight:600; }
  .badge.fuzzy { color:var(--warn); }

  #overlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.45); align-items:center; justify-content:center; }
  #overlay.show { display:flex; }
  .sheet { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; max-width:560px; width:calc(100% - 40px); max-height:80vh; overflow:auto; }
  .sheet.wide { max-width:860px; }
  .sheet textarea {
    width:100%; min-height:200px; resize:vertical; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:9px 11px;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .sheet textarea:focus { outline:none; border-color:var(--accent); }
  .drop { border:1px dashed var(--line); border-radius:8px; padding:11px; text-align:center; color:var(--muted); font-size:12px; margin-top:10px; }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  .sheet h3 { margin:0 0 10px; font-size:15px; }
  .sheet p { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .sheet .btns { display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; }
  .sheet kbd { background:var(--chip); border-radius:4px; padding:1px 5px; font-size:11px; }
  .sheet ul { margin:0 0 14px 18px; padding:0; color:var(--muted); font-size:13px; }
  .sheet li { margin:3px 0; }
  #toast {
    position:fixed; right:18px; bottom:18px; z-index:90; display:none; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:10px 14px; font-size:13px; box-shadow:0 6px 22px rgba(0,0,0,.28);
  }
  #toast.show { display:flex; }
  #toast button { padding:3px 9px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1>prma tiers</h1>
    <div class="counts" id="counts"></div>
    <div class="grow"></div>
    <a class="navlink" href="/" title="Back to the search dashboard">← Dashboard</a>
    <a class="navlink" href="/sort" title="The other board: one numbered list, ordered by hand, tagged fMRI / EEG / anything">⬒ Sort</a>
    <button id="autotag" title="Fill in modalities from the ` prma modalities ` stamp for every row that has none">⚡ Auto-tag</button>
    <button id="addcol" title="Add another free-text column ( like Notes )">＋ Column</button>
    <button id="refsbtn" title="Paste a reference list, or drop a .docx / .txt — the new ones land on the staging shelf">📋 Import refs</button>
    <button id="importbtn" title="Import a CSV — merge into this list or replace it">⇩ Import CSV</button>
    <button id="exportbtn" title="Download the whole tier list as CSV">⇧ Export CSV</button>
    <button id="helpbtn" title="How this page works">?</button>
    <button id="toggleTheme" title="Toggle light / dark theme">🌙 Dark</button>
    <div class="savestate" id="savestate">loading…</div>
  </div>
  <div class="toolbar">
    <div class="searchwrap">
      <input type="search" id="q" autocomplete="off"
        placeholder='Type any part of a title…   ( ↵ adds the highlighted hit )'>
      <div class="results" id="results"></div>
    </div>
    <select id="smode" title="Titles: type any part of a title, typos and all — closest first. Full text: the dashboard's boolean search over everything.">
      <option value="title">match titles</option>
      <option value="text">full text</option>
    </select>
    <select id="pool" title="Which pool to search">
      <option value="library">In library</option>
      <option value="external">Missing ( all )</option>
      <option value="references">In bibliographies</option>
      <option value="cited_by">Newer / citing</option>
    </select>
    <input type="text" id="filter" style="max-width:220px" placeholder="Filter the board…" autocomplete="off">
  </div>
  <div class="paintbar">
    <button class="pbtn" id="tagfilter" title="Turn the chips into a filter: click them to show only the papers carrying them">🔎 Filter</button>
    <button class="pbtn" id="tagfilterany" style="display:none" title="any = a paper needs one of the chosen chips · all = it needs every one">any</button>
    <button class="pbtn" id="tagedit" title="Pick the colour every modality / tag is drawn in">🎨 Colors</button>
    <div class="chips" id="modchips" title="Drag a chip along the bar to move it — the order is the board's"></div>
    <span class="pblabel">·</span>
    <div class="chips" id="tagchips" title="Drag a chip along the bar to move it — the order is the board's"></div>
    <span class="paintnote" id="paintnote"></span>
  </div>
</header>
<main>
  <section id="stage"></section>
  <div class="colhead" id="colhead"></div>
  <div id="board"></div>
  <div style="margin-top:14px"><button id="addtier">＋ Add tier</button></div>
</main>
<div id="acpop"></div>
<div id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
// The proxy every prma page links DOIs through ( see the dashboard's copy ).
const PROXY = "https://doi-org.ezproxy.libraries.wright.edu/";
// The reader page for a paper : the key IS the DOI when there is one, so its
// slashes stay slashes in the path -- /md/10.1038/… ( same as the dashboard ).
const mdHref = k => "/md/" + encodeURIComponent(k).replace(/%2F/gi, "/");
// Matches utils.doi_to_filename() -- how output/md and output/methods name files.
const fileStem = k => String(k||"").replace(/[\/\\]/g, "_");
const STAGING = "unranked";

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48);
const nowISO = () => new Date().toISOString();

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let DOC   = { version:1, columns:[{id:"notes",label:"Notes"}], vocab:{tags:[],mods:[]}, tiers:[], staging:[] };
let REV   = 0;              // server revision we are in sync with
let VOCAB = [];             // modality vocabulary ( config/methods.py )
let META  = {};             // paper key -> /api/tiers/meta entry
let armed = null;           // { kind:"mod"|"tag", value } -- click-to-tag paint mode
let SEL   = new Set();      // keys of the selected rows ( outlined ) -- see selectRow
let selAnchor = null;       // where a shift-click range starts from
let TAGF  = new Set();      // "mod:fMRI" / "tag:premier" the board is filtered to
let filtering = false;      // the chips are a filter right now, not a brush
let filterAll = false;      // ... and a row needs ALL of TAGF, not just one
let addTier = localStorage.getItem("prma-tier-target") || STAGING;
let SOFF  = new Set();      // staged keys whose checkbox is OFF ( this browser only )
// How each staged row was matched to the library ( "doi" / "title" / "fuzzy" ).
// Deliberately NOT part of the document : it's a fact about the import you just
// ran, worth a badge while you review it and meaningless a day later.
let STAGEHOW = {};
let dirty = false, saving = false, saveTimer = null;

// ---- chip colours ---------------------------------------------------------
// A pastel wheel. Every modality and every tag gets one, so a row's chips are a
// pattern you can read at a glance instead of five words you have to. Dark ink
// reads on all of them, in either theme. A new one takes the next colour nothing
// else is using ; anything without a stored colour falls back to a stable one
// picked from its name, so the board is never a wall of grey. Colours live in
// the DOCUMENT ( vocab.mods / vocab.tags ) , so they follow the board.
const PALETTE = [
  "#bfd8f7","#c6e8e2","#c9e9c0","#e3eeb4","#f6e7ab","#fbd9b4","#f9c9c0",
  "#f4c3ce","#e9c6e8","#d3ccf3","#c6d2f0","#bfe4f2","#e0dac6","#dfe2e8" ];
const TAGFG = "#20242c";
const lc = s => String(s||"").toLowerCase();
const isHex = c => /^#[0-9a-f]{6}$/i.test(String(c||""));
function hashIdx(s){ let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h % PALETTE.length; }
function vocabList(kind){
  DOC.vocab = DOC.vocab || {};
  const key = kind==="mod" ? "mods" : "tags";
  if(!Array.isArray(DOC.vocab[key])) DOC.vocab[key] = [];
  return DOC.vocab[key];
}
function vocabEntry(kind, name){ return vocabList(kind).find(t=>lc(t.name)===lc(name)); }
function colorOf(kind, name){
  const e = vocabEntry(kind, name);
  return (e && isHex(e.color)) ? e.color : PALETTE[hashIdx(lc(name))];
}
function nextColor(kind){
  const list = vocabList(kind);
  const used = new Set(list.map(t=>lc(t.color)).filter(Boolean));
  return PALETTE.find(c=>!used.has(lc(c))) || PALETTE[list.length % PALETTE.length];
}
const chipStyle = (kind,v) => `style="background:${colorOf(kind,v)};color:${TAGFG};border-color:transparent"`;
// Anything you use joins its vocabulary list , which is what gives it a colour
// that survives a restart ( and , for tags , keeps offering it in the chips ).
function rememberValue(kind, value){
  if(!vocabEntry(kind, value)) vocabList(kind).push({ name:value, color:nextColor(kind) });
}
// A row's chips are kept alphabetical, always : the order you happened to add
// them in isn't information, and a list that shuffles is one you re-read.
const byName = (a,b) => lc(a).localeCompare(lc(b));
function sortVals(it){
  if(it && it.mods) it.mods.sort(byName);
  if(it && it.tags) it.tags.sort(byName);
}

function itemsOf(tid){ const t = DOC.tiers.find(t=>t.id===tid); return t ? t.items : null; }
function allItems(){ return DOC.tiers.flatMap(t=>t.items.map(it=>({ it, tier:t }))); }
function findItem(key){
  for(const t of DOC.tiers){ const i = t.items.findIndex(x=>x.key===key); if(i>=0) return { tier:t, idx:i, it:t.items[i] }; }
  return null;
}
function usedValues(kind){
  const s = new Set();
  allItems().forEach(({it})=> ((kind==="mod"?it.mods:it.tags)||[]).forEach(v=>s.add(v)));
  staged().forEach(it=> ((kind==="mod"?it.mods:it.tags)||[]).forEach(v=>s.add(v)));
  return Array.from(s);
}
// Every value a chip bar offers, IN THE ORDER IT DRAWS THEM : the document's own
// vocabulary first -- which is the order you dragged the bar into ( see
// reorderVocab ) -- then the config's modality list, then anything in use that
// hasn't got a place yet.
function chipOptions(kind){
  const out = [], seen = new Set();
  const push = v => { if(v && !seen.has(lc(v))){ seen.add(lc(v)); out.push(v); } };
  if(kind === "mod"){
    // The modality vocabulary belongs to config/methods.py , not to the
    // document -- vocab.mods only remembers each name's colour and its PLACE in
    // the bar. So an entry for a modality the config no longer has is a leftover
    // and must not put the chip back : it's offered only if it's still in the
    // config or still on a paper.
    const live = new Set([].concat(VOCAB, usedValues("mod")).map(lc));
    vocabList("mod").forEach(t=>{ if(live.has(lc(t.name))) push(t.name); });
    VOCAB.forEach(push);
  } else {
    // A tag you invented and haven't put on a paper yet is still a tag , so the
    // whole tag vocabulary is offered whether or not anything carries it.
    vocabList("tag").forEach(t=>push(t.name));
  }
  usedValues(kind).forEach(push);
  return out;
}
function modOptions(){ return chipOptions("mod"); }
function tagOptions(){ return chipOptions("tag"); }
// Dragging a chip along its bar puts it somewhere else in that bar. The order is
// the DOCUMENT's ( vocab.mods / vocab.tags ) , not this browser's : grouping
// related chips side by side is a judgement about them, same as their colours,
// so it follows the board everywhere. Anything the bar was showing WITHOUT a
// place in the vocabulary gets one here -- otherwise a modality you dragged
// would snap back the next time the bar redrew.
function reorderVocab(kind, what, onto, before){
  const order = chipOptions(kind);
  const from = order.findIndex(v=>lc(v)===lc(what));
  if(from < 0) return;
  const [v] = order.splice(from, 1);
  let to = onto ? order.findIndex(x=>lc(x)===lc(onto)) : -1;
  if(to < 0) to = order.length; else if(!before) to += 1;
  order.splice(to, 0, v);
  const key = kind==="mod" ? "mods" : "tags";
  DOC.vocab[key] = order.map(name=>{ const e = vocabEntry(kind, name); return { name, color: e ? e.color : "" }; });
  markDirty(); renderPaintbar();
}

// ---------------------------------------------------------------------------
// Load / save
// ---------------------------------------------------------------------------
function markDirty(){
  dirty = true;
  $("#savestate").textContent = "unsaved…";
  $("#savestate").classList.add("dirty");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}
async function save(){
  clearTimeout(saveTimer);
  if(saving){ saveTimer = setTimeout(save, 400); return; }
  saving = true;
  try {
    const r = await (await fetch("/api/tiers", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ doc: DOC }) })).json();
    if(r && r.ok){
      REV = r.rev; dirty = false;
      $("#savestate").classList.remove("dirty");
      $("#savestate").textContent = "saved " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    } else {
      $("#savestate").textContent = "save failed";
    }
  } catch(e){ $("#savestate").textContent = "save failed ( offline? )"; }
  saving = false;
}
async function loadDoc(){
  const d = await (await fetch("/api/tiers")).json();
  DOC = d.doc; REV = d.rev; VOCAB = d.modalities || [];
  if(!Array.isArray(DOC.staging)) DOC.staging = [];
  if(!DOC.tiers.some(t=>t.id===addTier)) addTier = STAGING;
  allItems().forEach(({it})=>sortVals(it));   // the server stores them sorted ; older files may not be
  staged().forEach(sortVals);
  dirty = false;
  $("#savestate").classList.remove("dirty");
  $("#savestate").textContent = DOC.updated_at ? ("saved " + DOC.updated_at.replace("T"," ").slice(0,16)) : "empty list";
  renderAll();
  fetchMeta(allItems().map(({it})=>it.key).concat(staged().map(it=>it.key)));
}
// Another tab saved -> pick it up, as long as we have nothing of our own pending.
async function pollRev(){
  try {
    const d = await (await fetch("/api/tiers/version")).json();
    if(d && d.rev !== REV && !dirty && !saving){ await loadDoc(); toast("Reloaded — the list changed in another tab"); }
  } catch(e){}
  setTimeout(pollRev, 6000);
}

// Per-row lookup : which links a paper has, and ( mods=true ) its modality stamp.
async function fetchMeta(keys, wantMods){
  keys = Array.from(new Set(keys.filter(k=>k && (wantMods || !META[k]))));
  if(!keys.length) return {};
  const got = {};
  for(let i=0; i<keys.length; i+=60){
    const chunk = keys.slice(i, i+60);
    try {
      const r = await (await fetch("/api/tiers/meta", { method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ keys: chunk, mods: !!wantMods }) })).json();
      Object.assign(META, r.meta || {});
      Object.assign(got,  r.meta || {});
    } catch(e){}
  }
  repaintLinks();
  return got;
}

// One grid for the whole board, so every tier's rows line up like a spreadsheet.
// The free-text columns share what's left ; they get tighter as you add more
// rather than pushing the board into a horizontal scroll.
function gridTemplate(){
  const n = DOC.columns.length;
  const min = n > 3 ? "112px" : "150px";
  const custom = DOC.columns.map(()=>`minmax(${min},1.1fr)`).join(" ");
  return `46px minmax(${n>3?"200px":"240px"},2.1fr) 150px 160px ${custom} 86px`;
}
function renderColHead(){
  document.documentElement.style.setProperty("--grid", gridTemplate());
  $("#colhead").innerHTML =
    `<div style="text-align:center">#</div><div>Paper</div><div>Modalities</div><div>Tags</div>`+
    DOC.columns.map(c=>`<div class="colname" data-col="${esc(c.id)}" title="Double-click to rename · shift-click to delete">${esc(c.label)}</div>`).join("")+
    `<div></div>`;
}
function rowLinks(it){
  const m = META[it.key] || {};
  const doi = it.doi || m.doi || "";
  const wid = it.wid || m.wid || "";
  const out = [];
  if(doi){
    out.push(`<a href="https://doi.org/${esc(doi)}" target="_blank" rel="noopener">DOI</a>`);
    out.push(`<a href="${PROXY}${esc(doi)}" target="_blank" rel="noopener">Proxy</a>`);
  }
  // Library papers stream from disk ; an external one carries whatever open-access
  // url its pool row had.
  if(m.pdf)      out.push(`<a href="/pdf?key=${encodeURIComponent(it.key)}" target="_blank">PDF</a>`);
  else if(it.pdf) out.push(`<a href="${esc(it.pdf)}" target="_blank" rel="noopener">PDF</a>`);
  if(wid)       out.push(`<a href="https://openalex.org/${esc(wid)}" target="_blank" rel="noopener">OA</a>`);
  if(m.montage) out.push(`<a href="${esc(m.montage)}" target="_blank" title="Figure montage">Figures</a>`);
  if(m.has_md)  out.push(`<a href="${mdHref(it.key)}" class="mdlink" target="_blank" rel="noopener" title="The rendered Markdown, with figures">MD</a>`);
  if(m.methods) out.push(`<a href="${esc(m.methods)}" target="_blank" title="The extracted Methods section">Methods</a>`);
  return out.join(" ");
}
function chipsCell(it, kind){
  const vals = (kind==="mod" ? it.mods : it.tags) || [];
  return `<div class="cellchips">`+
    vals.map(v=>`<span class="chip" ${chipStyle(kind,v)} data-val="${esc(v)}">${esc(v)}`+
      `<span class="x" data-drop="${esc(v)}" data-kind="${kind}" title="Remove">×</span></span>`).join("")+
    `<input class="chipin" data-kind="${kind}" placeholder="+" autocomplete="off"></div>`;
}
function rowHtml(it, n){
  const m = META[it.key] || {};
  const title = it.title || m.title || it.key;
  const year  = it.year || m.year || "";
  const inner = esc(title);          // plain text -- open it from the link strip
  const loose = (m.in_library === false) ? ` <span class="loose" title="Not matched to a paper in your library — links other than the DOI are unavailable">not in library</span>` : "";
  const tierOpts = DOC.tiers.map(t=>`<option value="${esc(t.id)}">${esc(t.label)}</option>`).join("");
  return `<div class="row${SEL.has(it.key)?" selected":""}" data-key="${esc(it.key)}">`+
    `<div class="c numc">`+
      `<input class="numin" value="${n}" title="This paper's place in its tier — type a number and press ↵ to send it there" `+
        `inputmode="numeric" autocomplete="off">`+
      `<span class="handle" title="Drag to re-rank, or into another tier">⠿</span></div>`+
    `<div class="c titlec">`+
      `<div class="tt">${inner}${loose}</div>`+
      `<div class="meta">${year?esc(year):""}${it.journal?" · "+esc(it.journal):""}<span class="mkey"> · ${esc(it.key)}</span></div>`+
      `<div class="links" data-links="1">${rowLinks(it)}</div>`+
    `</div>`+
    `<div class="c" data-cell="mod">${chipsCell(it,"mod")}</div>`+
    `<div class="c" data-cell="tag">${chipsCell(it,"tag")}</div>`+
    DOC.columns.map(c=>`<div class="c notecell"><textarea data-field="${esc(c.id)}" `+
      `placeholder="${esc(c.label)}…" spellcheck="false">${esc((it.fields||{})[c.id]||"")}</textarea></div>`).join("")+
    `<div class="c rowtools">`+
      `<select class="movesel" title="Move to another tier">${tierOpts}</select>`+
      `<button class="xbtn" data-act="remove" title="Delete this paper from the list ( undoable )">🗑</button>`+
    `</div>`+
  `</div>`;
}
function tierHtml(t){
  return `<section class="tier" data-tier="${esc(t.id)}">`+
    `<div class="tierhead${t.id===addTier?' target':''}" style="--tc:${esc(t.color||'#8b94a3')}">`+
      `<div class="tbadge" style="background:${esc(t.color||'#8b94a3')}"><input class="tlabel" value="${esc(t.label)}" ${t.locked?'readonly':''}></div>`+
      `<input class="tdesc" value="${esc(t.desc||'')}" placeholder="what belongs in this tier">`+
      `<span class="tcount">${t.items.length}</span>`+
      `<input type="color" value="${esc(/^#[0-9a-f]{6}$/i.test(t.color||'')?t.color:'#8b94a3')}" title="Tier colour">`+
      `<button class="tbtn" data-act="target" title="Send everything you add from search into this tier">${t.id===addTier?'◉':'○'} target</button>`+
      `<button class="tbtn" data-act="up" title="Move tier up">↑</button>`+
      `<button class="tbtn" data-act="down" title="Move tier down">↓</button>`+
      (t.locked?"":`<button class="tbtn" data-act="del" title="Delete this tier ( its papers move to Unranked )">✕</button>`)+
    `</div>`+
    `<div class="rows" data-tier="${esc(t.id)}">`+
      (t.items.length ? t.items.map((it,i)=>rowHtml(it, i+1)).join("")
        : `<div class="emptyrow">Empty — drag papers here, or search above and add them.</div>`)+
    `</div></section>`;
}
function renderBoard(){
  $("#board").innerHTML = DOC.tiers.map(tierHtml).join("");
  // Each row's tier <select> shows where it currently lives.
  DOC.tiers.forEach(t=>t.items.forEach(it=>{
    const sel = document.querySelector(`.row[data-key="${cssEsc(it.key)}"] .movesel`);
    if(sel) sel.value = t.id;
  }));
  applyFilter();
}
function renderCounts(){
  const n = allItems().length;
  const ranked = DOC.tiers.filter(t=>t.id!==STAGING).reduce((a,t)=>a+t.items.length,0);
  const st = staged().length;
  $("#counts").innerHTML = `<span><b>${n}</b> papers</span><span><b>${ranked}</b> ranked</span>`+
    (st ? `<span><b>${st}</b> staged</span>` : "")+
    `<span>${DOC.tiers.length} tiers</span>`;
}
// The paint bar has three jobs, in this order of precedence :
//   FILTERING ( 🔎 on )  -- a click puts the chip in / out of the filter, and
//                           the board shows only the papers carrying it.
//   rows SELECTED        -- the chips are checkboxes for those rows : solid
//                           outline = every one has it, dashed = some do, and a
//                           click flips it on all of them.
//   otherwise            -- a click arms it for painting ( click rows ).
function renderPaintbar(){
  const sel = filtering ? [] : selectedItems();
  const chip = (v, kind, extra)=>{
    const inF = filtering && TAGF.has(kind+":"+v);
    const on  = sel.length && sel.every(it=>hasValue(it, kind, v));
    const som = !on && sel.some(it=>hasValue(it, kind, v));
    const n   = allItems().filter(({it})=>hasValue(it, kind, v)).length;
    const arm = armed && armed.kind===kind && armed.value===v;
    const title = filtering  ? `${inF?"in":"not in"} the filter — click to ${inF?"drop":"add"} it ( ${n} paper(s) )`
                : sel.length ? `${on?"on":som?"on some of":"off"} the ${sel.length} selected row(s) — click to flip it`
                             : `${n} paper(s) — click to paint it onto rows`;
    return `<span class="chip ${(inF||arm||on)?'on':som?'half':''}" ${chipStyle(kind,v)} draggable="true" `+
      `data-kind="${kind}" data-val="${esc(v)}" title="${esc(title)} — drag it to move it along the bar">${esc(v)}`+
      `<span class="n">${n||""}</span>${extra||""}</span>`;
  };
  $("#modchips").innerHTML = modOptions().map(v=>chip(v,"mod")).join("");
  $("#tagchips").innerHTML = tagOptions().map(v=>chip(v,"tag",
      `<span class="x" data-deltag="${esc(v)}" title="Delete this tag everywhere">×</span>`)).join("")+
    `<input class="chipin newtag" id="newtag" placeholder="+ new tag" autocomplete="off">`;
  renderNote();
  document.body.classList.toggle("painting", !!armed && !filtering);
}
// One line after the chips, saying whichever of these is true : what the board
// is filtered to, what's selected, what you're painting.
function renderNote(shown){
  const bits = [];
  if(TAGF.size || $("#filter").value.trim()){
    if(shown == null) shown = $$(".row:not(.hide)").length;
    bits.push(`showing ${shown} of ${allItems().length}`+
      (TAGF.size ? ` · ${filterAll?"all of":"any of"} ${Array.from(TAGF).map(s=>s.split(":").slice(1).join(":")).join(", ")}` : ""));
  } else if(filtering){
    bits.push("click chips to show only the papers carrying them");
  }
  if(!filtering){
    const sel = selectedItems();
    if(sel.length) bits.push(`${sel.length} row(s) selected — click a chip above to toggle it on them ( Esc clears )`);
    else if(armed) bits.push(`painting “${armed.value}” — click rows to toggle it ( Esc to stop )`);
  }
  $("#paintnote").textContent = bits.join("   ·   ");
}
const hasValue = (it, kind, v) =>
  ((kind==="mod" ? it.mods : it.tags) || []).some(x=>x.toLowerCase()===v.toLowerCase());
function selectedItems(){
  return Array.from(SEL).map(k=>findItem(k)).filter(Boolean).map(f=>f.it);
}
// Click a row to select it ( ⌘ / ctrl adds one, shift takes the range -- across
// tiers, in board order ). A plain click on the only selected row deselects it.
function selectRow(key, e){
  if(e && (e.metaKey || e.ctrlKey)){
    SEL.has(key) ? SEL.delete(key) : SEL.add(key);
    selAnchor = key;
  } else if(e && e.shiftKey && selAnchor){
    const keys = allItems().map(({it})=>it.key);
    let a = keys.indexOf(selAnchor), b = keys.indexOf(key);
    if(a>=0 && b>=0){
      if(a>b){ const t=a; a=b; b=t; }
      for(let i=a;i<=b;i++) SEL.add(keys[i]);
    }
  } else {
    const only = SEL.size===1 && SEL.has(key);
    SEL = new Set(only ? [] : [key]);
    selAnchor = only ? null : key;
  }
  paintSelection(); renderPaintbar();
}
function paintSelection(){
  $$(".row").forEach(r=>r.classList.toggle("selected", SEL.has(r.dataset.key)));
}
function clearSelection(){
  if(!SEL.size) return;
  SEL.clear(); selAnchor = null;
  paintSelection(); renderPaintbar();
}
// One value across every selected row : off everywhere if they ALL have it,
// otherwise on everywhere ( so a half-tagged selection fills in rather than
// flipping each row's state independently ).
function toggleOnSelection(kind, value){
  const items = selectedItems();
  if(!items.length) return;
  const all = items.every(it=>hasValue(it, kind, value));
  items.forEach(it=>{
    const list = kind==="mod" ? (it.mods = it.mods||[]) : (it.tags = it.tags||[]);
    const i = list.findIndex(x=>x.toLowerCase()===value.toLowerCase());
    if(all){ if(i>=0) list.splice(i,1); }
    else if(i<0) list.push(value);
    sortVals(it);
  });
  rememberValue(kind, value);
  markDirty();
  items.forEach(it=>refreshCell(it.key, kind));
  renderPaintbar();
  toast(`${all?"Removed":"Added"} “${value}” ${all?"from":"on"} ${items.length} row(s)`);
}
function renderAll(){ renderColHead(); renderBoard(); renderStage(); renderCounts(); renderPaintbar(); }
// Only the link strips ( after a meta fetch lands ) -- keeps focus / typing intact.
function repaintLinks(){
  $$(".row").forEach(row=>{
    const f = findItem(row.dataset.key);
    if(!f) return;
    const el = row.querySelector('[data-links]');
    if(el) el.innerHTML = rowLinks(f.it);
    const m = META[f.it.key];
    if(m && m.in_library === false && !row.querySelector(".loose"))
      row.querySelector(".tt").insertAdjacentHTML("beforeend",
        ` <span class="loose" title="Not matched to a paper in your library">not in library</span>`);
  });
  // The shelf's rows hang off the same meta ( "in library", and which links
  // exist ), and it lands after they're first drawn. Only those two strips are
  // touched -- a title you're editing up there is left alone.
  $$(".srow").forEach(row=>{
    const it = findStage(row.dataset.key);
    if(!it) return;
    const links = row.querySelector("[data-links]");
    if(links) links.innerHTML = rowLinks(it);
    const badge = row.querySelector("[data-sbadge]");
    if(badge) badge.innerHTML = sbadgeHtml(it);
  });
}
function cssEsc(s){ return String(s).replace(/["\\]/g, "\\$&"); }
function rowEl(key){ return document.querySelector(`.row[data-key="${cssEsc(key)}"]`); }
function refreshCell(key, kind){
  const f = findItem(key); const row = rowEl(key);
  if(!f || !row) return;
  const cell = row.querySelector(`[data-cell="${kind}"]`);
  if(cell) cell.innerHTML = chipsCell(f.it, kind);
}
function toast(msg, ms, undoLabel, onUndo){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>`+(onUndo?`<button id="undobtn">${esc(undoLabel||"Undo")}</button>`:"");
  t.classList.add("show");
  if(onUndo) $("#undobtn").onclick = ()=>{ t.classList.remove("show"); onUndo(); };
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms||2600);
}
// The board's sticky column header sits directly under the ( variable-height ) header.
function syncHeadOffset(){
  document.documentElement.style.setProperty("--headh", document.querySelector("header").offsetHeight + "px");
}

// ---------------------------------------------------------------------------
// The staging shelf
//
// Where an imported reference list lands ( 📋 Import refs ) : the same rows as
// the board, off every tier, so a bibliography can be read, corrected and
// tagged before any of it is RANKED -- which is the one thing this page is for
// and the one thing you don't want to do to forty papers you haven't looked at.
//
// It lives in the DOCUMENT ( DOC.staging , see src/db/tiers.py ) rather than in
// this browser : a pasted bibliography is a session of work, and a reload
// losing it would be the same kind of loss the list is written whole to avoid.
// ---------------------------------------------------------------------------
const staged = () => (DOC.staging = DOC.staging || []);
function findStage(key){ return staged().find(x=>x.key===key) || null; }
const picked = () => staged().filter(it=>!SOFF.has(it.key));
// Matches utils.normalize_title -- the same folding the server matched with.
const ntitle = s => String(s||"").normalize("NFKD").toLowerCase()
  .replace(/[^a-z0-9]+/g," ").trim();
const targetTier = () => DOC.tiers.find(t=>t.id===addTier) || DOC.tiers[DOC.tiers.length-1];

function stageHeadHtml(){
  const n = picked().length, all = n === staged().length;
  const t = targetTier();
  return `<div class="stagehead">`+
    `<b>Staging</b>`+
    `<span class="hint">${staged().length} imported reference(s) — not in a tier yet</span>`+
    `<div class="grow"></div>`+
    `<input class="chipin stagetagin" id="stagetag" data-kind="tag" placeholder="+ tag checked" autocomplete="off" `+
      `title="Type a tag and press ↵ to put it on every checked row">`+
    `<button id="stageall" title="Check or uncheck every row">${all?"none":"all"}</button>`+
    `<button id="stagedrop" ${n?"":"disabled"} title="Throw the checked rows away ( undoable )">🗑</button>`+
    `<button class="primary" id="stageadd" ${n?"":"disabled"} `+
      `title="Move them into the tier the ◉ target marks, at its bottom">＋ Add ${n} to ${esc(t?t.label:"Unranked")}</button>`+
  `</div>`;
}
// Only the header, for a checkbox tick : re-rendering the whole shelf on every
// tick would throw away a title you were half-way through fixing.
function refreshStageHead(){
  const head = $("#stage .stagehead");
  if(head) head.outerHTML = stageHeadHtml();
}
// year · journal · whether the library turned out to have it. The last part only
// becomes true once /api/tiers/meta lands, so repaintLinks redraws it.
function sbadgeHtml(it){
  const m = META[it.key] || {};
  const bits = [ it.year || "", it.journal || "" ].filter(Boolean).map(esc).join(" · ");
  const badge = m.in_library
    ? `<span class="badge have" title="Matched a paper already in your library — it arrives with all its links">in library</span>`
    : `<span class="badge" title="Nothing in your library matched this one">new</span>`;
  const fuzzy = STAGEHOW[it.key] === "fuzzy"
    ? `<span class="badge fuzzy" title="Matched on the title alone, with no DOI to confirm it — worth a look before you add it">fuzzy</span>` : "";
  return `${bits}${bits?" · ":""}${badge}${fuzzy}`;
}
function srowHtml(it){
  return `<div class="srow" data-key="${esc(it.key)}">`+
    `<input type="checkbox" class="pick" ${SOFF.has(it.key)?"":"checked"} title="Include this one when you add">`+
    `<div>`+
      `<input class="stitle" value="${esc(it.title)}" title="A parsed title isn't always the right one — fix it here">`+
      (it.authors ? `<div class="sauth">${esc(it.authors)}</div>` : "")+
      `<div class="sauth" data-sbadge="1">${sbadgeHtml(it)}</div>`+
      `<div class="links" data-links="1">${rowLinks(it)}</div>`+
    `</div>`+
    `<div data-cell="mod">${chipsCell(it,"mod")}</div>`+
    `<div data-cell="tag">${chipsCell(it,"tag")}</div>`+
    `<div class="stools">`+
      `<button data-act="sadd" title="Add just this one">＋ Add</button>`+
      `<button class="xbtn" data-act="sdrop" title="Throw this one away ( undoable )">🗑</button>`+
    `</div>`+
  `</div>`;
}
function renderStage(){
  const box = $("#stage");
  box.classList.toggle("show", staged().length > 0);
  box.innerHTML = staged().length
    ? stageHeadHtml() + `<div class="srows">` + staged().map(srowHtml).join("") + `</div>`
    : "";
}
function srowEl(key){ return document.querySelector(`.srow[data-key="${cssEsc(key)}"]`); }
// Into the tier the ◉ target marks -- Unranked unless you moved it -- at its
// BOTTOM. Staged papers arrive unranked by definition, so they queue under
// whatever is already there rather than jumping the tier's own order.
function addStaged(keys){
  const want   = new Set(keys.filter(k=>!findItem(k)));
  const moving = staged().filter(it=>want.has(it.key));
  const t = targetTier();
  if(!moving.length || !t) return;
  DOC.staging = staged().filter(it=>!want.has(it.key));
  moving.forEach(it=>{
    SOFF.delete(it.key);
    (it.mods||[]).forEach(v=>rememberValue("mod", v));
    (it.tags||[]).forEach(v=>rememberValue("tag", v));
  });
  t.items.push(...moving);
  markDirty(); renderStage(); renderBoard(); renderCounts(); renderPaintbar();
  const first = rowEl(moving[0].key);
  if(first){ first.classList.add("flash"); first.scrollIntoView({ block:"center", behavior:"smooth" }); }
  toast(`Added ${moving.length} paper(s) to ${t.label}`, 6000, "Undo", ()=>{
    t.items      = t.items.filter(it=>moving.indexOf(it) < 0);
    DOC.staging  = moving.concat(staged());
    markDirty(); renderStage(); renderBoard(); renderCounts(); renderPaintbar();
  });
}
function dropStaged(keys){
  const gone   = new Set(keys);
  const before = staged().slice();
  DOC.staging  = staged().filter(it=>!gone.has(it.key));
  if(DOC.staging.length === before.length) return;
  keys.forEach(k=>SOFF.delete(k));
  markDirty(); renderStage(); renderCounts(); renderPaintbar();
  toast(`Dropped ${before.length - DOC.staging.length} staged row(s)`, 6000, "Undo", ()=>{
    DOC.staging = before; markDirty(); renderStage(); renderCounts(); renderPaintbar();
  });
}
// Every way this board already knows a paper : its key, its DOI, its title. A
// reference list is somebody else's spelling of papers you may well already
// have, so "do we have it" has to be all three -- the server resolves what it
// can to a library key first ( server._refs_payload ), and the title is the
// backstop for what it couldn't.
function haveIndex(){
  const seen = new Map();
  const add = (it, where)=>{
    if(it.key) seen.set(lc(it.key), where);
    if(it.doi) seen.set("doi:"+lc(it.doi), where);
    const t = ntitle(it.title);
    if(t) seen.set("t:"+t, where);
  };
  allItems().forEach(({it})=>add(it, "board"));
  staged().forEach(it=>add(it, "shelf"));
  return seen;
}
function stageRefs(refs, label){
  const seen = haveIndex();
  const fresh = [];
  let onBoard = 0, onShelf = 0;
  refs.forEach(r=>{
    const where = seen.get(lc(r.key)) || (r.doi && seen.get("doi:"+lc(r.doi)))
      || seen.get("t:"+ntitle(r.title)) || "";
    if(where === "board"){ onBoard++; return; }
    if(where === "shelf"){ onShelf++; return; }
    const it = {
      key: r.key, title: r.title||"", authors: r.authors||"", doi: r.doi||"", wid: r.wid||"",
      pdf: r.pdf||"", year: r.year||null, journal: r.journal||"", mods: [], tags: [],
      fields: Object.fromEntries(DOC.columns.map(c=>[c.id,""])), added_at: nowISO(),
    };
    STAGEHOW[it.key] = r.matched || "";
    // Two references in one file can still collide with each other.
    if(it.key) seen.set(lc(it.key), "shelf");
    const t = ntitle(it.title);
    if(t) seen.set("t:"+t, "shelf");
    fresh.push(it);
  });
  if(fresh.length){
    DOC.staging = staged().concat(fresh);
    markDirty();
  }
  renderStage(); renderCounts(); renderPaintbar();
  const skipped = [ onBoard ? `${onBoard} already on the board` : "",
                    onShelf ? `${onShelf} already staged` : "" ].filter(Boolean).join(", ");
  toast(`${label}: ${refs.length} read · ${fresh.length} staged`+(skipped?` · ${skipped}`:""), 6000);
  if(!fresh.length) return;
  // Same courtesy the board gives a paper added from search : one that turns out
  // to be in the library arrives with the modalities ` prma modalities ` stamped.
  fetchMeta(fresh.map(it=>it.key), true).then(()=>{
    let n = 0;
    fresh.forEach(it=>{
      const m = META[it.key];
      if(!it.mods.length && m && m.mods && m.mods.length){
        it.mods = m.mods.slice(); sortVals(it); m.mods.forEach(v=>rememberValue("mod", v)); n++;
      }
    });
    if(n) markDirty();
    renderStage(); renderPaintbar();
  });
}

$("#stage").addEventListener("click", e=>{
  const row = e.target.closest(".srow");
  const x   = e.target.closest(".cellchips .x");
  if(x && row){
    const it = findStage(row.dataset.key);
    if(it){ toggleValue(it, x.dataset.kind, x.dataset.drop); renderStage(); renderPaintbar(); }
    return;
  }
  if(row && e.target.closest('[data-act="sadd"]')){  addStaged([ row.dataset.key ]);  return; }
  if(row && e.target.closest('[data-act="sdrop"]')){ dropStaged([ row.dataset.key ]); return; }
  if(e.target.id === "stageadd"){  addStaged(picked().map(it=>it.key));  return; }
  if(e.target.id === "stagedrop"){ dropStaged(picked().map(it=>it.key)); return; }
  if(e.target.id === "stageall"){
    SOFF = new Set(picked().length === staged().length ? staged().map(it=>it.key) : []);
    renderStage();
  }
});
$("#stage").addEventListener("change", e=>{
  const row = e.target.closest(".srow");
  if(!row || !e.target.matches(".pick")) return;
  if(e.target.checked) SOFF.delete(row.dataset.key); else SOFF.add(row.dataset.key);
  refreshStageHead();
});
$("#stage").addEventListener("input", e=>{
  const row = e.target.closest(".srow");
  if(!row || !e.target.matches(".stitle")) return;
  const it = findStage(row.dataset.key);
  if(it && it.title !== e.target.value){ it.title = e.target.value; markDirty(); }
});

// ---- importing a reference list -------------------------------------------
// A bibliography -- the list at the end of a review, a .docx a collaborator
// sent, a block pasted straight off a PDF -- read by src/db/refparse.py and
// staged. Papers this board already has are counted and skipped, so re-pasting
// a list you've grown only brings in what's new.
async function parseRefs(body, type, label){
  toast(`Reading ${label}…`, 20000);
  let d;
  try {
    d = await (await fetch("/api/refs/parse", { method:"POST",
      headers:{ "Content-Type": type }, body })).json();
  } catch(e){ toast("Could not read that ( offline? )", 4000); return; }
  if(!d || !d.ok){ toast(`Could not read that — ${esc((d&&d.error)||"no answer from the server")}`, 6000); return; }
  if(!(d.refs||[]).length){ toast(`No references found in ${label}`, 4000); return; }
  stageRefs(d.refs, label);
}
function refFile(f){
  $("#overlay").classList.remove("show");
  parseRefs(f, "application/octet-stream", f.name);
}
$("#refsbtn").addEventListener("click", ()=>{
  sheet(`
    <h3>Import a reference list</h3>
    <p>Paste references below — numbered or not, AMA / APA / IEEE, whatever your source uses — or
       drop a <kbd>.docx</kbd> / <kbd>.txt</kbd> on the box under it. Everything lands on the
       <b>staging shelf</b> above the board, where you fix titles and tag them before they go into
       a tier. Anything already on the board is skipped.</p>
    <textarea id="reftext" spellcheck="false" placeholder="33.&#9;Comte A, Gabriel D, Pazart L, et al. On the difficulty to communicate with fMRI-based protocols used to identify covert awareness. Neuroscience. 2015;300:448-459. doi:10.1016/j.neuroscience.2015.05.059"></textarea>
    <div class="drop" id="refdrop">or drop a <b>.docx</b> / <b>.txt</b> here, or <a href="#" id="refpick">choose a file</a></div>
    <div class="btns">
      <button data-act="cancel">Cancel</button>
      <button class="primary" data-act="parse">Read them</button>
    </div>`, act=>{
    if(act !== "parse") return;
    const text = (($("#reftext")||{}).value || "").trim();
    if(!text){ toast("Nothing pasted"); return; }
    parseRefs(JSON.stringify({ text }), "application/json", "the pasted text");
  }, true);
  const pick = $("#refpick"), drop = $("#refdrop"), ta = $("#reftext");
  pick.onclick = ev=>{
    ev.preventDefault();
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".docx,.txt,.md,.text,text/plain";
    inp.onchange = ()=>{ const f = inp.files && inp.files[0]; if(f) refFile(f); };
    inp.click();
  };
  // The page's own row / hit dragging bails on anything it didn't start ( it
  // checks dragKey / dragHit ), so a file dropped here only has the browser's
  // "navigate to it" default to beat.
  drop.ondragover  = ev=>{ ev.preventDefault(); ev.stopPropagation(); drop.classList.add("over"); };
  drop.ondragleave = ()=> drop.classList.remove("over");
  drop.ondrop = ev=>{
    ev.preventDefault(); ev.stopPropagation(); drop.classList.remove("over");
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if(f) refFile(f);
  };
  if(ta) ta.focus();
});

// ---------------------------------------------------------------------------
// Mutations
// ---------------------------------------------------------------------------
function newItem(hit){
  return {
    key: hit.key, title: hit.title||"", doi: hit.doi||"", wid: hit.wid||"",
    pdf: hit.pdf_local ? "" : (hit.pdf||""),
    year: hit.year||null, journal: hit.journal||"",
    mods: hit.mods ? hit.mods.slice() : [], tags: [],
    fields: Object.fromEntries(DOC.columns.map(c=>[c.id,""])), added_at: nowISO(),
  };
}
async function addPaper(hit, tierId){
  if(findItem(hit.key)){ toast("Already on the list"); return; }
  const t = DOC.tiers.find(t=>t.id===(tierId||addTier)) || DOC.tiers[DOC.tiers.length-1];
  const it = newItem(hit);
  // Pre-fill the modalities ` prma modalities ` already worked out for this paper.
  if(!it.mods.length){
    const m = META[hit.key];
    if(m && m.mods){ it.mods = m.mods.slice(); sortVals(it); }
  }
  t.items.unshift(it);
  markDirty(); renderAll();
  const el = rowEl(it.key);
  if(el){ el.classList.add("flash"); el.scrollIntoView({ block:"center", behavior:"smooth" }); }
  const got = await fetchMeta([it.key], true);
  const m = got[it.key];
  if(m && !it.mods.length && m.mods && m.mods.length){
    it.mods = m.mods.slice(); sortVals(it); markDirty(); refreshCell(it.key, "mod"); renderPaintbar();
  }
  renderCounts();
  // The hit list stays open for the next add -- re-render it so this one now
  // reads "✓ <tier>" instead of offering ＋ Add again.
  if(hits.length) renderResults();
}
// One click removes ; the toast undoes it. No confirm dialog -- an undo you can
// actually see beats a modal you have to dismiss on every delete.
function removeItem(key){
  const f = findItem(key);
  if(!f) return;
  const tier = f.tier, at = f.idx;
  const [gone] = tier.items.splice(at, 1);
  SEL.delete(key);
  markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  toast(`Removed “${(gone.title||gone.key).slice(0,60)}”`, 6000, "Undo", ()=>{
    tier.items.splice(Math.min(at, tier.items.length), 0, gone);
    markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  });
}
function moveItem(key, tierId, index){
  const f = findItem(key);
  const t = DOC.tiers.find(t=>t.id===tierId);
  if(!f || !t) return;
  const [it] = f.tier.items.splice(f.idx, 1);
  if(f.tier.id === tierId && f.idx < index) index--;
  t.items.splice(Math.max(0, Math.min(index, t.items.length)), 0, it);
  markDirty(); renderBoard(); renderCounts();
}
function toggleValue(it, kind, value){
  const list = kind==="mod" ? it.mods : it.tags;
  const i = list.findIndex(v=>v.toLowerCase()===value.toLowerCase());
  if(i>=0) list.splice(i,1); else list.push(value);
  sortVals(it);
  rememberValue(kind, value);
  markDirty();
}
function addValue(it, kind, value){
  value = (value||"").trim();
  if(!value) return false;
  const list = kind==="mod" ? it.mods : it.tags;
  if(list.some(v=>v.toLowerCase()===value.toLowerCase())) return false;
  list.push(value);
  sortVals(it);
  rememberValue(kind, value);
  markDirty();
  return true;
}

// ---------------------------------------------------------------------------
// Search ( the same /api/search the dashboard uses )
//
// Two ways to find a paper, and the default is the one you actually want here :
//   match titles ( mode=title ) -- type any piece of a title and the closest
//     titles come back, best first. Nothing has to match exactly, so a typo, a
//     missing word or two words the wrong way round still lands the paper.
//   full text   ( mode=text )  -- the boolean search over the whole OCR'd body,
//     for when you're hunting a phrase rather than a paper.
// See src/dashboard/index.py :: title_search .
// ---------------------------------------------------------------------------
let hits = [], hitIdx = 0, hitTotal = 0, hitFuzzy = false, hitMode = "title", searchTimer = null;
async function runSearch(){
  const q = $("#q").value.trim();
  if(!q){ closeResults(); return; }
  const pool = $("#pool").value, mode = $("#smode").value;
  let d;
  try {
    d = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&pool=${pool}`+
      `&mode=${mode}&sort=relevance&limit=25&hide_skipped=0`)).json();
  } catch(e){ return; }
  if(d.status !== "ready"){
    $("#results").innerHTML = `<div class="rhint">The search index isn't built yet — open the dashboard once to build it.</div>`;
    $("#results").classList.add("show");
    return;
  }
  hits = d.results || []; hitIdx = 0; hitTotal = d.total; hitFuzzy = !!d.fuzzy;
  hitMode = d.mode || mode;
  renderResults();
  fetchMeta(hits.map(h=>h.key), true).then(()=>renderResults());
}
function renderResults(){
  if(!hits.length){
    $("#results").innerHTML = `<div class="rhint">Nothing close to that${hitMode==="title"?" in any title":""}.</div>`;
    $("#results").classList.add("show");
    return;
  }
  const tname = (DOC.tiers.find(t=>t.id===addTier)||{}).label || "Unranked";
  const what = hitFuzzy ? `<span style="color:var(--warn)">nothing came close — the least-far-off titles</span>`
             : hitMode === "title" ? `${hits.length} closest title${hits.length===1?"":"s"}`
             : `${hits.length} of ${hitTotal}`;
  $("#results").innerHTML =
    `<div class="rhint">${what} · ↵ adds to <b>${esc(tname)}</b> · drag a hit onto any tier</div>`+
    hits.map((h,i)=>{
      const on = findItem(h.key);
      const m  = META[h.key] || {};
      const mods = (m.mods||[]).map(v=>`<span class="chip" ${chipStyle("mod",v)}>${esc(v)}</span>`).join(" ");
      return `<div class="hit ${i===hitIdx?'sel':''}" data-i="${i}" draggable="true">`+
        `<div style="flex:1;min-width:0">`+
          `<div class="ht">${esc(h.title||h.key)}</div>`+
          `<div class="hm">${h.year?esc(h.year):""}${h.journal?" · "+esc(h.journal):""}`+
            `${h.cited_by!=null?` · ${h.cited_by} cites`:""} ${mods}</div>`+
        `</div>`+
        (on ? `<div class="in">✓ ${esc(on.tier.label)}</div>`
            : `<button class="add" data-i="${i}">＋ Add</button>`)+
      `</div>`;
    }).join("");
  $("#results").classList.add("show");
}
function closeResults(){ $("#results").classList.remove("show"); hits = []; }
function moveHit(delta){
  if(!hits.length) return;
  hitIdx = Math.max(0, Math.min(hits.length-1, hitIdx+delta));
  $$("#results .hit").forEach((el,i)=>el.classList.toggle("sel", i===hitIdx));
  const el = $$("#results .hit")[hitIdx];
  if(el) el.scrollIntoView({ block:"nearest" });
}

// ---------------------------------------------------------------------------
// Autocomplete ( modality / tag chip inputs )
// ---------------------------------------------------------------------------
let AC = { input:null, opts:[], idx:0 };
// The rows a chip input types onto : one board row, one staged row, or -- from
// the shelf's own "+ tag checked" box -- every checked staged row at once. One
// function so the autocomplete, and everything below it, is written once.
function acTargets(input){
  if(input.id === "stagetag") return picked();
  const s = input.closest(".srow");
  if(s){ const it = findStage(s.dataset.key); return it ? [ it ] : []; }
  const r = input.closest(".row");
  if(r){ const f = findItem(r.dataset.key); return f ? [ f.it ] : []; }
  return [];
}
function acOptions(input){
  const kind = input.dataset.kind;
  const opts = kind==="mod" ? modOptions() : tagOptions();
  const targets = acTargets(input);
  // Offer what at least one target hasn't got : with several rows picked, a
  // value some of them are missing is exactly the one you're reaching for.
  const have = targets.length
    ? opts.filter(v=>targets.every(it=>hasValue(it, kind, v))).map(lc) : [];
  const term = input.value.trim().toLowerCase();
  return opts.filter(v=>!have.includes(lc(v)))
    .filter(v=>!term || v.toLowerCase().includes(term));
}
function acOpen(input){
  AC.input = input; AC.idx = 0; AC.opts = acOptions(input);
  acRender();
}
function acRender(){
  const pop = $("#acpop");
  if(!AC.input){ pop.classList.remove("show"); return; }
  const term = AC.input.value.trim();
  const body = AC.opts.map((v,i)=>`<div class="acopt ${i===AC.idx?'sel':''}" data-v="${esc(v)}">${esc(v)}</div>`).join("");
  const isNew = term && !AC.opts.some(v=>v.toLowerCase()===term.toLowerCase());
  pop.innerHTML = body + (isNew?`<div class="acnew">↵ creates “${esc(term)}”</div>`:"") ||
    `<div class="acnew">type to create a new one</div>`;
  const r = AC.input.getBoundingClientRect();
  pop.style.left = (r.left + window.scrollX) + "px";
  pop.style.top  = (r.bottom + window.scrollY + 4) + "px";
  pop.classList.add("show");
}
function acClose(){ AC.input = null; AC.opts = []; $("#acpop").classList.remove("show"); }
function acCommit(value){
  const input = AC.input;
  if(!input) return;
  const kind = input.dataset.kind;
  const row  = input.closest(".row"), srow = input.closest(".srow");
  const v = (value != null ? value : input.value).trim();
  if(!v){ acClose(); return; }
  const n = acTargets(input).filter(it=>addValue(it, kind, v)).length;
  if(!n){ input.value = ""; acClose(); return; }
  acClose();
  if(row){
    refreshCell(row.dataset.key, kind); renderPaintbar();
    // The cell was re-rendered , so the input is a NEW element : put the caret
    // back in it so several tags in a row is just typing.
    const again = rowEl(row.dataset.key).querySelector(`.chipin[data-kind="${kind}"]`);
    if(again) again.focus();
    return;
  }
  // The shelf : same idea, one level up -- redraw it, then put the caret back.
  renderStage(); renderPaintbar(); renderCounts();
  const again = srow
    ? ( srowEl(srow.dataset.key) || document ).querySelector(`.chipin[data-kind="${kind}"]`)
    : $("#stagetag");
  if(again) again.focus();
  if(!srow) toast(`Tagged ${n} staged row(s) “${v}”`);
}

// ---------------------------------------------------------------------------
// Drag and drop ( rows between tiers, and hits from the search panel )
// ---------------------------------------------------------------------------
let dragKey = null, dragHit = null;
function clearDropMarks(){
  $$(".row").forEach(r=>r.classList.remove("drop-before","drop-after"));
  $$(".rows").forEach(r=>r.classList.remove("dropinto"));
}
function dropTarget(e){
  // Dropping on a tier's HEADER means "into this tier" ( at the top ) -- the
  // easiest target to hit when the tier is long or empty.
  const head = e.target.closest(".tierhead");
  if(head) return { tier: head.closest(".tier").dataset.tier, index:0, row:null, after:false };
  const rows = e.target.closest(".rows");
  if(!rows) return null;
  const row = e.target.closest(".row");
  const tid = rows.dataset.tier;
  if(!row) return { tier:tid, index:(itemsOf(tid)||[]).length, row:null, after:false };
  const r = row.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  const list = itemsOf(tid) || [];
  const idx  = list.findIndex(x=>x.key===row.dataset.key);
  return { tier:tid, index: idx + (after?1:0), row, after };
}
document.addEventListener("dragover", e=>{
  if(!dragKey && !dragHit) return;
  const t = dropTarget(e);
  if(!t) return;
  e.preventDefault();
  clearDropMarks();
  if(t.row) t.row.classList.add(t.after?"drop-after":"drop-before");
  else document.querySelector(`.rows[data-tier="${cssEsc(t.tier)}"]`).classList.add("dropinto");
});
document.addEventListener("drop", async e=>{
  if(!dragKey && !dragHit) return;
  const t = dropTarget(e);
  clearDropMarks();
  if(!t){ dragKey = dragHit = null; return; }
  e.preventDefault();
  if(dragKey){ moveItem(dragKey, t.tier, t.index); }
  else if(dragHit){
    const hit = dragHit;
    if(!findItem(hit.key)){
      const it = newItem(hit);
      const m  = META[hit.key];
      if(m && m.mods){ it.mods = m.mods.slice(); sortVals(it); }
      const list = itemsOf(t.tier);
      if(list){ list.splice(Math.min(t.index, list.length), 0, it); markDirty(); renderAll(); renderCounts();
        fetchMeta([it.key], true); }
    } else toast("Already on the list");
  }
  dragKey = dragHit = null;
});

// Type a rank into a row's number and press ↵ ( or tab away ) to send it to that
// place in its tier. Out of range clamps to the ends. Moving BETWEEN tiers is
// the row's tier dropdown, or a drag.
function applyNumber(input){
  const row = input.closest(".row");
  if(!row) return;
  const f = findItem(row.dataset.key);
  if(!f) return;
  const want = parseInt(String(input.value).replace(/[^0-9]/g,""), 10);
  if(isNaN(want) || want === f.idx+1){ input.value = f.idx+1; return; }
  const to = Math.max(0, Math.min(want-1, f.tier.items.length-1));
  moveItem(f.it.key, f.tier.id, to > f.idx ? to+1 : to);
  const again = rowEl(f.it.key);
  if(again){
    const el = again.querySelector(".numin");
    if(el){ el.focus(); el.select(); }
    again.classList.add("flash");
    again.scrollIntoView({ block:"nearest" });
  }
}

    const f = findItem(e.target.closest(".row").dataset.key);
    if(f) e.target.value = f.idx+1;

// ---- rearranging a chip bar ------------------------------------------------
// Drag a chip along its bar and it stays where you put it : each bar's order is
// its vocabulary's ( see chipOptions / reorderVocab ), so chips you want read
// together can be grouped, and the grouping is the board's rather than this
// browser's. A chip only moves within its OWN bar -- modalities and tags are
// separate vocabularies and one order can't hold both.
//
// A drag that never moves isn't a drag : the browser fires no dragstart, the
// click lands as usual, and a chip still arms / filters / tags exactly as before.
let dragChip = null;   // { kind , value }
function clearChipMarks(){ $$(".chips .chip").forEach(c=>c.classList.remove("dropL","dropR","tdrag")); }
function wireChipDrag(barId, kind){
  const bar = $(barId);
  bar.addEventListener("dragstart", e=>{
    const c = e.target.closest(".chip");
    if(!c) return;
    dragChip = { kind, value: c.dataset.val };
    c.classList.add("tdrag");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", c.dataset.val); } catch(err){}
  });
  bar.addEventListener("dragover", e=>{
    if(!dragChip || dragChip.kind !== kind) return;
    e.preventDefault(); e.stopPropagation();
    $$(barId+" .chip").forEach(c=>c.classList.remove("dropL","dropR"));
    const c = e.target.closest(".chip");
    if(!c || lc(c.dataset.val) === lc(dragChip.value)) return;
    const r = c.getBoundingClientRect();
    c.classList.add((e.clientX - r.left) > r.width/2 ? "dropR" : "dropL");
  });
  bar.addEventListener("drop", e=>{
    if(!dragChip || dragChip.kind !== kind) return;
    e.preventDefault(); e.stopPropagation();
    const c = e.target.closest(".chip");
    let onto = null, before = false;
    if(c && lc(c.dataset.val) !== lc(dragChip.value)){
      const r = c.getBoundingClientRect();
      onto   = c.dataset.val;
      before = (e.clientX - r.left) <= r.width/2;
    }
    const what = dragChip.value;
    dragChip = null;
    clearChipMarks();
    reorderVocab(kind, what, onto, before);     // no target -> the end of the bar
  });
}

// Two filters, ANDed : the text box, and the set of chips picked in the paint
// bar ( 🔎 Filter ). A row hidden by either drops out of the selection too, so
// the chips never tag a paper you can't see.
function matchesChips(it){
  if(!TAGF.size) return true;
  const have = new Set([].concat((it.mods||[]).map(v=>"mod:"+lc(v)),
                                 (it.tags||[]).map(v=>"tag:"+lc(v))));
  const want = Array.from(TAGF).map(s=>{ const i = s.indexOf(":"); return s.slice(0,i+1) + lc(s.slice(i+1)); });
  return filterAll ? want.every(w=>have.has(w)) : want.some(w=>have.has(w));
}
function applyFilter(){
  const q = $("#filter").value.trim().toLowerCase();
  let shown = 0, pruned = false;
  $$(".row").forEach(row=>{
    const f = findItem(row.dataset.key);
    if(!f) return;
    const hay = q ? [ f.it.title, f.it.key, f.it.doi, (f.it.mods||[]).join(" "), (f.it.tags||[]).join(" "),
      Object.values(f.it.fields||{}).join(" ") ].join(" ").toLowerCase() : "";
    const hide = (q && !hay.includes(q)) || !matchesChips(f.it);
    row.classList.toggle("hide", hide);
    if(hide){ if(SEL.delete(row.dataset.key)) pruned = true; }
    else shown++;
  });
  if(pruned) paintSelection();
  renderNote(shown);
}

// CSV in / out
//
// The header is the one the hand-made spreadsheets already used , so a file
// exported here reads the same as the ones that came before it , and one of
// those imports straight back : Tier , Tier_Description , DOI_or_Key , Title ,
// Year , Modalities_Tagged , Tags , < every free-text column > , MD_File.
