const csvCell = v => {
  const s = (v==null ? "" : String(v));
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
};
function toCSV(){
  const head = [ "Tier","Tier_Description","DOI_or_Key","Title","Year","Modalities_Tagged","Tags" ]
    .concat(DOC.columns.map(c=>c.label)).concat([ "MD_File" ]);
  const lines = [ head.map(csvCell).join(",") ];
  DOC.tiers.forEach(t=>t.items.forEach(it=>{
    const m = META[it.key] || {};
    lines.push([
      t.label, t.desc||"", it.key, it.title||m.title||"", it.year||m.year||"",
      (it.mods||[]).join("; "), (it.tags||[]).join("; "),
    ].concat(DOC.columns.map(c=>(it.fields||{})[c.id]||""))
     .concat([ m.has_md ? fileStem(it.key)+".md" : "" ])
     .map(csvCell).join(","));
  }));
  return lines.join("\n");
}
$("#exportbtn").addEventListener("click", ()=>{
  const blob = new Blob([ toCSV() ], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `prma-tiers-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});
function parseCSV(text){
  const rows = []; let row = [], field = "", q = false, i = 0;
  text = text.replace(/^\uFEFF/, "").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i < text.length){
    const c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ q = true; i++; continue; }
    if(c === ','){ row.push(field); field = ""; i++; continue; }
    if(c === '\n'){ row.push(field); field = ""; rows.push(row); row = []; i++; continue; }
    field += c; i++;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim().length));
}
const HEAD_TIER  = /^tier$/i, HEAD_DESC = /^tier[_ ]?desc/i;
const HEAD_KEY   = /^(doi[_ ]?or[_ ]?key|key)$/i, HEAD_DOI = /^doi$/i;
const HEAD_TITLE = /^title$/i, HEAD_YEAR = /^year$/i;
const HEAD_MODS  = /^modalit/i, HEAD_TAGS = /^tags?$/i, HEAD_MD = /^md[_ ]?file$/i;
const splitList  = s => String(s||"").split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
function docFromCSV(rows, merge){
  const head = rows[0].map(h=>String(h||"").trim());
  const idx  = { tier:-1, desc:-1, key:-1, doi:-1, title:-1, year:-1, mods:-1, tags:-1 };
  const extra = [];      // column index -> { id , label }
  head.forEach((h,i)=>{
    if(HEAD_TIER.test(h)) idx.tier = i;
    else if(HEAD_DESC.test(h)) idx.desc = i;
    else if(HEAD_KEY.test(h)) idx.key = i;
    else if(HEAD_DOI.test(h)) idx.doi = i;
    else if(HEAD_TITLE.test(h)) idx.title = i;
    else if(HEAD_YEAR.test(h)) idx.year = i;
    else if(HEAD_MODS.test(h)) idx.mods = i;
    else if(HEAD_TAGS.test(h)) idx.tags = i;
    else if(HEAD_MD.test(h)) { /* derived from the key -- not stored */ }
    else if(h) extra.push({ i, id: slug(h,"col"), label: h });
  });
  const doc = merge
    ? JSON.parse(JSON.stringify(DOC))
    : { version:1, updated_at:"", columns:[],
        vocab:{ tags: JSON.parse(JSON.stringify(DOC.vocab.tags||[])) ,
                mods: JSON.parse(JSON.stringify(DOC.vocab.mods||[])) },
        // "Replace everything" replaces the BOARD. The staging shelf is not the
        // board -- it is references you haven't triaged yet -- so it survives ,
        // the same way the tag vocabulary above does.
        staging: JSON.parse(JSON.stringify(DOC.staging||[])) ,
        tiers:[ { id:STAGING, label:"Unranked", desc:"Added but not ranked yet", color:"#8b94a3", locked:true, items:[] } ] };
  // Every unrecognised header becomes a free-text column ( Notes included : it
  // is just the column that ships by default ).
  extra.forEach(x=>{ if(!doc.columns.some(c=>c.id===x.id)) doc.columns.push({ id:x.id, label:x.label }); });
  if(!doc.columns.length) doc.columns.push({ id:"notes", label:"Notes" });
  const findTier = (label, desc)=>{
    const want = String(label||"Unranked").trim() || "Unranked";
    let t = doc.tiers.find(t=>t.label.toLowerCase()===want.toLowerCase());
    if(!t){
      let id = slug(want,"tier") || ("t"+doc.tiers.length);
      while(doc.tiers.some(x=>x.id===id)) id += "-2";
      t = { id, label:want, desc:desc||"", color:"#9aa3b2", locked:false, items:[] };
      const at = doc.tiers.findIndex(x=>x.id===STAGING);
      doc.tiers.splice(at<0?doc.tiers.length:at, 0, t);
    }
    if(desc && !t.desc) t.desc = desc;
    return t;
  };
  let added = 0, updated = 0;
  rows.slice(1).forEach(r=>{
    const cell = i => (i>=0 && i<r.length) ? String(r[i]).trim() : "";
    const title = cell(idx.title);
    const key   = cell(idx.key) || cell(idx.doi) || ("loose-" + (slug(title,"row") || Math.random().toString(36).slice(2,9)));
    const t     = findTier(cell(idx.tier), cell(idx.desc));
    const fields = {};
    extra.forEach(x=>{ fields[x.id] = cell(x.i); });
    const year = parseInt(cell(idx.year), 10);
    // Same key already on the board -> update it in place ( and move it to the
    // tier the file says ) rather than making a second row for the same paper.
    let existing = null;
    for(const tt of doc.tiers){
      const j = tt.items.findIndex(x=>x.key===key);
      if(j>=0){ existing = tt.items[j]; if(tt!==t){ tt.items.splice(j,1); t.items.push(existing); } break; }
    }
    if(existing){
      if(title) existing.title = title;
      if(!isNaN(year)) existing.year = year;
      const mods = splitList(cell(idx.mods)), tags = splitList(cell(idx.tags));
      if(mods.length) existing.mods = mods.sort(byName);
      if(tags.length) existing.tags = Array.from(new Set((existing.tags||[]).concat(tags))).sort(byName);
      existing.fields = Object.assign(existing.fields||{}, fields);
      updated++;
    } else {
      t.items.push({
        key, title, doi: cell(idx.doi) || (/^10\./.test(key) ? key : ""), wid:"",
        year: isNaN(year) ? null : year, journal:"",
        mods: splitList(cell(idx.mods)).sort(byName), tags: splitList(cell(idx.tags)).sort(byName),
        fields, added_at: nowISO(),
      });
      added++;
    }
  });
  // Any tag / modality the file introduced joins its vocabulary, so it gets a
  // colour of its own and paints like the rest.
  doc.tiers.forEach(t=>t.items.forEach(it=>{
    [ [ "tags" , doc.vocab.tags ] , [ "mods" , doc.vocab.mods ] ].forEach(([field, list])=>{
      (it[field]||[]).forEach(name=>{
        if(!list.some(x=>x.name.toLowerCase()===name.toLowerCase()))
          list.push({ name, color: PALETTE[list.length % PALETTE.length] });
      });
    });
  }));
  return { doc, added, updated };
}
$("#importbtn").addEventListener("click", ()=>{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".csv,text/csv";
  inp.onchange = async ()=>{
    const file = inp.files && inp.files[0];
    if(!file) return;
    let rows;
    try { rows = parseCSV(await file.text()); }
    catch(e){ toast("Could not read that file"); return; }
    if(rows.length < 2){ toast("That CSV has no rows"); return; }
    sheet(`
      <h3>Import ${rows.length-1} row(s) from ${esc(file.name)}</h3>
      <p>Columns found: ${rows[0].filter(Boolean).map(h=>`<kbd>${esc(h)}</kbd>`).join(" ")}</p>
      <p>Anything that isn't Tier / DOI_or_Key / Title / Year / Modalities / Tags becomes its own
         free-text column. Rows whose key is already on the board are updated in place.</p>
      <div class="btns">
        <button data-act="cancel">Cancel</button>
        <button data-act="merge">Merge into this list</button>
        <button data-act="replace">Replace everything</button>
      </div>`, act=>{
      if(act==="cancel") return;
      const r = docFromCSV(rows, act==="merge");
      DOC = r.doc;
      if(!DOC.tiers.some(t=>t.id===addTier)) addTier = STAGING;
      markDirty(); renderAll();
      fetchMeta(allItems().map(({it})=>it.key), true).then(()=>{
        // Fill in modalities for anything the file didn't carry any for.
        let n = 0;
        allItems().forEach(({it})=>{
          const m = META[it.key];
          if(!it.mods.length && m && m.mods && m.mods.length){ it.mods = m.mods.slice(); sortVals(it); n++; }
        });
        if(n){ markDirty(); renderBoard(); renderPaintbar(); }
        toast(`Imported — ${r.added} added, ${r.updated} updated${n?`, ${n} auto-tagged`:""}`, 4200);
      });
    });
  };
  inp.click();
});

function sheet(html, onAct, wide){
  $("#sheet").innerHTML = html;
  $("#sheet").classList.toggle("wide", !!wide);
  $("#overlay").classList.add("show");
  $("#sheet").onclick = e=>{
    const b = e.target.closest("button[data-act]");
    if(!b) return;
    $("#overlay").classList.remove("show");
    if(onAct) onAct(b.dataset.act);
  };
}
