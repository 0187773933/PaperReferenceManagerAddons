<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prma dashboard</title>
<!-- Apply the saved theme BEFORE first paint so there's no flash. Default light. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("prma-theme")||"light";}catch(e){document.documentElement.dataset.theme="light";}</script>
<style>
  /* Light theme is the default ; dark is opt-in via [data-theme="dark"] on
     <html> ( set from localStorage before paint -- see the inline <head> script
     -- and toggled by the header ☀/🌙 button ). Every colour is a variable so
     the swap is just these two blocks. */
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#ffffff; --line:#dce1e8;
    --fg:#1a1d23; --muted:#5b6470; --accent:#1a73e8; --green:#046A38;
    --chip:#eceff3; --visited:#CEA052;
  }
  :root[data-theme="dark"] {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a3038;
    --fg:#e6e9ef; --muted:#8b94a3; --accent:#3ea6ff; --green:#046A38;
    --chip:#262c37; --visited:#CEA052;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header {
    position:sticky; top:0; z-index:5; background:var(--panel);
    border-bottom:1px solid var(--line); padding:12px 18px;
  }
  .titlebar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .titlebar h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
  .counts { color:var(--muted); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .counts b { color:var(--fg); font-weight:600; }
  .grow { flex:1; }
  button {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:7px 12px; cursor:pointer; font-size:13px;
  }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#04121f; border-color:var(--accent); font-weight:600; }
  .navlink {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:7px 12px; font-size:13px; text-decoration:none;
  }
  .navlink:hover { border-color:var(--accent); }
  .controls { display:flex; gap:10px; align-items:center; margin-top:11px; flex-wrap:wrap; }
  input[type=search] {
    flex:1; min-width:240px; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:10px 13px; font-size:14px;
  }
  input[type=search]:focus { outline:none; border-color:var(--accent); }
  select {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font-size:13px;
  }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab {
    padding:7px 13px; border-radius:7px; cursor:pointer; font-size:13px;
    background:var(--chip); border:1px solid transparent; color:var(--muted);
  }
  .tab.active { color:var(--fg); border-color:var(--accent); background:var(--panel2); }
  .tab .n { color:var(--muted); font-size:11px; margin-left:5px; }
  .hint { color:var(--muted); font-size:11px; }
  thead th.sortable:hover { color:var(--fg); }
  thead th.active { color:var(--accent); }
  th .arrow { font-size:10px; margin-left:3px; }
  th .arrow .srank { font-size:8px; opacity:.65; margin-left:1px; vertical-align:super; }
  .end { color:var(--muted); text-align:center; padding:18px; font-size:12px; }
  main { padding:16px 18px 60px; }
  .status { color:var(--muted); font-size:12px; margin:4px 2px 12px; }
  .build {
    margin:48px auto; max-width:520px; text-align:center; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:34px;
  }
  .build h2 { color:var(--fg); font-size:16px; margin:0 0 8px; }
  .spinner {
    width:26px; height:26px; margin:0 auto 16px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent); animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Live --watch processing toast ( bottom-right ). Hidden unless the
     background worker is scanning / processing a newly added paper. */
  #procbar {
    position:fixed; right:18px; bottom:18px; z-index:50; max-width:340px;
    display:none; align-items:center; gap:11px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:11px 14px; box-shadow:0 6px 24px rgba(0,0,0,.28);
    color:var(--fg); font-size:13px;
  }
  #procbar.show { display:flex; }
  #procbar .spinner { width:18px; height:18px; margin:0; border-width:2px; flex:none; }
  #procbar .pb-sub { color:var(--muted); font-size:11px; margin-top:2px; }
  #procbar .pb-title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    position:sticky; top:0; text-align:left; color:var(--muted); font-weight:600;
    padding:8px 10px; border-bottom:1px solid var(--line); background:var(--bg); white-space:nowrap;
  }
  tbody td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:hover { background:var(--panel); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; color:var(--fg); white-space:nowrap; }
  td.title { max-width:640px; }
  .tt { font-weight:500; }
  /* Title is a link to the same proxy URL as the row's Proxy button, but styled
     as plain text : no underline, normal colour -- only recolours once visited
     so you can see at a glance which papers you've already opened. */
  a.titlelink { color:var(--fg); text-decoration:none; }
  a.titlelink:hover { color:var(--accent); }
  a.titlelink:visited { color:var(--visited); }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:9px; white-space:nowrap; }
  .links a:hover { text-decoration:underline; }
  .muted { color:var(--muted); }
  .pill {
    display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px;
    background:var(--chip); color:var(--muted); margin-left:6px;
  }
  .pill.lib { background:#13301f; color:#5fd99a; }
  .pill.ref { background:#1a2740; color:#7fb6ff; }
  .pill.cb  { background:#2e2440; color:#c79bff; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  /* In-Library "Read" accordion */
  tr.readrow td { background:var(--panel); padding:10px 14px 16px; }
  .reader { max-width:860px; }
  .readempty { color:var(--muted); }
  details.acc { border:1px solid var(--line); border-radius:8px; margin:8px 0; background:var(--panel2); }
  details.acc > summary {
    cursor:pointer; padding:9px 12px; font-weight:600; list-style:none; user-select:none;
  }
  details.acc > summary::-webkit-details-marker { display:none; }
  details.acc > summary::before { content:"▸"; color:var(--muted); margin-right:8px; }
  details.acc[open] > summary::before { content:"▾"; }
  details.acc[open] > summary { border-bottom:1px solid var(--line); }
  .accbody { padding:10px 14px; }
  .accbody p { margin:0 0 10px; }
  .accbody h4 { margin:14px 0 6px; font-size:14px; }
  .accbody img { max-width:100%; height:auto; border:1px solid var(--line); border-radius:6px; margin:8px 0; display:block; }
  .accbody a { color:var(--accent); }
  /* Skip / hide control + the header "Show skipped" toggle. */
  .skipbtn {
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:3px 9px; cursor:pointer; font-size:12px; white-space:nowrap;
  }
  .skipbtn:hover { color:var(--fg); border-color:var(--muted); }
  .skipbtn.skipped { color:var(--accent); border-color:var(--accent); }
  tr.dim { opacity:.45; }
  tr.dim:hover { opacity:.75; }
  #toggleSkipped.active { color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1>prma dashboard</h1>
    <div class="counts" id="counts"></div>
    <div class="grow"></div>
    <a class="navlink" href="/status" title="How far each paper has made it through the pipeline">▦ Status</a>
    <a class="navlink" href="/errors" title="Items the pipeline couldn't fully process">⚠ Errors</a>
    <button id="toggleTheme" title="Toggle light / dark theme">🌙 Dark</button>
    <button id="toggleSkipped" title="Show / hide the papers you've skipped">🚫 Show skipped</button>
    <button id="refresh">↻ Rebuild</button>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder='Search…  fMRI NOT EEG · "inner speech" OR aphasia · -review' autocomplete="off">
  </div>
  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="grow"></div>
    <div class="hint">click a column to sort · scroll for more</div>
  </div>
</header>
<main>
  <div class="status" id="status"></div>
  <div id="view"></div>
</main>
<div id="procbar">
  <div class="spinner"></div>
  <div style="min-width:0">
    <div class="pb-title" id="pb-title"></div>
    <div class="pb-sub" id="pb-sub"></div>
  </div>
</div>
<script>
const PROXY = "https://doi-org.ezproxy.libraries.wright.edu/";
// External papers NOT in your collection.
//   references = works that the papers you've collected cite / list in their
//               bibliographies, but that you haven't collected yourself.
//   cited_by   = newer works that cite the papers you've collected.
const TABS = [
  { id:"external",   label:"All missing", countKey:null,
    tip:"Every paper connected to your collection that isn't in it yet" },
  { id:"references", label:"In bibliographies", countKey:"references",
    tip:"Papers cited by the ones you've collected, that you don't have" },
  { id:"cited_by",   label:"Newer / citing", countKey:"cited_by",
    tip:"Newer papers that cite the ones you've collected, that you don't have" },
  { id:"authors",    label:"Authors", countKey:"authors",
    tip:"Most-frequent authors across the missing papers" },
  { id:"library",    label:"In Library", countKey:"library",
    tip:"Search the papers you already have in Zotero / Mendeley" },
];
let META = {};
let activeTab = "external";
let ready = false;

const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function links(r){
  const out = [];
  if(r.doi){
    out.push(`<a href="https://doi.org/${esc(r.doi)}" target="_blank">DOI</a>`);
    out.push(`<a href="${PROXY}${esc(r.doi)}" target="_blank">Proxy</a>`);
  }
  if(r.pdf){
    // Library papers carry a LOCAL path -> stream it via /pdf?key= ; external
    // rows carry a remote OA pdf url -> link straight to it.
    const href = r.pdf_local ? `/pdf?key=${encodeURIComponent(r.key)}` : esc(r.pdf);
    out.push(`<a href="${href}" target="_blank">PDF</a>`);
  }
  if(r.wid)  out.push(`<a href="https://openalex.org/${esc(r.wid)}" target="_blank">OA</a>`);
  // Library extras : montage grid ( prma images ) + section reader ( prma md ).
  if(r.montage) out.push(`<a href="${esc(r.montage)}" target="_blank" title="Figure montage">Figures</a>`);
  if(r.has_md)  out.push(`<a href="#" class="readlink" data-key="${esc(r.key)}">Read</a>`);
  return out.join(" ");
}

// Source-code / data links harvested by ` prma code ` ( abstract + OCR text ) ,
// each rendered as its host label ( GitHub / OSF / Dryad / … ) linking out to
// the repo. Empty -> a dim em-dash so the column reads cleanly.
function codeLinks(r){
  const ls = r.code_links || [];
  if(!ls.length) return `<span class="muted">—</span>`;
  return ls.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener" `+
    `title="${esc(l.url)}">${esc(l.source||"link")}</a>`).join(" ");
}

const fmt = n => (n||0).toLocaleString();
// created_at is an ISO-8601 stamp ( "2026-06-23T19:26:56+00:00" ) ; show just
// the date in the cell, keep the full timestamp in the tooltip.
const fmtDate = s => s ? String(s).slice(0,10) : "";
function renderCounts(){
  if(!ready){ $("#counts").innerHTML = ""; return; }
  $("#counts").innerHTML =
    `<span><b>${fmt(META.have)}</b> in library</span>`+
    `<span><b>${fmt((META.references||0)+(META.cited_by||0))}</b> papers you don't have</span>`+
    (META.built_at?`<span>indexed ${esc(META.built_at)}</span>`:"");
}
function tabCount(t){
  if(t.id==="external") return (META.references||0)+(META.cited_by||0);
  return t.countKey?META[t.countKey]:null;
}
function renderTabs(){
  if(!ready){ $("#tabs").innerHTML = ""; return; }
  $("#tabs").innerHTML = TABS.map(t=>{
    const c = tabCount(t);
    const badge = (c!=null)?`<span class="n">${fmt(c)}</span>`:"";
    return `<div class="tab ${t.id===activeTab?'active':''}" data-tab="${t.id}" title="${esc(t.tip||t.label)}">${t.label}${badge}</div>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(el=>{
    el.onclick = ()=>{ activeTab = el.dataset.tab; renderTabs(); newSearch(); };
  });
}

// Paper-pool columns. key=null -> not sortable. def = default direction when
// you first click the column. Each carries its own cell renderer so the body
// stays in sync with the header and columns can differ per tab.
const PAGE = 100;
const COLS_BASE = [
  { key:"lib_cites", label:"Conn.", title:"How many of your library papers connect to this work", def:"desc",
    cell:r=>`<td class="num">${r.lib_cites!=null?r.lib_cites:"·"}</td>` },
  { key:"cited_by",  label:"OA cites", title:"Global OpenAlex citation count", def:"desc",
    cell:r=>`<td class="num">${r.cited_by!=null?r.cited_by:""}</td>` },
  { key:"title",     label:"Title", def:"asc",
    cell:r=>{
      const t = esc(r.title);
      // Link the title to the same proxy URL as the Proxy button ( only when we
      // have a DOI ; otherwise plain text ). New tab, like the other row links.
      const inner = r.doi
        ? `<a class="titlelink" href="${PROXY}${esc(r.doi)}" target="_blank" rel="noopener">${t}</a>`
        : t;
      return `<td class="title"><div class="tt">${inner}</div>`+
             `<div class="meta">${esc(r.journal||"")}${r.hashtags?(" · "+esc(r.hashtags)):""}</div></td>`;
    } },
  { key:"year",      label:"Year", def:"desc",
    cell:r=>`<td class="num">${r.year||""}</td>` },
  { key:null,        label:"Links",
    cell:r=>`<td class="links">${links(r)}</td>` },
];
// "In Library" only : when each paper was first added ( created_at in its
// output/cache/papers/<key>.json record ). Inserted just before Links.
const COL_ADDED = { key:"created_at", label:"Added",
  title:"When this paper was first added to your library", def:"desc",
  cell:r=>`<td class="num" title="${esc(r.created_at||'')}">${esc(fmtDate(r.created_at))}</td>` };
// "In Library" only : source-code / data links ` prma code ` harvested from the
// paper's abstract + OCR text. Not sortable ; sits AFTER Links.
const COL_CODE = { key:"code", label:"Code", def:"desc",
  title:"Source-code / data links found in the abstract + OCR text ( prma code ) · sort to float papers that ship code",
  cell:r=>`<td class="links">${codeLinks(r)}</td>` };
// Skip / hide control. Not sortable. Persisted server-side ( POST /api/skip ) so
// skipped papers stay hidden across reloads ; the data is never deleted.
const COL_SKIP = { key:null, label:"",
  cell:r=>`<td class="skipcell"><button class="skipbtn${r.skipped?' skipped':''}" `+
          `data-key="${esc(r.key)}" `+
          `title="${r.skipped?'Restore this paper to the list':'Hide this paper from the list'}">`+
          `${r.skipped?'Unskip':'Skip'}</button></td>` };
function cols(){
  const c = COLS_BASE.slice();                  // [..., Year, Links]
  if(activeTab==="library") c.splice(c.length-1, 0, COL_ADDED); // before Links
  c.splice(c.length-1, 0, COL_SKIP);            // Skip sits just before Links
  if(activeTab==="library") c.push(COL_CODE);   // Code sits just after Links
  return c;
}
const TAB_LABEL = { external:"missing papers", references:"in bibliographies", cited_by:"newer / citing", library:"library papers" };
// Search state. `sortStack` is a TIERED sort : a list of { key , dir } levels ,
// PRIMARY FIRST , the rest tiebreakers. Clicking a NEW column makes it primary
// and demotes the previous one to a tiebreaker ( so "sort by code , then by
// year" keeps the code order within each year ) ; clicking the CURRENT primary
// collapses back to a single-column sort. Sent to the server comma-joined.
// `pristine` marks the untouched per-tab default so the FIRST click is a clean
// single-column sort ( we don't drag the implicit default in as a tiebreaker ) ;
// tiering then accumulates from the user's own picks.
let cur = { q:"", sortStack:[ { key:"lib_cites", dir:"desc" } ], pristine:true, offset:0, total:0, loading:false, done:false };
const sortParam   = ()=> cur.sortStack.map(s=>s.key).join(",");
const dirParam    = ()=> cur.sortStack.map(s=>s.dir).join(",");
// Drop any sort levels whose column isn't on the active tab ( e.g. leaving the
// In-Library tab clears a "code" / "Added" sort ) ; never leave the stack empty.
// A reset to the bare default is treated as pristine again.
function pruneStack(){
  const valid = new Set(cols().filter(c=>c.key).map(c=>c.key));
  const before = cur.sortStack.length;
  cur.sortStack = cur.sortStack.filter(s=>valid.has(s.key));
  if(!cur.sortStack.length){ cur.sortStack = [ { key:"lib_cites", dir:"desc" } ]; cur.pristine = true; }
  else if(cur.sortStack.length !== before){ cur.pristine = false; }
}
// When false ( default ) skipped papers are filtered out of every list ; the
// header "Show skipped" toggle flips it so you can revisit / un-skip them.
let showSkipped = false;

function rowHtml(r){
  return `<tr data-key="${esc(r.key)}"${r.skipped?' class="dim"':''}>`+cols().map(c=>c.cell(r)).join("")+`</tr>`;
}
function headHtml(){
  const stack = cur.sortStack;
  return "<tr>"+cols().map(c=>{
    if(!c.key) return `<th>${c.label}</th>`;
    const idx = stack.findIndex(s=>s.key===c.key);   // -1 if not a sort level
    const arrow = idx>=0 ? (stack[idx].dir==="desc"?"▼":"▲") : "";
    // Tiebreaker columns ( level 2+ ) get a small rank so the tier is visible.
    const rank = idx>0 ? `<sup class="srank">${idx+1}</sup>` : "";
    return `<th class="sortable${idx>=0?' active':''}" data-sort="${c.key}" title="${c.title||''}">`+
           `${c.label}<span class="arrow">${arrow}${rank}</span></th>`;
  }).join("")+"</tr>";
}
function renderShell(){
  $("#view").innerHTML = `<table><thead>${headHtml()}</thead><tbody id="tb"></tbody></table>`;
  $("#view").querySelectorAll("th.sortable").forEach(th=>{
    th.onclick = ()=>{
      const k = th.dataset.sort;
      const def = (cols().find(c=>c.key===k)||{}).def || "desc";
      const stack = cur.sortStack;
      if(stack.length && stack[0].key===k){
        // Re-click the current primary : if it has tiebreakers , the first
        // click just drops them ( back to "this column only" ) ; once it's a
        // lone column , clicking flips its direction the usual way.
        cur.sortStack = (stack.length>1)
          ? [ { key:k, dir:stack[0].dir } ]
          : [ { key:k, dir:stack[0].dir==="desc"?"asc":"desc" } ];
      } else if(cur.pristine){
        // First pick off the untouched default -> clean single-column sort.
        cur.sortStack = [ { key:k, dir:def } ];
      } else {
        // A different column on an already-customized sort -> new primary , old
        // levels kept as tiebreakers ( deduped ) so prior ordering survives ties.
        cur.sortStack = [ { key:k, dir:def }, ...stack.filter(s=>s.key!==k) ];
      }
      cur.pristine = false;
      newSearch();
    };
  });
}

function showCountStatus(){
  $("#status").textContent =
    `${cur.offset.toLocaleString()} of ${cur.total.toLocaleString()} `+
    `${TAB_LABEL[activeTab]||"results"}`+(cur.q?` for “${cur.q}”`:"")+
    (showSkipped?" · incl. skipped":"")+
    (cur.done?" · all loaded":" · scroll for more");
}
async function loadMore(){
  if(!ready || cur.loading || cur.done || activeTab==="authors") return;
  cur.loading = true;
  const url = `/api/search?q=${encodeURIComponent(cur.q)}&pool=${activeTab}`+
              `&sort=${encodeURIComponent(sortParam())}&dir=${encodeURIComponent(dirParam())}`+
              `&limit=${PAGE}&offset=${cur.offset}`+
              `&hide_skipped=${showSkipped?0:1}`;
  let d;
  try { d = await (await fetch(url)).json(); }
  catch(e){ cur.loading=false; return; }
  if(d.status!=="ready"){ cur.loading=false; return; }
  cur.total = d.total;
  const tb = $("#tb");
  if(tb && d.results.length) tb.insertAdjacentHTML("beforeend", d.results.map(rowHtml).join(""));
  cur.offset += d.results.length;
  // The next batch is in -> now drop the rows you skipped earlier in this view
  // ( they lingered, dimmed, so you could undo ). Take any open Read row too.
  if(tb) tb.querySelectorAll("tr.pending-skip").forEach(tr=>{
    const sib = tr.nextElementSibling;
    if(sib && sib.classList.contains("readrow")) sib.remove();
    tr.remove();
  });
  if(cur.offset>=cur.total || d.results.length===0) cur.done = true;
  if(tb && cur.total===0) $("#view").innerHTML = `<div class="empty">No matches.</div>`;
  showCountStatus();
  cur.loading = false;
  // Keep pulling until the viewport is filled ( so short result sets and big
  // screens still show a scrollbar to trigger more ).
  if(!cur.done && document.body.offsetHeight <= window.innerHeight + 300) loadMore();
}

async function renderAuthors(){
  $("#status").textContent = "Loading authors…";
  const d = await (await fetch(`/api/authors?limit=1000`)).json();
  if(!d.results || !d.results.length){ $("#view").innerHTML = `<div class="empty">No authors.</div>`; return; }
  const rows = d.results.map(r=>`
    <tr><td class="num">${r.lib_cites}</td><td class="num">${r.papers}</td>
      <td class="title"><div class="tt">${esc(r.author)}</div></td>
      <td class="links">
        ${r.orcid?`<a href="${esc(r.orcid)}" target="_blank">ORCID</a>`:""}
        ${r.openalex?`<a href="${esc(r.openalex)}" target="_blank">OA</a>`:""}</td></tr>`).join("");
  $("#view").innerHTML = `<table><thead><tr><th>Lib cites</th><th>Papers</th><th>Author</th><th>Links</th></tr></thead><tbody>${rows}</tbody></table>`;
  $("#status").textContent = `${d.total} authors across the missing references pool.`;
}

function newSearch(){
  if(!ready) return;
  cur.q = $("#q").value.trim();
  cur.offset = 0; cur.total = 0; cur.done = false; cur.loading = false;
  window.scrollTo(0,0);
  if(activeTab==="authors"){ renderAuthors(); return; }
  // Drop any sort levels whose column isn't on this tab ( e.g. leaving the
  // library tab while sorted by "Code" / "Added" ) -> falls back to default.
  pruneStack();
  $("#status").textContent = "Searching…";
  renderShell();
  loadMore();
}

// Like newSearch(), but for when the index refreshes UNDER the user -- a
// --watch batch just folded new paper(s) in. Unlike newSearch() it does NOT
// reset the paging cursor or bounce to the top : it keeps the query, the sort,
// the scroll position AND the depth of rows already loaded, re-fetching the
// whole visible span in one request ( limit = however far the user had paged )
// and then restoring the scroll offset ( clamped, since the page may be a bit
// shorter / taller now ). New rows just appear where they sort.
async function refreshInPlace(){
  if(!ready) return;
  const y = window.scrollY;
  const restore = ()=> requestAnimationFrame(()=>{
    const maxY = Math.max(0, document.body.offsetHeight - window.innerHeight);
    window.scrollTo(0, Math.min(y, maxY));
  });
  if(activeTab==="authors"){ await renderAuthors(); restore(); return; }
  cur.loading = true;   // hold off the infinite-scroll loader while we rebuild
  cur.q = $("#q").value.trim();
  pruneStack();
  const depth = Math.max(cur.offset, PAGE);   // how many rows were on screen
  const url = `/api/search?q=${encodeURIComponent(cur.q)}&pool=${activeTab}`+
              `&sort=${encodeURIComponent(sortParam())}&dir=${encodeURIComponent(dirParam())}`+
              `&limit=${depth}&offset=0`+
              `&hide_skipped=${showSkipped?0:1}`;
  let d;
  try { d = await (await fetch(url)).json(); }
  catch(e){ cur.loading=false; return; }
  if(d.status!=="ready"){ cur.loading=false; return; }
  cur.total = d.total;
  renderShell();
  const tb = $("#tb");
  if(tb && d.results.length) tb.insertAdjacentHTML("beforeend", d.results.map(rowHtml).join(""));
  cur.offset = d.results.length;
  cur.done = cur.offset >= cur.total;
  if(cur.total===0) $("#view").innerHTML = `<div class="empty">No matches.</div>`;
  showCountStatus();
  cur.loading = false;
  restore();
}

window.addEventListener("scroll", ()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) loadMore();
}, { passive:true });

// "Read" : pull the paper's prma-md sections and toggle an inline accordion
// row beneath it. Delegated off #view so it survives table re-renders.
function secHtml(s){
  return `<details class="acc"><summary>${esc(s.title)}</summary>`+
         `<div class="accbody">${s.html||""}</div></details>`;
}
$("#view").addEventListener("click", async (e)=>{
  const a = e.target.closest(".readlink");
  if(!a) return;
  e.preventDefault();
  const tr = a.closest("tr");
  const sib = tr.nextElementSibling;
  if(sib && sib.classList.contains("readrow")){ sib.remove(); a.textContent="Read"; return; }
  a.textContent = "Loading…";
  let d;
  try { d = await (await fetch(`/api/paper?key=${encodeURIComponent(a.dataset.key)}`)).json(); }
  catch(err){ a.textContent="Read"; return; }
  a.textContent = "Hide";
  const body = (!d || !d.available)
    ? `<div class="readempty">No rendered Markdown for this paper — run <code>prma md</code>.</div>`
    : `<div class="reader">${(d.sections||[]).map(secHtml).join("")}</div>`;
  tr.insertAdjacentHTML("afterend",
    `<tr class="readrow"><td colspan="${cols().length}">${body}</td></tr>`);
});

// Skip / unskip a paper. Persist server-side, then ( default view ) drop the row
// from the list right away, or ( "Show skipped" on ) just flip its marked state.
// Delegated off #view so it survives table re-renders.
$("#view").addEventListener("click", async (e)=>{
  const b = e.target.closest(".skipbtn");
  if(!b) return;
  e.preventDefault();
  const key = b.dataset.key;
  const willSkip = !b.classList.contains("skipped");
  b.disabled = true;
  try {
    await fetch("/api/skip", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ key, skipped: willSkip }) });
  } catch(err){ b.disabled=false; return; }
  b.disabled = false;
  const tr = b.closest("tr");
  // Reflect the new state on the row, but DON'T remove it here. Skipped rows
  // linger ( dimmed, with an Unskip button ) so you can change your mind; they're
  // only dropped once you scroll far enough to pull the next batch ( loadMore ).
  b.classList.toggle("skipped", willSkip);
  b.textContent = willSkip ? "Unskip" : "Skip";
  b.title = willSkip ? "Restore this paper to the list" : "Hide this paper from the list";
  tr.classList.toggle("dim", willSkip);
  // In the default ( hide-skipped ) view, mark the row for removal on the next
  // batch and keep the server paging offset aligned: skipping shrinks the
  // server's filtered list by one, unskipping grows it back.
  if(!showSkipped){
    tr.classList.toggle("pending-skip", willSkip);
    cur.offset = Math.max(0, cur.offset + (willSkip ? -1 : 1));
  }
});

function showBuilding(msg){
  ready = false;
  renderCounts(); renderTabs();
  $("#status").textContent = "";
  $("#view").innerHTML =
    `<div class="build"><div class="spinner"></div>
       <h2>Building index…</h2>
       <div>${esc(msg||"Streaming the OpenAlex cache off disk. The first build can take a few minutes on a large library; later ones are incremental.")}</div>
     </div>`;
}

let pollTimer = null;
async function pollUntilReady(){
  try { META = await (await fetch("/api/meta")).json(); } catch(e){ META = {}; }
  if(META.status === "ready"){
    ready = true;
    clearTimeout(pollTimer);
    renderCounts(); renderTabs(); newSearch();
    return;
  }
  if(META.status === "error"){
    $("#view").innerHTML = `<div class="build"><h2>Index build failed</h2><div>${esc(META.error||"")}</div></div>`;
    return;
  }
  showBuilding(META.message);
  pollTimer = setTimeout(pollUntilReady, 2500);
}

let timer=null;
$("#q").addEventListener("input", ()=>{ clearTimeout(timer); timer=setTimeout(newSearch, 200); });
$("#refresh").addEventListener("click", async ()=>{
  $("#refresh").disabled = true;
  try { await fetch("/api/refresh",{method:"POST"}); } catch(e){}
  showBuilding();
  pollUntilReady();
  $("#refresh").disabled = false;
});
$("#toggleSkipped").addEventListener("click", ()=>{
  showSkipped = !showSkipped;
  const btn = $("#toggleSkipped");
  btn.textContent = showSkipped ? "🚫 Hide skipped" : "🚫 Show skipped";
  btn.classList.toggle("active", showSkipped);
  if(ready) newSearch();
});
// Theme : the attribute is already set pre-paint by the inline <head> script ;
// here we just label the button and persist the choice on toggle.
function curTheme(){ return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
function labelTheme(){ $("#toggleTheme").textContent = curTheme()==="dark" ? "☀ Light" : "🌙 Dark"; }
$("#toggleTheme").addEventListener("click", ()=>{
  const next = curTheme()==="dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("prma-theme", next); } catch(e){}
  labelTheme();
});
labelTheme();

pollUntilReady();

// ---- Live --watch processing banner ----------------------------------------
// Independent of the index-build poll above. Hits /api/jobs on a steady timer:
// shows a toast while the background worker ( ` prma server --watch ` ) is
// scanning / processing a paper you just added to Zotero / Mendeley, and
// silently refreshes counts + the current view when a batch finishes, so new
// rows appear without a manual Rebuild. When the server runs without --watch,
// /api/jobs reports disabled and this stays completely quiet.
const STAGE_LABEL = {
  starting:"starting", openalex:"OpenAlex", yolo:"layout (YOLO)", ocr:"OCR",
  images:"figures", methods:"methods", md:"markdown", summarize:"summary",
  reindex:"indexing", done:"done",
};
function showProc(title, sub){
  $("#pb-title").textContent = title;
  $("#pb-sub").textContent = sub || "";
  $("#procbar").classList.add("show");
}
function hideProc(){ $("#procbar").classList.remove("show"); }

let procBusy = false, jobsTimer = null;
async function pollJobs(){
  let j;
  try { j = await (await fetch("/api/jobs")).json(); }
  catch(e){ j = { enabled:false }; }
  if(j && j.enabled){
    const a = j.active;
    if(a){
      procBusy = true;
      showProc(`Processing “${a.title || a.key}”`, `${STAGE_LABEL[a.stage] || a.stage}…`);
    } else if(j.scanning){
      procBusy = true;
      showProc("Checking your library…", "looking for newly added papers");
    } else {
      hideProc();
      if(procBusy){
        // A batch just finished -> pull fresh counts + fold the new paper(s)
        // into the current view WITHOUT losing the user's query / sort / scroll
        // ( refreshInPlace, not newSearch ). Only once the index is serving.
        procBusy = false;
        if(ready){
          try { META = await (await fetch("/api/meta")).json(); } catch(e){}
          renderCounts();
          refreshInPlace();
        }
      }
    }
  } else {
    hideProc();
  }
  jobsTimer = setTimeout(pollJobs, 2000);
}
pollJobs();
</script>
</body>
</html>
