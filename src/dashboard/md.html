<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prma · md</title>
<!-- The chrome every prma page shares : the pre-paint theme restore ( so the
     reader tab opens in the theme of the page it was opened FROM , with no
     flash ) , then the palette and the header styling. -->
<script src="/static/boot.js"></script>
<link rel="stylesheet" href="/static/common.css">
<style>
  /* The palette and the header chrome are in /static/common.css. This page only
     reads long-form text , so it sets a roomier line-height and keeps its own
     table of contents , figure and prose rules. */
  body { line-height:1.55; }
  .navlink { white-space:nowrap; }
  .hidden { display:none !important; }
  /* Section jump chips. A ` prma md ` render runs long ( every section , plus the
     OCR body ) , so the headers double as the table of contents. */
  .toc { display:flex; gap:6px; flex-wrap:wrap; margin-top:11px; }
  .toc a {
    background:var(--chip); color:var(--muted); text-decoration:none;
    border-radius:10px; padding:2px 9px; font-size:12px;
  }
  .toc a:hover { color:var(--accent); }
  main { padding:18px; max-width:900px; margin:0 auto; }
  .sec { margin:0 0 26px; scroll-margin-top:96px; }
  .sec h2 {
    font-size:15px; margin:0 0 10px; padding-bottom:6px;
    border-bottom:1px solid var(--line); font-weight:600;
  }
  .body p { margin:0 0 11px; }
  .body h4 { margin:16px 0 6px; font-size:14px; }
  .body ul { margin:0 0 11px; padding-left:20px; }
  .body a { color:var(--accent); }
  /* Figures the md render links out of output/images/ ( served at /images/ ). */
  .body img {
    max-width:100%; height:auto; display:block; margin:10px 0;
    border:1px solid var(--line); border-radius:6px; background:var(--panel2);
  }
  .empty { color:var(--muted); padding:48px; text-align:center; }
  code { background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1 id="title">…</h1>
    <div class="grow"></div>
    <a class="navlink" href="/" title="Back to the paper list">← Dashboard</a>
    <a class="navlink hidden" id="doilink" target="_blank" rel="noopener" title="Resolve this DOI">DOI</a>
    <a class="navlink hidden" id="proxylink" target="_blank" rel="noopener" title="Resolve this DOI through your library's proxy">Proxy</a>
    <a class="navlink" id="rawlink" href="?raw=1" title="Download the Markdown source">.md</a>
    <button id="toggleTheme" title="Toggle light / dark theme">🌙 Dark</button>
  </div>
  <div class="toc" id="toc"></div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<!-- $ , esc , PROXY , doiLinks() , initTheme() and the rest -- the helpers every
     prma page used to write out for itself. Loaded before the page script , so
     they are plain globals below ; nothing here may redeclare them. -->
<script src="/static/common.js"></script>
<script>

// Which paper : everything after /md/ . The dashboard's MD button sends the
// paper's key ( its DOI ) ; the figure reports' relative ../md/<file>.md links
// land here too, and the server resolves either form to the same document.
const IDENT = decodeURIComponent(location.pathname.replace(/^\/md\/?/, ""));

function render(d){
  if(!d || !d.available){
    $("#title").textContent = IDENT || "md";
    $("#main").innerHTML =
      `<div class="empty">No rendered Markdown for <b>${esc(IDENT)}</b> — run <code>prma md</code>.</div>`;
    return;
  }
  const title = d.title || IDENT;
  $("#title").textContent = title;
  document.title = title + " · prma md";
  if(d.doi){
    const q = encodeURIComponent(d.doi).replace(/%2F/gi, "/");
    const doi = $("#doilink"), px = $("#proxylink");
    doi.href = "https://doi.org/" + q;  doi.classList.remove("hidden");
    if(PROXY){ px.href = PROXY + q;     px.classList.remove("hidden"); }
  }
  const secs = d.sections || [];
  // Section HTML comes from the server's md renderer ( the same payload the
  // dashboard's inline "Read" accordion draws ) , images already pointed at
  // /images/ , so it goes in as markup.
  $("#main").innerHTML = secs.length
    ? secs.map((s,i)=>
        `<section class="sec" id="sec-${i}"><h2>${esc(s.title)}</h2>`+
        `<div class="body">${s.html||""}</div></section>`).join("")
    : `<div class="empty">This paper's Markdown render is empty.</div>`;
  $("#toc").innerHTML = secs.map((s,i)=>
    `<a href="#sec-${i}">${esc(s.title)}</a>`).join("");
}

(async ()=>{
  let d = null;
  try { d = await (await fetch(`/api/paper?key=${encodeURIComponent(IDENT)}`)).json(); }
  catch(e){ d = null; }
  render(d);
})();

// ---- Theme toggle ( shared with the dashboard via localStorage ) ------------
initTheme();
</script>
</body>
</html>
