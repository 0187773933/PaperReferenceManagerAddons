// ---- mutations ------------------------------------------------------------
function newItem(hit){
  return {
    key: hit.key, title: hit.title||"", doi: hit.doi||"", wid: hit.wid||"",
    pdf: hit.pdf_local ? "" : (hit.pdf||""),
    year: hit.year||null, journal: hit.journal||"", tags: [],
    fields: Object.fromEntries(DOC.columns.map(c=>[c.id,""])), added_at: nowISO(),
  };
}
// Where a paper added from search lands. "placed" means : right after the last
// row you actually put somewhere ( dragged, or typed a number into ) -- so the
// part of the list you've already ranked stays intact and new arrivals queue up
// directly under it instead of at the bottom of everything.
function insertIndex(how){
  how = how || DOC.options.add_where || "bottom";
  if(how === "top") return 0;
  if(how === "placed"){
    let last = -1;
    DOC.items.forEach((it,i)=>{ if(it.placed) last = i; });
    return last + 1;
  }
  return DOC.items.length;
}
// ---- a free-text cell, with its links live ---------------------------------
// The Code and Datasets columns ARE lists of URLs, and a Note or a Methods
// summary often has one in it. A textarea can't hold a link, so a cell that
// HAS one is drawn twice : the textarea, and a copy of its text laid exactly
// over it with the URLs as real anchors.
//
// The overlay ignores the mouse everywhere except on those anchors, so clicking
// the text still lands the caret in the box underneath and typing, selecting
// and deleting are exactly what they were. The textarea's own text is invisible
// while the caret is elsewhere ( you are reading the overlay's copy ) and comes
// back the moment you are in the box, which is also when the overlay steps
// aside -- see .cellbox.linked in the stylesheet, and the .editing pair below.
//
// Only a cell that actually contains a link gets one -- five hundred rows
// shouldn't carry two thousand overlays for the sake of a few dozen URLs -- and
// the document is untouched : `fields` holds the same plain text it always did,
// which is what the CSV export writes out.
const URL_RE = /\b(?:https?:\/\/|www\.)[^\s<>"'`\u00a0]+/gi;
const hasLink = t => { const re = new RegExp(URL_RE.source, "i"); return re.test(String(t||"")); };
// A URL at the end of a sentence swallows the punctuation after it. A closing
// bracket is kept only when the URL opened one ( wikipedia, docs.rs, … ).
function trimUrl(u){
  let end = u.length;
  for(;;){
    const c = u[end-1];
    if(end && ".,;:!?'\"".includes(c)){ end--; continue; }
    if(end && ")]}".includes(c)){
      const open = { ")":"(", "]":"[", "}":"{" }[c], body = u.slice(0, end);
      const n = ch => body.split(ch).length - 1;
      if(n(c) > n(open)){ end--; continue; }   // more closers than openers : not ours
      break;                                   // balanced -- the URL opened it
    }
    break;
  }
  return u.slice(0, end);
}
function linkifyCell(text){
  const s = String(text||""), re = new RegExp(URL_RE.source, "gi");
  let out = "", at = 0, m;
  while((m = re.exec(s))){
    const raw = trimUrl(m[0]);
    if(!raw) continue;                       // nothing left once the punctuation goes
    const href = /^www\./i.test(raw) ? "https://" + raw : raw;
    out += esc(s.slice(at, m.index))+
      `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" `+
      `title="${esc(href)} — opens in a tab behind this one">${esc(raw)}</a>`;
    at = m.index + raw.length;
    re.lastIndex = at;                       // the punctuation we gave back is text
  }
  return out + esc(s.slice(at));
}
// One cell of a row or of a staged row -- the same box on both, so a note typed
// on the shelf and the same note on the board look and behave identically.
function cellHtml(it, c){
  const v = String((it.fields||{})[c.id] || "");
  const linked = hasLink(v);
  return `<div class="cellbox${linked?" linked":""}">`+
    `<textarea data-field="${esc(c.id)}" placeholder="${esc(c.label)}…" spellcheck="false"${RO()}>${esc(v)}</textarea>`+
    (linked ? `<div class="lnk" aria-hidden="true">${linkifyCell(v)}</div>` : "")+
  `</div>`;
}
// Which cell the caret is in. One pair for both surfaces ( the board draws the
// same cell on the shelf ), and never for a locked board, where nothing is
// being edited and the links should just stay live.
const isCell = el => el && el.matches && el.matches("textarea[data-field]:not([readonly])");
document.addEventListener("focusin",  e=>{ if(isCell(e.target)) e.target.parentElement.classList.add("editing"); });
document.addEventListener("focusout", e=>{ if(isCell(e.target)) e.target.parentElement.classList.remove("editing"); });

// Redraw one cell's overlay from what is in its box NOW -- creating it for a URL
// you just typed, removing it for the one you just deleted. Called when you
// leave a cell and wherever something writes into one ( see refreshFields ).
function syncCellLink(ta){
  const box = ta.parentElement;
  if(!box || !box.classList.contains("cellbox")) return;
  const want = hasLink(ta.value);
  let lnk = box.querySelector(".lnk");
  box.classList.toggle("linked", want);
  if(!want){ if(lnk) lnk.remove(); return; }
  if(!lnk){
    lnk = document.createElement("div");
    lnk.className = "lnk";
    lnk.setAttribute("aria-hidden", "true");
    box.appendChild(lnk);
  }
  lnk.innerHTML = linkifyCell(ta.value);
  lnk.scrollTop = ta.scrollTop;
}

// ---- links in a cell of text -----------------------------------------------
// The Code and Datasets cells hold LINKS -- the repo, the archive record, the
// dataset's home page -- one per line, whether they came from the Google Sheet
// ( where each is a short label with the link behind it ) or from the scans
// ( prefill ). A cell is plain text, so a link is written as its URL -- and as
// "label — URL" when the label says something the URL doesn't :
//   alexhuth/sensimetrics_filter  ->  https://github.com/alexhuth/sensimetrics_filter
//   zenodo 8349726                ->  https://doi.org/10.5281/zenodo.8349726
//   UK Biobank                    ->  https://www.ukbiobank.ac.uk/
//   Moth Radio Hour / Huth-LeBel story data  ->  that, " — ", its OpenNeuro link
// A label "says nothing more" when every word of it is already in the URL
// ( foldText, /static/common.js ). The sheet's "hf: " is its shorthand for
// Hugging Face, and a www or an http is spelling, not a word.
function linkLine(label, url){
  label = String(label||"").trim();
  const u = foldText(url);
  const words = label.normalize("NFKD").toLowerCase().replace(/^hf:/, "")
    .split(/[^a-z0-9]+/).filter(w=>w && !/^(www|https?)$/.test(w));
  return words.every(w=>u.includes(w)) ? url : `${label} — ${url}`;
}
// A sheet cell whose lines carry links ( runs of [ text, url|null ] off
// /api/sheet/csv -- see src/db/gsheet.py ), as its text with the links written
// in, line for line. A line with no link stays exactly as it was.
function linkedCell(runs){
  const lines = [[]];
  runs.forEach(([text, url])=>String(text||"").split("\n").forEach((piece, k)=>{
    if(k) lines.push([]);
    if(piece) lines[lines.length-1].push([piece, url||""]);
  }));
  return lines.map(segs=>{
    const urls = Array.from(new Set(segs.map(s=>s[1]).filter(Boolean)));
    if(urls.length > 1) return segs.map(([t,u])=>u ? linkLine(t, u) : t).join("");
    const text = segs.map(s=>s[0]).join("");
    return urls.length ? linkLine(text, urls[0]) : text;
  }).join("\n");
}

// ---- Code / Datasets, filled in for you -----------------------------------
// A paper added from search arrives with its Code and Datasets cells already
// written : the repos /code shows for it, and the archive records and named
// collections /datasets shows -- a name with the home page it links to there.
// Same scans ( ` prma code ` , ` prma datasets ` ), read through
// /api/paper-meta, written as links the way linkLine writes them. Only an
// EMPTY cell is written, so nothing you typed is ever replaced.
const FILL_COLS = { code: /^code$/i, datasets: /^datasets?$/i };
function fillCol(re){
  const c = DOC.columns.find(c=>re.test(c.id)) || DOC.columns.find(c=>re.test(c.label));
  return c ? c.id : null;
}
// One line each, first spelling wins : the scans often find the same link
// twice ( the abstract and the full text both print it ).
function cellText(list){
  const seen = new Set(), out = [];
  list.forEach(v=>{
    v = String(v||"").trim();
    if(v && !seen.has(lc(v))){ seen.add(lc(v)); out.push(v); }
  });
  return out.join("\n");
}
// Writes what `m` ( a /api/paper-meta entry asked for with links ) has into
// `it`'s Code / Datasets cells, wherever they're empty. Returns the ids of the
// cells it wrote, so a caller can redraw just those.
function prefill(it, m){
  if(!m || !m.code) return [];
  const named = n => typeof n === "string" ? { name:n, url:"" } : (n || {});
  const want = {
    code:     cellText(m.code.map(l=>l.url)),
    datasets: cellText((m.data||[]).map(l=>l.url)
      .concat((m.names||[]).map(named).map(n=>n.url ? linkLine(n.name, n.url) : n.name))),
  };
  const f = it.fields = it.fields || {}, wrote = [];
  Object.keys(want).forEach(k=>{
    const id = fillCol(FILL_COLS[k]);
    if(id && want[k] && !String(f[id]||"").trim()){ f[id] = want[k]; wrote.push(id); }
  });
  return wrote;
}
// The boxes for cells prefill wrote after the row was drawn. A folded column
// has no box ; its text is there when you unfold it.
function refreshFields(it, ids){
  const row = rowEl(it.key);
  ids.forEach(id=>{
    const ta = row && row.querySelector(`textarea[data-field="${cssEsc(id)}"]`);
    if(ta){ ta.value = it.fields[id]; syncCellLink(ta); }   // Code / Datasets arrive as links
  });
}
// `at` is where a hit dragged into the list was dropped ; without it the paper
// lands wherever the "add to…" dropdown says, and the page scrolls to it.
async function addPaper(hit, at){
  if(guard()) return;
  if(findItem(hit.key)){ toast("Already on the board"); return; }
  const it = newItem(hit);
  const m  = META[hit.key];
  if(m && m.mods && m.mods.length){ it.tags = m.mods.slice(); sortTags(it); }  // pre-tagged from the Methods stamp
  prefill(it, m);
  DOC.items.splice(at == null ? insertIndex() : Math.min(at, DOC.items.length), 0, it);
  markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  const el = rowEl(it.key);
  if(el){
    el.classList.add("flash");
    if(at == null){
      // Added from the search box and landing out of sight : the search comes
      // along to where the paper lands ( see floatTools ), so the next one is a
      // keystroke away -- and dropping it now, before the scroll, is what lets
      // the scroll land the row below it.
      const r = el.getBoundingClientRect();
      if(document.activeElement === $("#q") && (r.top < 0 || r.bottom > innerHeight)) floatTools(true);
      el.scrollIntoView({ block:"center", behavior:"smooth" });
    }
  }
  const got = await fetchMeta([it.key], true);
  const gm = got[it.key];
  if(gm && !it.tags.length && gm.mods && gm.mods.length){
    it.tags = gm.mods.slice(); sortTags(it); markDirty(); refreshTags(it.key); renderPaintbar(); renderCounts();
  }
  const wrote = prefill(it, gm);
  if(wrote.length){ markDirty(); refreshFields(it, wrote); }
  // Straight out of Recently added ( those hits carry `added` ) and nothing has
  // processed it yet : a placeholder, filled in by backfillPending once the
  // pipeline has run it. A search hit that isn't in the library is left alone --
  // it may never be.
  if("added" in hit && gm && gm.in_library === false){ it.pending = true; markDirty(); repaintLinks(); }
  if(hits.length) renderResults();
}
// The placeholders ( it.pending ) get what addPaper would have given them had
// the pipeline already run : their modality tags if they have none, their Code
// / Datasets cells where they're empty. Nothing you typed is overwritten. Runs
// on load and whenever the index moves ( pollRev ) -- i.e. when the --watch
// worker has just processed papers. A row stays pending until its paper has
// really been through the suite ( it has an .md, tags or code ), so one whose
// PDF was still downloading is picked up again by the rescan that follows.
// Never while a dialog is up ( the draft question, an import being set up ) :
// those are working on the board too. `backfillOwed` has pollRev try again once
// it's closed.
let backfilling = false, backfillOwed = false;
async function backfillPending(){
  if(LOCKED || backfilling) return;
  const todo = DOC.items.filter(it=>it.pending);
  if(!todo.length){ backfillOwed = false; return; }
  if($("#overlay").classList.contains("show")){ backfillOwed = true; return; }
  backfillOwed = false;
  backfilling = true;
  try {
    const got = await fetchMeta(todo.map(it=>it.key), true);
    let changed = false;
    todo.forEach(it=>{
      const f = findItem(it.key);
      if(!f || f.it !== it) return;          // removed, or the board reloaded meanwhile
      const m = got[it.key];
      if(!m || !m.in_library) return;        // not processed yet -- keep waiting
      if(!(it.tags||[]).length && m.mods && m.mods.length){
        it.tags = m.mods.slice(); sortTags(it); m.mods.forEach(rememberTag); refreshTags(it.key); changed = true;
      }
      const wrote = prefill(it, m);
      if(wrote.length){ refreshFields(it, wrote); changed = true; }
      if(m.has_md || (m.mods||[]).length || (m.code||[]).length){ it.pending = false; changed = true; }
    });
    if(changed){ markDirty(); renderPaintbar(); renderCounts(); }
    repaintLinks();
  } finally { backfilling = false; }
}
// A row keeps the key it arrived with, and an imported sheet spells keys its own
// way -- '10.48550/arxiv…' for the library's '10.48550/arXiv…', 'zotero:ABCD1234'
// for 'nodoi-zotero-ABCD1234'. The paper-meta lookup sees through that ( m.key is
// the library's own key ), and here the row takes that key for good : /pdf, /md,
// /code, /datasets and /review all find a paper by its exact key, so a row still
// spelled the sheet's way is a paper none of them can see. Runs after every
// lookup ( fetchMeta ). Never over another row that already has the key -- that
// is a duplicate for you to settle, not two rows to fold together -- and never
// while a dialog is up : like backfillPending, `adoptOwed` has pollRev try again
// once it's closed.
let adoptOwed = false;
function adoptLibraryKeys(){
  if(LOCKED) return;
  if($("#overlay").classList.contains("show")){ adoptOwed = true; return; }
  adoptOwed = false;
  const all = DOC.items.concat(staged()), taken = new Set(all.map(it=>it.key));
  let n = 0;
  all.forEach(it=>{
    const m = META[it.key], k = m && m.in_library && m.key;
    if(!k || k === it.key || taken.has(k)) return;
    const old = it.key;
    taken.delete(old); taken.add(k);
    META[k] = m;
    if(SEL.has(old)){ SEL.delete(old); SEL.add(k); }
    if(SOFF.has(old)){ SOFF.delete(old); SOFF.add(k); }
    if(old in STAGEHOW){ STAGEHOW[k] = STAGEHOW[old]; delete STAGEHOW[old]; }
    if(m.doi && (!it.doi || lc(it.doi) === lc(m.doi))) it.doi = m.doi;
    it.key = k;
    n++;
  });
  if(!n) return;
  markDirty(); renderAll();
  toast(`Matched ${n} row(s) to their paper in your library`, 5000);
}
function removeItem(key){
  if(guard()) return;
  const f = findItem(key);
  if(!f) return;
  const at = f.idx;
  const [gone] = DOC.items.splice(at, 1);
  SEL.delete(key);
  markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  toast(`Removed “${(gone.title||gone.key).slice(0,60)}”`, 6000, "Undo", ()=>{
    DOC.items.splice(Math.min(at, DOC.items.length), 0, gone);
    markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  });
}
// `index` is a 0-based position in the list. Moving a row by hand marks it
// placed -- that's what "add after last sorted" keys off.
function moveTo(key, index){
  if(guard()) return;
  const f = findItem(key);
  if(!f) return;
  const [it] = DOC.items.splice(f.idx, 1);
  if(f.idx < index) index--;
  DOC.items.splice(Math.max(0, Math.min(index, DOC.items.length)), 0, it);
  it.placed = true;
  markDirty(); renderBoard();
}
// Auto-move ( off by default ) : after a tag change, slide the row down to sit
// with the others carrying exactly the same tags.
function autoMove(key){
  if(!DOC.options.auto_move) return;
  const f = findItem(key);
  if(!f) return;
  const sig = tagSig(f.it);
  let last = -1;
  DOC.items.forEach((x,i)=>{ if(i!==f.idx && tagSig(x)===sig) last = i; });
  if(last < 0) return;
  const [it] = DOC.items.splice(f.idx, 1);
  DOC.items.splice(last < f.idx ? last+1 : last, 0, it);
}
function afterTagChange(key){
  const moved = DOC.options.auto_move;
  if(moved) autoMove(key);
  markDirty();
  if(moved) renderBoard(); else { refreshTags(key); applyFilter(); }
  renderPaintbar(); renderCounts();
}
function toggleTag(it, value){
  if(guard()) return;
  const i = (it.tags||[]).findIndex(v=>lc(v)===lc(value));
  if(i>=0) it.tags.splice(i,1); else it.tags.push(value);
  sortTags(it);
  rememberTag(value);
}
function addTag(it, value){
  if(guard()) return false;
  value = (value||"").trim();
  if(!value) return false;
  if((it.tags||[]).some(v=>lc(v)===lc(value))) return false;
  it.tags.push(value);
  sortTags(it);
  rememberTag(value);
  return true;
}
// Any tag you use or invent joins the document's own tag list, so it's still
// offered after a restart -- even if you later take it off every paper.
function rememberTag(value){
  if(!(DOC.vocab.tags||[]).some(t=>lc(t.name)===lc(value)))
    DOC.vocab.tags.push({ name:value, color:nextColor() });   // the next unused pastel
}

// ---- search ---------------------------------------------------------------
// Two ways to find a paper, and the default is the one you actually want here :
//   match titles ( mode=title ) -- type any piece of a title and the closest
//     titles come back, best first. Nothing has to match exactly, so a typo, a
//     missing word or two words the wrong way round still lands the paper.
//   full text   ( mode=text )  -- the dashboard's boolean search over the whole
//     OCR'd body, for when you're hunting a phrase rather than a paper.
// See src/dashboard/index.py :: title_search .
let hits = [], hitIdx = 0, hitTotal = 0, hitFuzzy = false, hitMode = "title", searchTimer = null;
async function runSearch(){
  const q = $("#q").value.trim();
  if(!q){ closeResults(); return; }
  const mode = $("#smode").value;
  let d;
  try { d = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&pool=${$("#pool").value}`+
    `&mode=${mode}&sort=relevance&limit=25&hide_skipped=0`)).json(); }
  catch(e){ return; }
  if(d.status !== "ready"){
    $("#results").innerHTML = `<div class="rhint">The search index isn't built yet — open the dashboard once to build it.</div>`;
    $("#results").classList.add("show");
    return;
  }
  hits = d.results || []; hitIdx = 0; hitTotal = d.total; hitFuzzy = !!d.fuzzy;
  hitMode = d.mode || mode;
  renderResults();
  fetchMeta(hits.map(h=>h.key), true).then(()=>renderResults());
}
// Where a recently-added paper should land, typed in the list beside the button
// that adds it -- the number you would otherwise have had to go and type into
// the row after it arrived. Kept per paper rather than in the DOM : the list
// redraws itself whenever the metadata lands or the poll finds a newer paper,
// and a redraw must not take back what you typed.
const POSAT = new Map();
// Empty is the original ＋ Add : the paper goes where "add to …" says. A number
// is a position in YOUR order, counted the way the row numbers and the ✓ #n
// here count it -- 1 is the top, anything past the end is the bottom.
function posBox(h, i){
  return `<input class="at" data-i="${i}" value="${esc(POSAT.get(h.key) || "")}" placeholder="#"`+
    ` inputmode="numeric" autocomplete="off" draggable="false"`+
    ` title="Where to put it — 1 is the top, counted the way the row numbers are. Leave it empty and it goes wherever “add to …” says.">`;
}
function renderResults(){
  if(!hits.length){
    $("#results").innerHTML = hitMode === "recent"
      ? `<div class="rhint">${esc(recentNote || "Nothing has been added to your library yet.")}</div>`
      : `<div class="rhint">Nothing close to that${hitMode==="title"?" in any title":""}.</div>`;
    $("#results").classList.add("show");
    return;
  }
  const hint = hitMode === "recent" ? recentHint()
    : hitFuzzy
    ? `<div class="rhint" style="color:var(--warn)">Nothing came close — these are the least-far-off titles</div>`
    : hitMode === "title"
      ? `<div class="rhint">${hits.length} closest title${hits.length===1?"":"s"} · ↵ or double-click adds ( tagged, Code + Datasets filled in ) · or drag a hit into the list</div>`
      : `<div class="rhint">${hits.length} of ${hitTotal} · best match first · ↵ or double-click adds · or drag a hit into the list</div>`;
  // A number typed against a paper that has since dropped out of the list ( the
  // window moved, or you asked for a different "show 25" ) is not waiting for it
  // to come back.
  if(hitMode === "recent"){
    const live = new Set(hits.map(h=>h.key));
    POSAT.forEach((v,k)=>{ if(!live.has(k)) POSAT.delete(k); });
  }
  $("#results").innerHTML = hint+
    hits.map((h,i)=>{
      const f = findItem(h.key);
      const m = META[h.key] || {};
      const mods = (m.mods||[]).map(v=>`<span class="chip" ${chipStyle(v)}>${esc(v)}</span>`).join(" ");
      return `<div class="hit ${i===hitIdx?'sel':''}" data-i="${i}" draggable="true">`+
        `<div style="flex:1;min-width:0">`+
          `<div class="ht">${esc(h.title||h.key)}</div>`+
          `<div class="hm">${h.year?esc(h.year):""}${h.journal?" · "+esc(h.journal):""}`+
            `${h.cited_by!=null?` · ${h.cited_by} cites`:""}`+
            `${hitMode==="recent"?recentBadges(h):""} ${mods}</div>`+
        `</div>`+
        (f ? `<div class="in">✓ #${f.idx+1}</div>`
           : `<div class="acts">${hitMode==="recent" ? posBox(h,i) : ""}`+
             `<button class="add" data-i="${i}">＋ Add</button></div>`)+
      `</div>`;
    }).join("");
  $("#results").classList.add("show");
}

// ---- recently added -------------------------------------------------------
// The other way to find the paper you want : not by remembering enough of its
// title to search for, but because you saved it into Zotero thirty seconds ago.
//
// /api/recent reads the reference manager ITSELF -- not output/cache/papers/,
// not the dashboard index -- which is the whole reason this exists. A paper
// only reaches the search above after a snapshot has pushed it into the papers
// store and a reindex has read it, so until then searching for it finds
// nothing and the board can't have it. This path has it immediately, keyed the
// way the pipeline will key it, so the row you add now is the same row once
// everything else catches up.
//
// The hits go into the SAME `hits` array the search fills, so ＋ Add, ↵,
// double-click, dragging a hit into the list and the arrow keys are all the
// ones that were already there.
const RECENT_KEY = "prma-sort-recent-n";
const RECENT_NS  = [ 10, 25, 50 ];
let recentN = 10, recentNote = "", recentBusy = false;
try { recentN = Math.max(1, +localStorage.getItem(RECENT_KEY) || 10); } catch(e){}

// "added 2h ago" — how recent a thing is, which is the only part of an added
// stamp anyone reads here. The server sends UTC without a zone ( SQLite's
// 'YYYY-MM-DD HH:MM:SS' ), so say so before parsing.
function ago(stamp){
  const t = Date.parse(String(stamp||"").replace(" ", "T") + "Z");
  if(!t) return "";
  const m = Math.max(0, (Date.now() - t) / 60000);
  if(m < 2)    return "just now";
  if(m < 60)   return `${Math.round(m)}m ago`;
  if(m < 1440) return `${Math.round(m/60)}h ago`;
  const d = Math.round(m/1440);
  return d < 30 ? `${d}d ago` : String(stamp).slice(0,10);
}
// When it landed, and -- for the papers this is really for -- whether the rest
// of prma has caught up with it yet. in_library false means the index has never
// seen it : it's addable here, but nothing has read its PDF, so it arrives with
// no modality tags and empty Code / Datasets cells until the pipeline runs.
function recentBadges(h){
  const m = META[h.key];
  const when = ago(h.added);
  // No separator before the badge : .hm is a flex row with a gap , so a " · "
  // ending the text run is left dangling at the end of a line whenever the
  // badge wraps under it.
  const raw = m && m.in_library === false
    ? `<span class="nyet" title="prma hasn't processed this paper yet. Add it anyway : it comes in marked ⏳ processing, and its tags and Code / Datasets cells fill themselves in once the live server ( \` prma \` ) has run it — or after \` prma process \` + \` prma reindex \` if the server runs without --watch.">not indexed yet</span>` : "";
  return (when ? ` · ${esc(when)}` : "") + raw;
}
function recentHint(){
  const more = RECENT_NS.filter(n=>n!==recentN)
    .map(n=>`<a href="#" data-recent-n="${n}">${n}</a>`).join(" · ");
  return `<div class="rhint">last ${hits.length} added to your library · ↵ or double-click adds · `+
    `type a # beside ＋ Add to send it to that spot · or drag one into the list &nbsp;&nbsp;show ${more}</div>`;
}
async function showRecent(){
  if(recentBusy) return;
  recentBusy = true;
  const b = $("#recentbtn"), label = b.textContent;
  b.textContent = "🆕 …";
  let d;
  try { d = await (await fetch(`/api/recent?limit=${recentN}`)).json(); }
  catch(e){ d = { results: [], note: "Couldn't reach the server." }; }
  finally { recentBusy = false; b.textContent = label; }
  hits = d.results || []; hitIdx = 0; hitTotal = hits.length;
  hitFuzzy = false; hitMode = "recent"; recentNote = d.note || "";
  renderResults();
  // The stamp and the links a row would be filled in from -- and, for a paper
  // the index has never heard of, the in_library:false that says so. Landing
  // after the list has been put away must not raise it again.
  fetchMeta(hits.map(h=>h.key), true).then(()=>{
    if(hitMode === "recent" && $("#results").classList.contains("show")) renderResults();
  });
}
function recentOpen(){ return hitMode === "recent" && $("#results").classList.contains("show"); }
// An open list keeps itself current ( pollRev ) : save a paper into Zotero with
// the list up and it appears on the next poll, where you left the highlight.
// The server answers this out of its cache until Zotero actually writes, so
// asking every poll costs a stat. Redrawn only when the papers changed, and a
// read that failed leaves the list you have alone.
async function refreshRecent(){
  if(recentBusy) return;
  let d;
  try { d = await (await fetch(`/api/recent?limit=${recentN}`)).json(); } catch(e){ return; }
  const rows = (d && d.results) || [];
  if(!recentOpen() || recentBusy || (!rows.length && d.note)) return;
  const sig = list => list.map(h=>h.key).join("\n");
  if(sig(rows) === sig(hits)) return;
  const cur = hits[hitIdx] && hits[hitIdx].key;
  hits = rows; hitTotal = rows.length; recentNote = d.note || "";
  hitIdx = Math.max(0, hits.findIndex(h=>h.key === cur));
  renderResults();
  fetchMeta(hits.map(h=>h.key), true).then(()=>{ if(recentOpen()) renderResults(); });
}
$("#recentbtn").addEventListener("click", ()=>{
  // A second press puts it away, the way the button that opened it should.
  if(recentOpen()){ closeResults(); return; }
  showRecent();
});
// "show 25 · 50" in the panel's own hint line, rather than another select in a
// row that is already full. The choice is this browser's, like the search mode.
$("#results").addEventListener("click", e=>{
  const a = e.target.closest("[data-recent-n]");
  if(!a) return;
  e.preventDefault();
  recentN = +a.dataset.recentN;
  try { localStorage.setItem(RECENT_KEY, String(recentN)); } catch(e){}
  showRecent();
});
function closeResults(){ $("#results").classList.remove("show"); hits = []; }
function moveHit(delta){
  if(!hits.length) return;
  hitIdx = Math.max(0, Math.min(hits.length-1, hitIdx+delta));
  $$("#results .hit").forEach((el,i)=>el.classList.toggle("sel", i===hitIdx));
  const el = $$("#results .hit")[hitIdx];
  if(el) el.scrollIntoView({ block:"nearest" });
}

// ---- autocomplete ---------------------------------------------------------
let AC = { input:null, opts:[], idx:0 };
// The rows a chip input types onto : one board row, one staged row, or -- from
// the shelf's own "+ tag checked" box -- every checked staged row at once. One
// function so the autocomplete, and everything below it, is written once.
function acTargets(input){
  if(input.id === "stagetag") return picked();
  const s = input.closest(".srow");
  if(s){ const it = findStage(s.dataset.key); return it ? [ it ] : []; }
  const r = input.closest(".row");
  if(r){ const f = findItem(r.dataset.key); return f ? [ f.it ] : []; }
  return [];
}
function acOptions(input){
  if(input.id === "tagfind") return findOptions(input.value);
  const targets = acTargets(input);
  // Offer what at least one target hasn't got : with several rows picked, a tag
  // some of them are missing is exactly the one you're reaching for.
  const have = targets.length
    ? tagOptions().filter(v=>targets.every(it=>hasTag(it,v))).map(lc) : [];
  const term = lc(input.value.trim());
  return tagOptions().filter(v=>!have.includes(lc(v))).filter(v=>!term || lc(v).includes(term));
}
function acOpen(input){ AC.input = input; AC.idx = 0; AC.opts = acOptions(input); acRender(); }
function acRender(){
  const pop = $("#acpop");
  if(!AC.input){ pop.classList.remove("show"); return; }
  const term = AC.input.value.trim();
  const body = AC.opts.map((v,i)=>`<div class="acopt ${i===AC.idx?'sel':''}" data-v="${esc(v)}">${esc(v)}</div>`).join("");
  const isNew = term && !AC.opts.some(v=>lc(v)===lc(term));
  pop.innerHTML = AC.input.id === "tagfind"
    ? body || `<div class="acnew">${term ? `no tag matches “${esc(term)}”` : "every tag is in the filter"}</div>`
    : (body + (isNew?`<div class="acnew">↵ creates “${esc(term)}”</div>`:"")) ||
      `<div class="acnew">type to create a new one</div>`;
  const r = AC.input.getBoundingClientRect();
  pop.style.left = (r.left + window.scrollX) + "px";
  pop.style.top  = (r.bottom + window.scrollY + 4) + "px";
  pop.classList.add("show");
}
function acClose(){ AC.input = null; AC.opts = []; $("#acpop").classList.remove("show"); }
function acCommit(value){
  const input = AC.input;
  if(!input) return;
  const v = (value != null ? value : input.value).trim();
  if(!v){ acClose(); return; }
  if(input.id === "tagfind"){ findCommit(v); return; }
  const board = input.closest(".row");
  const srow  = input.closest(".srow");
  const n = acTargets(input).filter(it=>addTag(it, v)).length;
  if(!n){ input.value = ""; acClose(); return; }
  acClose();
  if(board){
    afterTagChange(board.dataset.key);
    const row = rowEl(board.dataset.key);
    if(row) row.querySelector(".chipin").focus();
    return;
  }
  // The shelf : redraw it, then put the caret back where it was so a run of
  // tags is one uninterrupted stretch of typing.
  markDirty(); renderStage(); renderPaintbar(); renderCounts();
  const el = srow ? ( srowEl(srow.dataset.key) || document ).querySelector(".chipin")
                  : $("#stagetag");
  if(el) el.focus();
  if(!srow) toast(`Tagged ${n} staged row(s) “${v}”`);
}

// ---- drag and drop --------------------------------------------------------
let dragKey = null, dragHit = null;
function clearDropMarks(){
  $$(".row").forEach(r=>r.classList.remove("drop-before","drop-after"));
  $("#board").classList.remove("dropinto");
}
function dropTarget(e){
  const board = e.target.closest("#board");
  if(!board) return null;
  const row = e.target.closest(".row");
  if(!row) return { index: DOC.items.length, row:null, after:false };
  const r = row.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  const f = findItem(row.dataset.key);
  return { index: (f ? f.idx : DOC.items.length) + (after?1:0), row, after };
}
document.addEventListener("dragover", e=>{
  if(!dragKey && !dragHit) return;
  const t = dropTarget(e);
  if(!t) return;
  e.preventDefault();
  clearDropMarks();
  if(t.row) t.row.classList.add(t.after?"drop-after":"drop-before");
  else $("#board").classList.add("dropinto");
});
document.addEventListener("drop", e=>{
  if(!dragKey && !dragHit) return;
  if(LOCKED){ clearDropMarks(); dragKey = dragHit = null; guard(); return; }
  const t = dropTarget(e);
  clearDropMarks();
  if(!t){ dragKey = dragHit = null; return; }
  e.preventDefault();
  // t.index is a position in YOUR order ( dropTarget reads findItem().idx ),
  // which in a lens is not where the pointer is. Grips are hidden while one is
  // on, so only a paper dragged in from the search can get here -- and it goes
  // where "add to ..." says rather than somewhere arbitrary.
  if(dragKey) moveTo(dragKey, t.index);
  else if(dragHit) addPaper(dragHit, VIEW ? insertIndex() : t.index);
  dragKey = dragHit = null;
});
document.addEventListener("dragend", ()=>{
  clearDropMarks();
  $$(".row.dragging").forEach(r=>r.classList.remove("dragging"));
  $$(".row").forEach(r=>r.draggable = false);
  dragKey = dragHit = null;
});
$("#board").addEventListener("mousedown", e=>{
  const h = e.target.closest(".grip");
  if(!h) return;
  const row = h.closest(".row");
  if(row) row.draggable = true;
});
$("#board").addEventListener("dragstart", e=>{
  const row = e.target.closest(".row");
  if(!row || !row.draggable){ e.preventDefault(); return; }
  dragKey = row.dataset.key;
  row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragKey); } catch(err){}
});
$("#results").addEventListener("dragstart", e=>{
  const hit = e.target.closest(".hit");
  if(!hit) return;
  // Dragging across the position box is selecting what you typed.
  if(e.target.closest(".at")){ e.preventDefault(); return; }
  if(LOCKED){ e.preventDefault(); return; }
  dragHit = hits[+hit.dataset.i];
  e.dataTransfer.effectAllowed = "copy";
  try { e.dataTransfer.setData("text/plain", dragHit.key); } catch(err){}
});

// ---- row interactions -----------------------------------------------------
$("#board").addEventListener("click", e=>{
  const row = e.target.closest(".row");
  const x = e.target.closest(".cellchips .x");
  if(x && row){
    const f = findItem(row.dataset.key);
    if(f){ toggleTag(f.it, x.dataset.drop); afterTagChange(f.it.key); }
    return;
  }
  if(e.target.closest('[data-act="remove"]') && row){ removeItem(row.dataset.key); return; }
  // A click on the body of a row : paints the armed tag if you're painting,
  // otherwise selects the row ( so the tag bar can tag it ). The grip is exempt
  // -- grabbing a row to drag it shouldn't select or tag it.
  if(row && !e.target.closest("input,textarea,select,button,a,.chip,.grip")){
    if(armed){
      const f = findItem(row.dataset.key);
      if(f){ toggleTag(f.it, armed); afterTagChange(f.it.key); }
    } else selectRow(row.dataset.key, e);
  }
});
// Links that open BEHIND this tab : the rendered Markdown, and every URL a
// free-text cell turned into a link ( see linkifyCell ). Opening a repo or a
// dataset record from a row you are in the middle of reading is not leaving the
// board -- you want the tab waiting for you, not in front of you -- so it is
// window.open + blur + focus back here rather than a plain target=_blank.
// A modified click is left alone : ⌘ / Ctrl / middle-click already mean this,
// and shift means a window.
function openBehind(e){
  const a = e.target.closest(".mdlink, .lnk a");
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button!==0) return;
  e.preventDefault();
  const w = window.open(a.href, "_blank");
  if(w){ try { w.blur(); } catch(err){} }
  window.focus();
}
$("#board").addEventListener("click", openBehind);
$("#stage").addEventListener("click", openBehind);
// Notes + custom columns : written into the document on every keystroke, and
// again on blur ( belt and braces -- anything that ever ends up in the box ends
// up in the file ).
function captureField(el){
  const row = el.closest(".row");
  if(!row) return;

  if(!f) return;
  const was = (f.it.fields||{})[el.dataset.field];
  if(was === el.value) return;
  (f.it.fields = f.it.fields||{})[el.dataset.field] = el.value;
  markDirty();
}
// Type a position into a row's number and press ↵ ( or tab away ) to send it
// there. Anything out of range clamps to the ends of the list.
function applyNumber(input){
  const row = input.closest(".row");
  if(!row) return;
  const f = findItem(row.dataset.key);
  if(!f) return;
  const want = parseInt(String(input.value).replace(/[^0-9]/g,""), 10);
  if(isNaN(want) || want === f.idx+1){ input.value = f.idx+1; return; }
  const to = Math.max(0, Math.min(want-1, DOC.items.length-1));
  const y  = window.scrollY;
  moveTo(f.it.key, to > f.idx ? to+1 : to);
  const again = rowEl(f.it.key);
  if(!again) return;
  const el = again.querySelector(".numin");
  again.classList.add("flash");
  // The page never chases the row -- in your order or in a lens. You renumbered
  // it, you didn't ask to follow it : it flashes at its new spot and you stay
  // where you were. It keeps the caret only while that spot is in view ; a caret
  // left in a row off-screen would drag you there on the next Tab. ( The scroll
  // is pinned rather than left alone because re-rendering the board restores
  // the caret, and a plain focus() scrolls. )
  window.scrollTo(0, y);
  if(!el) return;
  const r = again.getBoundingClientRect();
  if(r.bottom > 0 && r.top < innerHeight){ el.focus({ preventScroll:true }); el.select(); }
  else el.blur();
}

  if(e.key==="Enter"){ e.preventDefault(); applyNumber(e.target); }

// Two filters, ANDed : the text box, and the set of tags picked in the tag bar
// ( 🔎 Filter ). A row hidden by either drops out of the selection too, so the
// chips never tag a paper you can't see.
function matchesTags(it){
  return tagMatch(it.tags, Array.from(TAGF).map(lc), filterMode);
}
// The tag filter's rule, the same for the board and ⇩ Import from lists ( and
// for an agent : sortops.tags_match ) : any = a paper carrying one of the picked
// tags, all = every one of them, none = not one of them. Nothing picked lets
// every paper through, whichever it is.
const TAGMODES = [ "any", "all", "none" ];
const nextMode = m => TAGMODES[(TAGMODES.indexOf(m) + 1) % TAGMODES.length];
function tagMatch(tags, want, mode){
  if(!want.length) return true;
  const have = new Set((tags||[]).map(lc));
  if(mode === "all")  return want.every(w=>have.has(w));
  if(mode === "none") return !want.some(w=>have.has(w));
  return want.some(w=>have.has(w));
}
function applyFilter(){
  const q = $("#filter").value.trim();
  let pruned = false;
  $$(".row").forEach(row=>{
    const f = findItem(row.dataset.key);
    if(!f) return;
    // textHas ( /static/common.js ) : a title pasted from a PDF -- curly quotes,
    // a line break -- still finds the row.
    const hay = q ? [ f.it.title, f.it.key, f.it.doi, (f.it.tags||[]).join(" "),
      Object.values(f.it.fields||{}).join(" ") ].join(" ") : "";
    const hide = (q && !textHas(hay, q)) || !matchesTags(f.it);
    row.classList.toggle("hide", hide);
    if(hide && SEL.delete(row.dataset.key)) pruned = true;
  });
  if(pruned) paintSelection();
  // Every full redraw comes through here too, and its fresh rows need their ⚓.
  renderAnchor();
}
// 🔎 : the tag bar stops being a brush and becomes a filter. Turning it off
// clears the filter -- a hidden row you've forgotten about is worse than none.
function setFiltering(on){
  filtering = on;
  if(!filtering) TAGF.clear();
  else armed = null;

  $("#tagfilter").textContent = filtering ? "🔎 Filtering" : "🔎 Filter";

}

// 🔎 find a tag : with this many tags, the chip you want is easier typed than
// spotted. The bar's tags narrowed to what you type -- names that START with it
// first -- minus the ones already in the filter ; ↵ ( or a click ) adds the
// highlighted one to the filter, switching 🔎 Filter on if it was off. It rides
// on the chip inputs' autocomplete ( acOptions / acRender / acCommit ).
function findOptions(text){
  const term = text.trim();
  const left = tagOptions().filter(v=>!(filtering && TAGF.has(v)));
  if(!term) return left;
  const starts = left.filter(v=>lc(v).startsWith(lc(term)));
  return starts.concat(left.filter(v=>!lc(v).startsWith(lc(term)) && textHas(v, term)));
}

    let n = 0;
    rows.forEach(({ it, tier })=>{
      if(findItem(it.key)) return;
      const tags = Array.from(new Set([].concat(it.mods||[], it.tags||[]))).sort(byName);
      tags.forEach(rememberTag);
      const fields = Object.assign({}, it.fields||{}, { tier: tier.label||"" });
      DOC.columns.forEach(c=>{ if(fields[c.id]==null) fields[c.id] = ""; });
      DOC.items.push({ key:it.key, title:it.title||"", doi:it.doi||"", wid:it.wid||"",
        pdf:it.pdf||"", year:it.year||null, journal:it.journal||"", tags, fields,
        added_at: it.added_at || nowISO() });
      n++;
    });
    markDirty(); renderAll();
    fetchMeta(DOC.items.map(it=>it.key));
    toast(`Pulled ${n} paper(s) from the tier list`);
  });
});
// Labels the header button and persists a flip ( /static/common.js ). One
// setting shared by every prma page.
initTheme();

// ---- the header : a pinned bar, and the tools that scroll away ------------
// A long list needs the window, so only the bar ( <header> ) is pinned : the
// board, its counts, the links to the other pages, the anchor and Jump to ( see
// below ). Everything else is #tools -- what happens to the board and
// whether it's saved, the search, the tag bar. At the top of the page it sits under the bar
// as part of the page, so it scrolls away with the list instead of riding over
// it.
//
// / brings the search back from anywhere down the list : #tools drops down over
// the list -- its slot keeps its height, so nothing under it moves -- and puts
// itself away the moment you scroll the list by hand ( unless you're typing in
// it ), on Esc, or when you scroll back up to where it lives. A search you're
// in the middle of follows you the same way : adding a paper scrolls to its
// row, and the next one is likely a keystroke away.
//
// The bar itself stays ONE row ( .titlebar in the style ) : fitBar takes back
// everything it gave up, then gives it up again a step at a time until the row
// fits. Again whenever the window changes, or anything in the bar does -- the
// counts, the list's name, the account chip arriving, ⇢ Copy to list coming
// and going with the selection, the lock badge. A frame later rather than on
// the spot, so a burst of changes is one fit, and before anything is painted.
const BAR = $(".titlebar"), FITS = [ "fit1", "fit2", "fit3", "fit4", "fitwrap" ];
function fitBar(){
  BAR.classList.remove(...FITS);
  for(const c of FITS){
    if(BAR.scrollWidth <= BAR.clientWidth) return;
    BAR.classList.add(c);
  }
}
let fitFrame = 0;
const refit = () => { if(!fitFrame) fitFrame = requestAnimationFrame(()=>{ fitFrame = 0; fitBar(); }); };
window.addEventListener("resize", refit);
new MutationObserver(refit).observe(BAR, { subtree:true, childList:true, characterData:true,
                                           attributes:true, attributeFilter:[ "style" ] });
if(document.fonts) document.fonts.ready.then(refit);
refit();

const TOOLS = $("#tools"), SLOT = $("#toolslot");
const toolsOpen = () => TOOLS.classList.contains("float");
const toolsAway = () => SLOT.getBoundingClientRect().top < $("header").getBoundingClientRect().bottom - 1;
const typingInTools = () => TOOLS.contains(document.activeElement) &&
  /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
function floatTools(on){
  if(on === toolsOpen()) return;
  if(on){ SLOT.style.height = SLOT.offsetHeight + "px"; TOOLS.classList.add("float"); }
  else  { TOOLS.classList.remove("float"); SLOT.style.height = ""; }
  // Whatever scrolls a row into view while they're down -- adding a paper,
  // sending a row to a number -- has to land it below them, not under them.
  // Layout values, not the box on screen : that's still sliding in.
  document.documentElement.style.scrollPaddingTop = on ? (TOOLS.offsetTop + TOOLS.offsetHeight + 8) + "px" : "";
}
let toolsFrame = 0;
window.addEventListener("scroll", ()=>{
  if(toolsFrame) return;
  toolsFrame = requestAnimationFrame(()=>{
    toolsFrame = 0;
    if(toolsOpen()){ if(!toolsAway()) floatTools(false); }
    else if(toolsAway() && $("#results").classList.contains("show") && document.activeElement === $("#q")) floatTools(true);
  });
}, { passive:true });
// Put away by the list being scrolled BY HAND -- a wheel or a swipe outside the
// tools -- not by any scroll at all : adding a paper scrolls to its row, and
// that shouldn't take the search away from under you.
function stowTools(e){
  if(!toolsOpen() || TOOLS.contains(e.target) || typingInTools()) return;
  closeResults();
  floatTools(false);
}
window.addEventListener("wheel", stowTools, { passive:true });

// ↑ Top and ↓ Bottom, in the pinned bar next to Jump to : the two ends of a
// long list, one click from anywhere down it. Smooth unless the machine is set
// to reduce motion -- and with a jump behind it, because some renderers quietly
// drop a smooth scroll and leave you exactly where you were.
const motionOK = !window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function scrollEnd(bottom){
  const from = window.scrollY;
  const to   = bottom ? document.documentElement.scrollHeight : 0;
  if(!motionOK){ window.scrollTo(0, to); return; }
  window.scrollTo({ top:to, behavior:"smooth" });
  setTimeout(()=>{ if(window.scrollY === from) window.scrollTo(0, to); }, 250);
}
$("#totop").addEventListener("click", ()=>scrollEnd(false));
$("#tobottom").addEventListener("click", ()=>scrollEnd(true));

// ⚓ Anchor · ⤓ To anchor · Jump to : getting around a long list from the pinned
// bar. The anchor is a bookmark kept in THIS browser ( ANCHOR_KEY ), not in the
// board -- nothing here is an edit, so it works view-only and logged out too. It
// is held by the paper's key, so it follows the paper wherever it's moved to ; a
// paper deleted off the board keeps its anchor, so ↶ brings both back.
// Jump to takes the number on a row's box -- its place in YOUR order, in a lens too.
// Centred in what you can SEE -- the window less the pinned bar and column head
// ( or the tools, if / has them down ) -- not in the whole window, where the
// bar would sit on top of it. A row taller than that lands with its top showing.
function scrollToRow(el){
  const top  = toolsOpen() ? TOOLS.getBoundingClientRect().bottom
                           : $("header").offsetHeight + $("#colwrap").offsetHeight;
  const r    = el.getBoundingClientRect();
  const room = innerHeight - top;
  const y    = window.scrollY + r.top - top - Math.max(0, (room - r.height) / 2);
  window.scrollTo({ top: Math.max(0, y), behavior: motionOK ? "smooth" : "auto" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");  // flashes again on a second visit
}
// The topmost selected row in the order on screen. ( Declarations, not consts :
// the first render runs before this point in the file. )
function anchorPick(){ const r = $("#board .row.selected"); return r ? r.dataset.key : null; }

            : pick === ANCHOR ? "Lift the anchor off this row"

                              : "Drop the anchor on the selected row";
  const f = ANCHOR && findItem(ANCHOR);

  $("#toanchor").title = f ? `Scroll to the anchor — #${f.idx+1} ${f.it.title || f.it.key}`
                           : "No anchor yet — select a row and click ⚓ Anchor";
}
$("#anchorbtn").addEventListener("click", ()=>{

$("#toanchor").addEventListener("click", ()=>{

$("#jumpto").addEventListener("keydown", e=>{
  const box = e.target;
  if(e.key === "Escape"){ e.stopPropagation(); box.value = ""; box.blur(); return; }  // not the selection too
  if(e.key !== "Enter") return;
  e.preventDefault();
  const want = parseInt(String(box.value).replace(/[^0-9]/g,""), 10);
  if(isNaN(want) || !DOC.items.length) return;
  const n   = Math.max(1, Math.min(want, DOC.items.length));
  const row = rowEl(DOC.items[n-1].key);
  box.value = n; box.select();    // the next number just types over it
  if(!row || row.classList.contains("hide")){ toast(`#${n} is hidden by the filter`, 3500); return; }

});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("#listpop").classList.contains("show")){ closeListPop(); return; }
  if(e.key==="Escape"){
    // The hits list goes first, then the tools if / brought them down ; the next Esc is
    // the one that stops painting or clears the selection. Typing in the search
    // box, its own handler has already closed the list by the time this runs --
    // this is the one that reaches a list raised by 🆕 Recently added, where

  if((e.metaKey||e.ctrlKey) && /^[zyZY]$/.test(e.key)){

// ---- CSV ------------------------------------------------------------------
// #, DOI_or_Key, Title, Year, Tags, <columns…>, MD_File. Anything else in an
// imported file becomes its own free-text column, so the hand-made sheets ( and
// the tier page's exports, Tier column and all ) come in without losing
// anything ; Modalities / Section_Tags columns merge into the tag list.
/* csvCell is in /static/common.js -- one copy for both boards , /code and /datasets. */
function toCSV(){
  const head = [ "#","DOI_or_Key","Title","Year","Tags" ]
    .concat(DOC.columns.map(c=>c.label)).concat([ "MD_File" ]);
  const lines = [ head.map(csvCell).join(",") ];
  // The rows in the order you are LOOKING at, each numbered with its place in
  // YOUR order -- so an export taken from a year view still points at the board.
  const no = manualNo();
  viewItems().forEach(it=>{
    const m = META[it.key] || {};
    lines.push([ no.get(it.key), it.key, it.title||m.title||"", it.year||m.year||"", (it.tags||[]).join("; ") ]
      .concat(DOC.columns.map(c=>(it.fields||{})[c.id]||""))
      .concat([ m.has_md ? fileStem(libKey(it))+".md" : "" ])
      .map(csvCell).join(","));
  });
  return lines.join("\n");
}
// saveCSV ( /static/common.js ) , not a hand-rolled anchor : it is the one
// place the UTF-8 BOM goes on, and without it Excel reads every em dash this
// board writes into a Datasets cell as ` ‚Äî `.
$("#exportbtn").addEventListener("click", ()=>{
  saveCSV(toCSV(), `prma-sort-${new Date().toISOString().slice(0,10)}.csv`);
});
function parseCSV(text){
  const rows = []; let row = [], field = "", q = false, i = 0;
  text = text.replace(/^\uFEFF/, "").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i < text.length){
    const c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ q = true; i++; continue; }
    if(c === ','){ row.push(field); field = ""; i++; continue; }
    if(c === '\n'){ row.push(field); field = ""; rows.push(row); row = []; i++; continue; }
    field += c; i++;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim().length));
}
const H_NUM   = /^#$|^no\.?$|^rank$/i;
const H_KEY   = /^(doi[_ ]?or[_ ]?key|key)$/i, H_DOI = /^doi$/i;
const H_TITLE = /^title$/i, H_YEAR = /^year$/i;
const H_TAGS  = /^(tags?|modalit\w*|section[_ ]?tags?)$/i, H_MD = /^md[_ ]?file$/i;
const splitList = s => String(s||"").split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
function docFromCSV(rows, merge){
  const head = rows[0].map(h=>String(h||"").trim());
  const idx = { key:-1, doi:-1, title:-1, year:-1 };
  const tagCols = [], extra = [];
  head.forEach((h,i)=>{
    if(H_KEY.test(h)) idx.key = i;
    else if(H_DOI.test(h)) idx.doi = i;
    else if(H_TITLE.test(h)) idx.title = i;
    else if(H_YEAR.test(h)) idx.year = i;
    else if(H_TAGS.test(h)) tagCols.push(i);
    else if(H_MD.test(h) || H_NUM.test(h)) { /* derived — not stored */ }
    else if(h) extra.push({ i, id: slug(h,"col"), label: h });
  });
  const doc = merge
    ? JSON.parse(JSON.stringify(DOC))
    : { version:1, updated_at:"", options: JSON.parse(JSON.stringify(DOC.options)), columns:[], items:[],
        // "Replace everything" replaces the LIST. The staging shelf is not the
        // list -- it is references you haven't triaged yet -- so it survives ,
        // the same way the tag vocabulary below does.
        staging: JSON.parse(JSON.stringify(DOC.staging||[])) ,
        vocab:{ tags: JSON.parse(JSON.stringify(DOC.vocab.tags||[])) } };
  extra.forEach(x=>{ if(!doc.columns.some(c=>c.id===x.id)) doc.columns.push({ id:x.id, label:x.label }); });
  if(!doc.columns.length) doc.columns.push({ id:"notes", label:"Notes" });
  let added = 0, updated = 0;
  rows.slice(1).forEach(r=>{
    const cell = i => (i>=0 && i<r.length) ? String(r[i]).trim() : "";
    const title = cell(idx.title);
    const key   = cell(idx.key) || cell(idx.doi) || ("loose-" + (slug(title,"row") || Math.random().toString(36).slice(2,9)));
    let tags = [];
    tagCols.forEach(i=>{ tags = tags.concat(splitList(cell(i))); });
    const fields = {};
    extra.forEach(x=>{ fields[x.id] = cell(x.i); });
    const year = parseInt(cell(idx.year), 10);
    // DOIs are case-insensitive, and a sheet's zotero:ABCD1234 is the row that
    // took the library's nodoi-zotero-ABCD1234 ( see adoptLibraryKeys ).
    const same = lc(key), alias = same.replace(/^zotero:/, "nodoi-zotero-");
    const existing = doc.items.find(x=>lc(x.key)===same || lc(x.key)===alias);
    if(existing){
      if(title) existing.title = title;
      if(!isNaN(year)) existing.year = year;
      if(tags.length) existing.tags = Array.from(new Set(existing.tags.concat(tags))).sort(byName);
      existing.fields = Object.assign(existing.fields||{}, fields);
      updated++;
    } else {
      doc.items.push({ key, title, doi: cell(idx.doi) || (/^10\./.test(key) ? key : ""), wid:"",
        pdf:"", year: isNaN(year) ? null : year, journal:"", tags: tags.sort(byName),
        fields, added_at: nowISO() });
      added++;
    }
  });
  doc.items.forEach(it=>it.tags.forEach(tag=>{
    if(!doc.vocab.tags.some(x=>lc(x.name)===lc(tag)))
      doc.vocab.tags.push({ name:tag, color:PALETTE[doc.vocab.tags.length % PALETTE.length] });
  }));
  return { doc, added, updated };
}
// ---- importing : a CSV file, or a Google Sheet by its link ----------------
// Two ways in, one importer. A board export ( it always carries MD_File ) or a
// hand-made sheet gets the merge / replace choice it always had. The shared
// Google Sheet -- this board's export grown with papers of its own and the
// Methods summary / Datasets / Code columns -- never takes anything away ( see
// mergeSheet ) : it brings papers, tags and text in, and changes what's already
// here only where you say so, column by column. Read by its link it brings the
// links behind its cells too ( applyLinks ) ; a CSV download has only the text.
$("#importbtn").addEventListener("click", ()=>{
  if(guard()) return;
  sheet(`
    <h3>Import a CSV or a Google Sheet</h3>
    <p>Paste a <b>Google Sheets link</b> — the sheet has to be shared as <i>Anyone with the link</i>
       — or drop a <kbd>.csv</kbd>. By its link a sheet brings in the <b>links behind its cells</b>
       too; a sheet downloaded with <i>File → Download → CSV</i> carries only their text.</p>
    <input type="text" id="sheeturl" autocomplete="off" spellcheck="false"
      placeholder="https://docs.google.com/spreadsheets/d/…" value="${esc(DOC.options.sheet_url||"")}">
    <div class="drop" id="csvdrop">or drop a <b>.csv</b> here, or <a href="#" id="csvpick">choose a file</a></div>
    <div class="btns">
      <button data-act="cancel">Cancel</button>
      <button class="primary" data-act="fetch">Read the sheet</button>
    </div>`, act=>{
    if(act !== "fetch") return;
    const url = (($("#sheeturl")||{}).value || "").trim();
    if(!url){ toast("Paste a sheet link, or drop a .csv"); return; }
    fetchSheet(url);
  });
  const pick = $("#csvpick"), drop = $("#csvdrop"), inp = $("#sheeturl");
  inp.onkeydown = ev=>{
    if(ev.key !== "Enter") return;

  };
  pick.onclick = ev=>{
    ev.preventDefault();

    fi.click();
  };
  // Same as the refs panel's drop : the page's own drag handlers bail on a drag

  drop.ondragover  = ev=>{ ev.preventDefault(); ev.stopPropagation(); drop.classList.add("over"); };
  drop.ondragleave = ()=> drop.classList.remove("over");

    ev.preventDefault(); ev.stopPropagation(); drop.classList.remove("over");

function importFailed(what, why){
  sheet(`<h3>Could not read ${esc(what)}</h3><p>${esc(why)}</p>
    <div class="btns"><button data-act="ok">OK</button></div>`);
}
// The server fetches it ( src/db/gsheet.py ) -- docs.google.com sends the page
// no CORS headers, so the browser can't.
async function fetchSheet(url){
  toast("Reading the sheet…", 20000);
  let d;
  try {
    d = await (await postJSON("/api/sheet/csv", { url })).json();
  } catch(e){ toast("Could not reach the server", 4000); return; }
  $("#toast").classList.remove("show");
  if(!d || !d.ok){ importFailed("that sheet", (d && d.error) || "no answer from the server"); return; }
  importRows(d.rows || parseCSV(d.csv || ""), "the Google Sheet", url,
    { links: d.links || null, why: d.links_error || (d.links ? "" : "the server sent none") });
}
async function csvFile(f){
  $("#overlay").classList.remove("show");
  let rows;
  try { rows = parseCSV(await f.text()); }
  catch(e){ importFailed(f.name, "it isn't a text file"); return; }
  importRows(rows, f.name, "");
}
// The Google Sheet's own columns. A file carrying any of them -- and no MD_File,
// which every prma export writes -- is that sheet, downloaded.
const H_SHEET = /^(methods?[_ ]?summary|methods?[_ ]?evidence|added[_ ]?by|datasets?|code)$/i;
// ... and the ones left out of an add-only import unless you tick them : the
// sheet's Notes are somebody else's notes, not this board's.
const H_SKIP  = /^(notes?|added[_ ]?by|methods?[_ ]?evidence)$/i;
function importRows(rows, name, url, got){
  if(rows.length < 2){ importFailed(name, "there are no rows in it"); return; }
  const head = rows[0].map(h=>String(h||"").trim());
  const sheetish = !head.some(h=>H_MD.test(h)) && head.some(h=>H_SHEET.test(h));
  if(url || sheetish) sheetImport(rows, name, url, applyLinks(rows, got));
  else csvImport(rows, name);
}
// The links behind a sheet's cells, written into its rows' text ( linkedCell )
// before anything is compared or merged -- so the dialog's counts and the
// import itself both see the linked text. Only in the free-text columns : the
// ones that say which paper a row IS stay as they read, since a title that
// links to its publisher is still just the title. Returns what the import
// dialog says about them : { byCol : { column index : cells }, why }.
function applyLinks(rows, got){
  const byCol = {};
  if(!got || !got.links) return { byCol, why: (got && got.why) || "" };
  const free = new Set(sheetColumns(rows[0].map(h=>String(h||"").trim())).extra.map(x=>x.i));
  got.links.forEach((cells, r)=>{
    if(!r || !cells || !rows[r]) return;
    Object.keys(cells).forEach(j=>{
      if(!free.has(+j)) return;
      rows[r][j] = linkedCell(cells[j]);
      byCol[j] = (byCol[j]||0) + 1;
    });
  });
  return { byCol, why: "" };
}
function csvImport(rows, name){
  sheet(`
    <h3>Import ${rows.length-1} row(s) from ${esc(name)}</h3>
    <p>Columns found: ${rows[0].filter(Boolean).map(h=>`<kbd>${esc(h)}</kbd>`).join(" ")}</p>
    <p><b>Tags</b> / <b>Modalities</b> columns merge into each paper's tag list; everything else
       becomes its own free-text column. Rows already on the board are updated in place, and the
       file's row order becomes the list order. <b>Column by column…</b> instead lets you say,
       for each column, whether it only fills empty cells here or overwrites them — and never
       removes anything.</p>
    <div class="btns">
      <button data-act="cancel">Cancel</button>
      <button data-act="addonly">Column by column…</button>
      <button data-act="merge">Merge into this board</button>
      <button data-act="replace">Replace everything</button>
    </div>`, act=>{
    if(act==="cancel" || !act) return;
    if(act==="addonly"){ sheetImport(rows, name, "", applyLinks(rows)); return; }
    const r = docFromCSV(rows, act==="merge");
    DOC = r.doc;
    markDirty(); renderAll();
    autoTagImported(DOC.items).then(n=>
      toast(`Imported — ${r.added} added, ${r.updated} updated${n?`, ${n} auto-tagged`:""}`, 4200));
  });
}
// An imported row that arrived with no tags at all takes its ` prma modalities `
// stamp, the same courtesy a paper added from search gets.
async function autoTagImported(items){
  await fetchMeta(items.map(it=>it.key), true);
  let n = 0;
  items.forEach(it=>{
    const m = META[it.key];
    if(!(it.tags||[]).length && m && m.mods && m.mods.length){ it.tags = m.mods.slice(); sortTags(it); m.mods.forEach(rememberTag); n++; }
  });
  if(n){ markDirty(); renderAll(); }
  return n;
}
function sheetColumns(head){
  const ix = { key:-1, doi:-1, title:-1, year:-1, tags:[], extra:[] };
  head.forEach((h,i)=>{
    if(H_KEY.test(h)) ix.key = i;
    else if(H_DOI.test(h)) ix.doi = i;
    else if(H_TITLE.test(h)) ix.title = i;
    else if(H_YEAR.test(h)) ix.year = i;
    else if(H_TAGS.test(h)) ix.tags.push(i);
    else if(H_MD.test(h) || H_NUM.test(h)) { /* derived — not stored */ }
    else if(h) ix.extra.push({ i, label:h });
  });
  return ix;
}
// Onto a copy of `doc` -- the caller swaps it in, so the dialog can dry-run it
// for its counts and the toast can undo it by swapping back :
//   * a paper the sheet has and the board hasn't is added ( key, DOI, title --
//     every way this board already knows a paper, see haveIndex ) ;
//   * a paper both have takes the sheet's text in each chosen column, the way
//     that column's mode says :
//       fill -- only where ITS cell is empty ; a cell with anything in it is
//               left exactly as it is, and counted ;
//       over -- wherever the two differ, the sheet's text replaces this one's ;
//     and its tags the way how.tags says : merge adds the ones it's missing,
//     replace makes them the sheet's. Either way the sheet has to SAY
//     something : an empty cell there never clears one here, and a row with
//     no tags there never strips a paper's tags here ;
//   * a paper waiting on the staging shelf that the sheet lists moves onto the
//     list, where the sheet says it belongs ;
//   * nothing is removed : a paper only this board has stays, riding with the
//     row above it when the sheet's order is taken.
// how = { cols:[ { i:header index, mode:"fill"|"over" }… ], tags:""|"merge"|"replace",
//         order:"sheet"|"append", url }
// n.col[ header index ] / n.tagGain / n.tagDiffer count, for papers already
// here, what each choice WOULD touch whichever mode it's in -- what the dialog
// labels its choices with.
function mergeSheet(src, rows, how){
  const doc  = JSON.parse(JSON.stringify(src));
  const head = rows[0].map(h=>String(h||"").trim());
  const ix   = sheetColumns(head);
  doc.options = doc.options || {};
  doc.staging = doc.staging || [];
  // A chosen column lands in the board's column of the same name when there is
  // one ( Notes -> Notes ) ; anything new is added FOLDED, so the board keeps its
  // width until you ask for them.
  const modes = new Map(how.cols.map(c=>[ c.i, c.mode ]));
  const take = ix.extra.filter(x=>modes.has(x.i)).map(x=>{
    const have = doc.columns.find(c=>c.id===slug(x.label) || lc(c.label)===lc(x.label));
    if(have) return { i:x.i, id:have.id, mode:modes.get(x.i) };
    let id = slug(x.label) || "col";
    while(doc.columns.some(c=>c.id===id)) id += "-2";
    doc.columns.push({ id, label:x.label });
    doc.options.fold_cols = (doc.options.fold_cols||[]).concat(id);
    doc.items.concat(doc.staging).forEach(it=>{ (it.fields = it.fields||{})[id] = ""; });
    return { i:x.i, id, mode:modes.get(x.i) };
  });
  // "fmri" in the sheet is the board's "fMRI" : a tag takes the spelling the
  // board already uses, so importing never splits one tag into two.
  const canon = new Map(tagOptions().map(v=>[lc(v), v]));
  const tagName = t => { if(!canon.has(lc(t))) canon.set(lc(t), t); return canon.get(lc(t)); };
  // A key that IS a DOI answers as a DOI too : otherwise a sheet row carrying
  // only that DOI would mint a second row under the same key, and the server
  // keeps the first of two -- which, in the sheet's order, could be the new one.
  // And a row that took the library's key for a sheet's zotero:ABCD1234 ( see
  // adoptLibraryKeys ) still answers to the sheet's spelling.
  const known = new Map();
  const index = it=>{
    const put = k => { if(k && !known.has(k)) known.set(k, it); };
    put(lc(it.key));
    if(it.doi) put("doi:"+lc(it.doi));
    if(/^10\./.test(it.key||"")) put("doi:"+lc(it.key));
    const z = /^nodoi-zotero-(.+)$/i.exec(it.key||"");
    if(z) put(lc("zotero:"+z[1]));
    const t = ntitle(it.title);
    if(t) put("t:"+t);
  };
  doc.items.forEach(index);          // the list first : it wins a tie with the shelf
  doc.staging.forEach(index);
  const onList = new Set(doc.items), onShelf = new Set(doc.staging);
  const cell = (r,i) => (i>=0 && i<r.length) ? String(r[i]).trim() : "";
  const seq = [], took = new Set();
  const n = { added:0, have:0, shelf:0, filled:0, replaced:0, kept:0, tagged:0,
              col:{}, tagGain:0, tagDiffer:0 };
  rows.slice(1).forEach(r=>{
    const key = cell(r, ix.key), title = cell(r, ix.title);
    const doi = cell(r, ix.doi) || (/^10\./.test(key) ? key : "");
    if(!key && !doi && !title) return;
    let it = (key && known.get(lc(key))) || (doi && known.get("doi:"+lc(doi)))
          || (title && known.get("t:"+ntitle(title))) || null;
    if(it && took.has(it)) return;                  // the sheet lists it twice : first one wins
    const year = parseInt(cell(r, ix.year), 10);
    if(it){
      n.have++;
      if(onShelf.has(it)) n.shelf++;
      if(!it.title && title) it.title = title;
      if(it.year == null && !isNaN(year)) it.year = year;
      if(!it.doi && doi) it.doi = doi;
    } else {
      it = { key: key || doi || ("loose-" + (slug(title) || Math.random().toString(36).slice(2,9))),
             title, authors:"", doi, wid:"", pdf:"", year: isNaN(year) ? null : year, journal:"",
             tags:[], fields: Object.fromEntries(doc.columns.map(c=>[c.id,""])), added_at: nowISO() };
      n.added++;
      index(it);
    }
    took.add(it);
    const here = onList.has(it) || onShelf.has(it);
    if(how.tags){
      it.tags = it.tags || [];
      const want = [];
      ix.tags.forEach(i=>splitList(cell(r,i)).map(tagName).forEach(t=>{ if(!hasTag({ tags:want },t)) want.push(t); }));
      const gain = want.filter(t=>!hasTag(it,t));
      const differ = gain.length > 0 || (want.length > 0 && it.tags.some(t=>!hasTag({ tags:want },t)));
      if(here){ if(gain.length) n.tagGain++; if(differ) n.tagDiffer++; }
      if(how.tags === "replace" && differ){ it.tags = want; if(here) n.tagged++; }
      else if(how.tags === "merge" && gain.length){ it.tags = it.tags.concat(gain); if(here) n.tagged++; }
      sortTags(it);
    }
    take.forEach(c=>{
      const v = cell(r, c.i), f = it.fields = it.fields || {};
      if(!v) return;
      const was = String(f[c.id]||"").trim(), st = n.col[c.i] = n.col[c.i] || { fill:0, differ:0 };
      if(!was){ f[c.id] = v; if(here){ st.fill++; n.filled++; } }
      else if(was !== v){
        st.differ++;
        if(c.mode === "over"){ f[c.id] = v; n.replaced++; } else n.kept++;
      }
    });
    seq.push(it);
  });
  doc.staging = doc.staging.filter(it=>!took.has(it));
  if(how.order === "sheet"){
    // The sheet's order, with every paper only this board has kept right under
    // whichever of its old neighbours above it the sheet also has ( or at the
    // top, when none of them are ) -- moved, never dropped.
    const lead = [], under = new Map();
    let anchor = null;
    doc.items.forEach(it=>{
      if(took.has(it)){ anchor = it; return; }
      if(!anchor){ lead.push(it); return; }
      if(!under.has(anchor)) under.set(anchor, []);
      under.get(anchor).push(it);
    });
    doc.items = lead.concat(...seq.map(it=>[ it ].concat(under.get(it) || [])));
  } else {
    doc.items = doc.items.concat(seq.filter(it=>!onList.has(it)));
  }
  if(how.url) doc.options.sheet_url = how.url;
  // The whole promise of this import, checked rather than assumed : every row
  // that was on the list still is, and no two rows share a key.
  const all = doc.items.concat(doc.staging);
  const listed = new Set(doc.items.map(it=>it.key));
  const ok = doc.items.length === src.items.length + n.added + n.shelf
          && doc.staging.length === (src.staging||[]).length - n.shelf
          && src.items.every(it=>listed.has(it.key))
          && new Set(all.map(it=>it.key)).size === all.length;
  return { doc, n, ok, fresh: seq.filter(it=>!onList.has(it) && !onShelf.has(it)) };
}
// What each choice in the import dialog would do to the papers already here,
// in words, off the dry run's counts ( mergeSheet's n.col / n.tagGain /
// n.tagDiffer ).
function modeNote(mode, st){
  if(!mode) return "not brought in";
  const bits = [ `${st.fill} empty here get filled` ];
  if(st.differ) bits.push(mode === "over" ? `${st.differ} that differ get overwritten`
                                          : `${st.differ} that differ stay as they are`);
  return bits.join(" · ");
}
function tagNote(mode, n){
  return !mode ? "not brought in"
    : mode === "replace" ? `${n.tagDiffer} paper(s) here get the sheet's tags instead of their own`
                         : `${n.tagGain} paper(s) here gain the tags they're missing`;
}
// How many of the papers already on the list the sheet's order would MOVE :
// all of them but the longest run the two orders already agree on ( a longest
// increasing subsequence over where each one sits now ) -- so one paper
// dragged from the bottom to the top counts as one, not as the whole list.
function orderMoves(rows){
  const now = new Map(DOC.items.map((it,i)=>[ it.key, i ]));
  const seq = mergeSheet(DOC, rows, { cols:[], tags:"", order:"sheet" }).doc.items
    .map(it=>now.get(it.key)).filter(i=>i != null);
  const tails = [];
  seq.forEach(x=>{
    let lo = 0, hi = tails.length;
    while(lo < hi){ const m = (lo + hi) >> 1; if(tails[m] < x) lo = m + 1; else hi = m; }
    tails[lo] = x;
  });
  return seq.length - tails.length;
}
function sheetImport(rows, name, url, lk){
  if(guard()) return;
  const head = rows[0].map(h=>String(h||"").trim());
  const ix = sheetColumns(head);
  if(ix.key < 0 && ix.doi < 0 && ix.title < 0){
    importFailed(name, "it has no DOI / key or Title column to match papers on");
    return;
  }
  // One dry run with everything in : a column's counts don't depend on what the
  // others are set to, so this labels every choice the dialog offers.
  const dry = mergeSheet(DOC, rows, { cols: ix.extra.map(x=>({ i:x.i, mode:"fill" })),
                                      tags:"merge", order:"append" }).n;
  const stat = i => dry.col[i] || { fill:0, differ:0 };
  const moves = orderMoves(rows);
  const opts = (list, on) => list.map(([v,l])=>`<option value="${v}"${v===on?" selected":""}>${l}</option>`).join("");
  const COL_MODES = [ ["", "leave out"], ["fill", "fill empty cells"], ["over", "overwrite"] ];
  const TAG_MODES = [ ["", "leave out"], ["merge", "add missing"], ["replace", "replace"] ];
  const choices = (ix.tags.length
      ? [`<b>Tags</b><select data-tags>${opts(TAG_MODES, "merge")}</select><span class="cc">${esc(tagNote("merge", dry))}</span>`] : [])
    .concat(ix.extra.map(x=>{
      const on = H_SKIP.test(x.label) ? "" : "fill";
      return `<b>${esc(x.label)}</b><select data-mode="${x.i}">${opts(COL_MODES, on)}</select>`+
        `<span class="cc">${esc(modeNote(on, stat(x.i)))}</span>`;
    }));
  const linked = Object.keys(lk.byCol).map(i=>`${esc(head[i])} ${lk.byCol[i]}`);
  const linkNote = !url
      ? `<p>A downloaded CSV has only the text of its cells — import the sheet by its <b>link</b> to
         bring in the links behind them too.</p>`
    : linked.length
      ? `<p>🔗 <b>The links behind the cells came in too</b> — ${linked.join(" · ")} cells — each linked
         line as its full URL, with its label in front where the label says something the URL doesn't.</p>`
    : lk.why
      ? `<p class="warn">⚠ The links behind the cells couldn't be read ( ${esc(lk.why)} ) — this brings
         in their text only.</p>` : "";
  sheet(`
    <h3>Import from ${esc(name)}</h3>
    <p><b>${dry.added}</b> new paper(s) · <b>${dry.have - dry.shelf}</b> already on the board`+
      (dry.shelf ? ` · <b>${dry.shelf}</b> on the staging shelf, which move onto the list` : "")+`.
       New papers come in with everything below that isn't left out. For the papers already here
       you choose what the sheet may change — and <b>nothing is ever removed</b>.</p>
    ${linkNote}
    <div class="sub">What the sheet brings in</div>
    <div class="colmodes">${choices.join("") || `<span>Only the papers themselves — there are no other columns.</span>`}</div>
    <p><b>Overwrite</b> takes the sheet's word only where it has one: an empty cell there never
       clears one here, and the toast undoes the whole import. A column this board doesn't have
       yet arrives <b>folded away</b> — <kbd>▸ Show Extra Columns</kbd> in the action row brings
       it out.</p>
    <div class="sub">Order</div>
    <label class="opt"><input type="radio" name="sheetorder" value="append" checked>
      <div><b>Keep this board's order</b> <span>— the new papers go on the end, in the sheet's order.</span></div></label>
    <label class="opt"><input type="radio" name="sheetorder" value="sheet">
      <div><b>Use the sheet's order</b> <span>— ${moves
        ? `<b class="warnb">moves ${moves} of the ${DOC.items.length} papers here</b> to match it`
        : "it already matches this board's"}. A paper only this board has stays under the row
      it's under now.</span></div></label>
    <div class="btns">
      <button data-act="cancel">Cancel</button>
      <button class="primary" data-act="add">Import</button>
    </div>`, act=>{
    if(act !== "add") return;
    const cols = $$("#sheet select[data-mode]").filter(s=>s.value).map(s=>({ i:+s.dataset.mode, mode:s.value }));
    const tags = ($("#sheet select[data-tags]")||{}).value || "";
    const ord  = ($("#sheet input[name=sheetorder]:checked")||{}).value || "append";
    applySheet(rows, { cols, tags, order: ord, url });
  }, true);
  // Each choice says what it would do as you make it -- an overwrite turns its
  // note amber, so the columns that will change things here stand out.
  $$("#sheet select[data-mode], #sheet select[data-tags]").forEach(s=>{
    s.onchange = ()=>{
      const cc = s.nextElementSibling;
      cc.textContent = s.dataset.tags != null ? tagNote(s.value, dry) : modeNote(s.value, stat(+s.dataset.mode));
      cc.classList.toggle("over", s.value === "over" || s.value === "replace");
    };
  });
}
function applySheet(rows, how){
  if(guard()) return;
  const r = mergeSheet(DOC, rows, how);
  if(!r.ok){ importFailed("that sheet", "the merge came out short of what this board already holds, so nothing was changed. Nothing has been saved."); return; }
  const before = DOC;
  DOC = r.doc;
  DOC.items.concat(DOC.staging).forEach(it=>(it.tags||[]).forEach(rememberTag));
  SEL.clear();
  markDirty(); renderAll();
  const k = r.n;
  const msg = `Added ${k.added} new paper(s)`+(k.shelf?`, ${k.shelf} off the shelf`:"")+
    ` · ${k.have - k.shelf} already here`+
    (k.tagged ? `, ${k.tagged} ${how.tags === "replace" ? "had their tags replaced" : "gained tags"}` : "")+
    (k.filled ? `, ${k.filled} cell(s) filled` : "")+
    (k.replaced ? `, ${k.replaced} overwritten` : "")+
    (k.kept ? ` · ${k.kept} cell(s) kept as they were` : "");
  toast(msg, 12000, "Undo", ()=>{ DOC = before; markDirty(); renderAll(); toast("Import undone"); });
  if(r.fresh.length) autoTagImported(r.fresh);
}

// Whatever is typed here reaches the server first : a duplicate, a copy to

async function flushSave(){

    else await new Promise(r=>setTimeout(r, 150));
  }
  return !dirty;
}
// The name box every list dialog has, with the link the name makes under it --

async function listPost(url, body, what){

    if(!r.ok){ toast(r.locked ? "That list is in view-only mode right now" : `Couldn't ${what} — ${r.error || res.statusText}`, 6000); return null; }

  } catch(e){ toast(`Couldn't ${what} — the server isn't answering`); return null; }

const whereArg = v => v === "shelf" ? { shelf:true } : v ? { at:v } : {};
function renderCopyTo(){

}
$("#copyto").addEventListener("click", async ()=>{
  const keys = DOC.items.filter(it=>SEL.has(it.key)).map(it=>it.key);
  if(!keys.length) return;

  sheet(`
    <h3>Copy ${keys.length} paper(s) to another list</h3>

    <div class="btns"><button data-act="cancel">Cancel</button>
      ${LOCKED ? "" : `<button data-act="move">Move</button>`}
      <button class="primary" data-act="copy">Copy</button></div>`, act=>{

  });
  const pickNew = ()=>{
    const isNew = $("#ctto").value === "@new";
    $("#ctnew").style.display = isNew ? "" : "none";

  const box = $("#ctpos");

    const l = targets.find(x=>x.slug===$("#ctto").value);

  });

async function copyTo(keys, move, targets){
  const to = $("#ctto").value, at = $("#ctat").value, name = $("#lname").value.trim();
  const pos = Number($("#ctpos").value);
  if(to === "@new" && !slug(name)){ toast("Name the new list first"); return; }
  if(to !== "@new" && at === "@n" && !(Number.isInteger(pos) && pos >= 1)){ toast("Type a position — 1 or more"); return; }
  if(!(await flushSave())){ toast("This list couldn't be saved first — try again in a moment"); return; }
  let dest, n = keys.length, shifted = 0, had = 0, from = 0;
  if(to === "@new"){
    dest = await makeList({ name, from: LIST, keys });
    if(!dest) return;
  } else {
    dest = targets.find(l=>l.slug===to);
    // existing:"move" -- a paper that list already has is re-placed with the
    // rest rather than skipped ; the op answers where the block landed.
    const r = await listPost(`${dest.api}/ops`,
      { ops:[ Object.assign({ op:"import_list", from: LIST, keys, existing:"move" },
                            at === "@n" ? { at:pos } : whereArg(at)) ] }, `copy to “${dest.name}”`);
    if(!r) return;
    const res = r.results[0];
    n = res.imported.length; shifted = (res.moved || []).length; had = res.skipped.length;
    if(res.at && n + shifted) from = res.at;
  }
  const msg = `${move ? "Moved" : "Copied"} ${n} paper(s) to “${dest.name}”`+
    (shifted ? ` · re-placed ${shifted} it already had` : "")+
    (from ? ` · starting at #${from}` : "")+
    (had ? ` · ${had} it already had` : "");
  if(!move){ toast(msg, 9000, "Open it", ()=>{ location.href = dest.url; }); return; }
  const before = cloneDoc(DOC), gone = new Set(keys);
  DOC.items = DOC.items.filter(it=>!gone.has(it.key));
  SEL.clear(); selAnchor = null;
  markDirty(); renderAll();
  toast(msg, 12000, "Undo", ()=>{
    DOC = before; markDirty(); renderAll();
    toast(`Put back here — they are still on “${dest.name}” too`, 6000);
  });
}
