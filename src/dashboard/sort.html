<!-- $ , $$ , esc , fmt , PROXY , mdHref() , doiLinks() , codeLinks() ,
     initTheme() , trackHeadHeight() -- the helpers every prma page used to write out for itself.
     Loaded before the page script , so they are plain globals below ; nothing
     here may redeclare them. -->
<script src="/static/common.js"></script>
<script>
// ---------------------------------------------------------------------------
// The sort board : ONE list, in your order, numbered 1..N. No groups -- what a
// paper IS you say with tags, where it SITS you say by dragging it. Tagging
// never moves a row unless you turn Auto-move on. See src/db/sortboard.py .
// ---------------------------------------------------------------------------
const fileStem = k => String(k||"").replace(/[\/\\]/g, "_");

const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48);
const nowISO = () => new Date().toISOString();
const lc = s => String(s||"").toLowerCase();

// ---- which list -----------------------------------------------------------
// /sort is the main list ; /sort/<slug> is one of the others, each a board of
// its own ( src/db/sortlists.py ). The same page draws all of them -- it only
// has to know which document to ask for and where to save it. Everything that
// is about ONE board ( the draft, the anchor, how staged rows matched ) is kept
// per list in this browser ; the main list keeps the names it always had, so a
// draft from before there were lists is still found.
const LIST = decodeURIComponent((location.pathname.match(/^\/sort\/([^\/]+)\/?$/) || [])[1] || "");
const API  = LIST ? `/api/sort/lists/${encodeURIComponent(LIST)}` : "/api/sort";
const listKey = k => LIST ? `${k}:${LIST}` : k;
let LISTS = [];             // every list ( GET /api/sort/lists ), for the switcher
let MISSING = false;        // there is no such list ( or it was deleted while open )

let DOC   = { version:1, options:{auto_move:false}, columns:[{id:"notes",label:"Notes"}], items:[], staging:[], vocab:{tags:[]} };
let REV   = 0;
let VOCAB = [];             // modality vocabulary ( config/methods.py )
let META  = {};             // paper key -> /api/paper-meta entry
let armed = null;           // tag armed for click-to-tag painting
let SEL   = new Set();      // keys of the selected rows ( outlined ) -- see selectRow
let selAnchor = null;       // where a shift-click range starts from
let ANCHOR = null;          // key of the ⚓ row ( this browser's ) -- see renderAnchor
const ANCHOR_KEY = listKey("prma-sort-anchor");
try { ANCHOR = localStorage.getItem(ANCHOR_KEY) || null; } catch(e){}
let TAGF  = new Set();      // tags the board is filtered down to ( see applyFilter )
let filtering = false;      // the tag bar is a filter right now, not a brush
let filterMode = "any";     // ... and how a row has to match TAGF : any / all / none ( tagMatch )
let SOFF  = new Set();      // staged keys whose checkbox is OFF ( this browser only )
// How each staged row was matched to the library ( "doi" / "title" / "fuzzy" ).
// Deliberately NOT part of the document : it's a fact about the import you just
// ran, worth a badge while you review it and meaningless a day later.
let STAGEHOW = {};
let dirty = false, saving = false, saveTimer = null;
// Bumped on every edit ( markDirty ), so a save can tell whether you typed while
// it was out -- in which case what it sent is not everything there is.
let EDITS = 0;
// View-only : the server's answer, not this browser's ( see setLocked ). Starts
// false so a page that never reaches the server is an ordinary broken page
// rather than a silently read-only one.
let LOCKED = false;
// What the SERVER says about the latch. LOCKED above is what this tab obeys :
// the latch , or an anonymous visitor ( see setLocked ).
let SERVER_LOCKED = false;

// ---- tag colours ----------------------------------------------------------
// A pastel wheel. Every tag gets one, so a row's chips are a pattern you can
// read at a glance instead of five words you have to. Dark ink reads on all of
// them, in either theme. A new tag takes the next colour nothing else is using ;
// anything without a stored colour falls back to a stable one picked from its
// name, so the board is never a wall of grey.
const PALETTES = {
  wsu: [
    "#a8cfbb","#f8e08e","#8fb98f","#cba052","#c3dca2","#e7e3c6","#719949",
    "#dcd59a","#6fae91","#ae8643","#a6d2d2","#eccf7f","#9fbf7a","#cfd8cd" ],
  pastel: [
    "#bfd8f7","#c6e8e2","#c9e9c0","#e3eeb4","#f6e7ab","#fbd9b4","#f9c9c0",
    "#f4c3ce","#e9c6e8","#d3ccf3","#c6d2f0","#bfe4f2","#e0dac6","#dfe2e8" ] };
let SKIN = document.documentElement.dataset.skin === "pastel" ? "pastel" : "wsu";
let PALETTE = PALETTES[SKIN];
function reskin(c){
  const i = PALETTES[SKIN === "wsu" ? "pastel" : "wsu"].indexOf(lc(c));
  return i < 0 ? c : PALETTE[i];
}
const TAGFG = "#20242c";
const isHex = c => /^#[0-9a-f]{6}$/i.test(String(c||""));
function hashIdx(s){ let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h % PALETTE.length; }
function vocabEntry(name){ return (DOC.vocab.tags||[]).find(t=>lc(t.name)===lc(name)); }
function colorOf(name){
  const e = vocabEntry(name);
  return (e && isHex(e.color)) ? reskin(e.color) : PALETTE[hashIdx(lc(name))];
}
function nextColor(){
  const used = new Set((DOC.vocab.tags||[]).map(t=>reskin(lc(t.color))).filter(Boolean));
  return PALETTE.find(c=>!used.has(c)) || PALETTE[(DOC.vocab.tags||[]).length % PALETTE.length];
}
const chipStyle = v => `style="background:${colorOf(v)};color:${TAGFG};border-color:transparent"`;
// A row's tags are kept alphabetical, always : the order you happened to add
// them in isn't information, and a list that shuffles is one you re-read.
const byName = (a,b) => lc(a).localeCompare(lc(b));
function sortTags(it){ if(it && it.tags) it.tags.sort(byName); }

function findItem(key){
  const i = DOC.items.findIndex(x=>x.key===key);
  return i<0 ? null : { idx:i, it:DOC.items[i] };
}
// Every tag the chips offer : the document's own tag list ( which is what makes
// an invented tag survive a restart ), the modality vocabulary, and anything
// actually in use on a row or on the staging shelf.
//
// IN THAT ORDER, and the order matters : vocab.tags is the order you dragged
// the bar into ( see reorderTags ), so it comes first and everything the
// document hasn't got a place for yet trails after it.
function tagOptions(){
  const out = [], seen = new Set();
  const push = v => { if(v && !seen.has(lc(v))){ seen.add(lc(v)); out.push(v); } };
  (DOC.vocab.tags||[]).forEach(t=>push(t.name));
  VOCAB.forEach(push);
  DOC.items.forEach(it=>(it.tags||[]).forEach(push));
  staged().forEach(it=>(it.tags||[]).forEach(push));
  return out;
}
// Dragging a chip along the bar puts it somewhere else in the bar. The order is
// the DOCUMENT's ( vocab.tags ) , not this browser's : grouping related tags
// side by side is a judgement about the tags, same as their colours, so it
// follows the board everywhere. Anything the bar was showing WITHOUT a place in
// the vocabulary gets one here -- otherwise a modality you dragged would snap
// back the next time the bar redrew.
function reorderTags(what, onto, before){
  if(guard()) return;
  const order = tagOptions();
  const from = order.findIndex(v=>lc(v)===lc(what));
  if(from < 0) return;
  const [v] = order.splice(from, 1);
  let to = onto ? order.findIndex(x=>lc(x)===lc(onto)) : -1;
  if(to < 0) to = order.length; else if(!before) to += 1;
  order.splice(to, 0, v);
  DOC.vocab.tags = order.map(name=>{ const e = vocabEntry(name); return { name, color: e ? e.color : "" }; });
  markDirty(); renderPaintbar();
}
const isVocab = t => VOCAB.some(v=>lc(v)===lc(t));
const tagSig  = it => (it.tags||[]).map(lc).sort().join("|");

// ---- view only ------------------------------------------------------------
// One latch, held on the server ( src/db/boardlock.py ), so a board locked on
// one machine is locked on every machine -- which is the only kind of lock worth
// having on a page anyone with the URL can open. The page's own greying-out is
// the courtesy ; POST /api/sort REFUSING the write is the part that holds, and
// it is what catches a tab that was already open when the lock went on.
function setLocked(on){
  // Anonymous visitors get the same read-only board a lock gives everyone --
  // the server refuses their saves either way ( src/server/auth.py ) -- with
  // the badge saying why.
  SERVER_LOCKED = !!on;
  LOCKED = SERVER_LOCKED || !canEdit();
  $("#lockstate").textContent = SERVER_LOCKED ? "🔒 View only" : "🔒 View only — log in to edit";
  $("#lockstate").title = SERVER_LOCKED
    ? "This board is in view-only mode for everyone — nothing typed here is saved"
    : "Anonymous visitors can look but not change anything — accounts log in with a one-time link from an admin";
  if(LOCKED) document.documentElement.dataset.locked = "1";
  else delete document.documentElement.dataset.locked;
  // The controls that CHANGE the board. Note who ISN'T here : Export, the
  // filter, the search, the theme -- reading is the whole point of the mode --
  // and 📋 Import refs, which is the way back out ( see below ) and can't be
  // disabled because a disabled button fires no clicks at all.
  $$("#orderby,#keeporder,#automove,#autotag,#addcol,#importbtn,#pulltiers,#addwhere,#importlists")
    .forEach(el=>{ el.disabled = LOCKED; });
  $("#refsbtn").title = LOCKED
    ? "This board is in view-only mode — nothing can be imported into it right now"
    : "Paste a reference list, or drop a .docx / .txt — the new ones land on the staging shelf";
}
// Returns true when the caller should stop -- and says why, once, rather than
// letting a click land on nothing.
function guard(){
  if(MISSING){ toast("There is no list here to change", 4000); return true; }
  if(!LOCKED) return false;
  if(!SERVER_LOCKED){ toast("View only — log in to edit this board", 4000); return true; }
  toast("View only — this board is locked for everyone", 4000);
  return true;
}
async function setLock(on){
  try {
    const r = await (await postJSON(API + "/lock", { locked: !!on }, { quiet:true })).json();
    if(!r || !r.ok){ toast("Could not change the lock"); return; }
    REV = r.rev;
    setLocked(r.locked); renderAll();
    toast(r.locked ? "🔒 Locked — view only, for everyone"
                   : "🔓 Unlocked — everyone can edit again", 5000);
  } catch(e){ toast("Could not change the lock ( server not answering? )"); }
}

// ---- undo / redo ----------------------------------------------------------
// A stack of whole documents, in memory only. There are three nets under this
// board and they catch different things : the draft in localStorage below is
// crash recovery and keeps ONE copy ; output/cache/sort-history/ on the server
// keeps the last forty saves ; this is the one that steps BACKWARDS while you
// work. It stays in the heap and dies with the tab -- twenty-five copies of a
// half-megabyte board would blow the localStorage quota many times over.
//
// Steps are COALESCED : markDirty fires on every keystroke, so a burst of
// typing inside 600 ms is one step rather than one per letter.
const HISTMAX = 25;
const cloneDoc = d => JSON.parse(JSON.stringify(d));
let UNDO = [], REDO = [], HBASE = null, histTimer = null, applyingHistory = false;
function paintHistory(){
  const u = $("#undoact"), r = $("#redoact");
  if(!u || !r) return;
  u.disabled = !UNDO.length;
  r.disabled = !REDO.length;
  u.title = UNDO.length ? `Undo — ${UNDO.length} step(s) back ( ⌘Z )` : "Nothing to undo yet";
  r.title = REDO.length ? `Redo — ${REDO.length} step(s) forward ( ⇧⌘Z )` : "Nothing to redo";
}
// HBASE is the board as it stood when the step now open began. Until the timer
// fires nothing is on the stack, so a burst of typing costs one clone, not one
// per keystroke.
function pushHistory(){
  if(applyingHistory || !HBASE) return;
  clearTimeout(histTimer);
  histTimer = setTimeout(flushHistory, 600);
}
// Close the step that is open. The timer calls it ; so do undo and redo, so an
// edit still inside the coalescing window is on the stack before we step off it.
function flushHistory(){
  if(!histTimer) return;
  clearTimeout(histTimer); histTimer = null;
  UNDO.push(HBASE);
  if(UNDO.length > HISTMAX) UNDO.shift();
  REDO.length = 0;
  HBASE = cloneDoc(DOC);
  paintHistory();
}
function applyHistory(doc){
  applyingHistory = true;
  DOC = doc;
  // The same three repairs loadDoc makes -- a step can come from a draft or an
  // import, and those are the fields an older document may be missing.
  if(!DOC.options) DOC.options = { auto_move:false };
  if(!Array.isArray(DOC.staging)) DOC.staging = [];
  DOC.items.forEach(sortTags);
  DOC.staging.forEach(sortTags);
  renderAll();
  markDirty();                  // it saves ; pushHistory sees the flag and skips
  applyingHistory = false;
  paintHistory();
}
function undo(){
  if(guard()) return;
  flushHistory();
  if(!UNDO.length){ toast("Nothing to undo"); return; }
  REDO.push(cloneDoc(DOC));
  if(REDO.length > HISTMAX) REDO.shift();
  const doc = UNDO.pop();
  HBASE = cloneDoc(doc);
  applyHistory(doc);
}
function redo(){
  if(guard()) return;
  flushHistory();
  if(!REDO.length){ toast("Nothing to redo"); return; }
  UNDO.push(cloneDoc(DOC));
  if(UNDO.length > HISTMAX) UNDO.shift();
  const doc = REDO.pop();
  HBASE = cloneDoc(doc);
  applyHistory(doc);
}
// The document underneath was replaced -- a first load, another tab's save, or
// a lock throwing this tab's copy away. Stepping back into what we were holding
// would push a board the server has already moved past over someone else's work.
function resetHistory(){
  clearTimeout(histTimer); histTimer = null;
  UNDO.length = REDO.length = 0;
  HBASE = cloneDoc(DOC);
  paintHistory();
}
$("#undoact").addEventListener("click", undo);
$("#redoact").addEventListener("click", redo);

// ---- load / save ----------------------------------------------------------
function markDirty(){
  // The backstop. Every change to the document comes through here, so a locked
  // board can't be saved even if something slipped past the controls above --
  // and you hear about it instead of watching an edit quietly not stick.
  if(guard()) return;
  pushHistory();
  dirty = true;
  EDITS++;
  $("#savestate").textContent = "unsaved…";
  $("#savestate").classList.add("dirty");
  queueDraft();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}
async function save(){
  clearTimeout(saveTimer);
  if(LOCKED){ dirty = false; return; }
  if(saving){ saveTimer = setTimeout(save, 400); return; }
  saving = true;
  const sent = EDITS;
  try {
    // base_rev : the version this copy started from. When something else wrote
    // in between ( an agent's ops, another tab ) the server merges rather than
    // writing this over it -- see BoardState.replace in src/server/server.py .
    const res = await postJSON(API, { doc: DOC, base_rev: REV }, { quiet:true });
    const r = await res.json();
    // 410 : this list was deleted ( from another tab, or by an agent ) while it
    // was open here. Writing it back would bring it back to life, so don't --
    // keep what's here as the draft and say what can be done with it.
    if(res.status === 410 || (r && r.gone)){
      dirty = false; saving = false;
      writeDraft(); listGone();
      return;
    }
    // 401 : the login expired ( or was revoked ) while this tab had the board
    // open ; 403 + csrf : it was replaced in another tab. Nothing typed here is
    // lost -- the draft is kept and offered back once you're logged in again.
    if(res.status === 401 || (res.status === 403 && r && r.csrf)){
      dirty = false; saving = false;
      writeDraft();
      if(res.status === 401) authExpired();
      setLocked(SERVER_LOCKED); renderAll();
      toast(res.status === 401
        ? "Your login has expired — log in again ; your unsaved changes are kept in this browser and offered back"
        : "Your login changed in another tab — reload the page ; your unsaved changes are kept in this browser", 12000);
      return;
    }
    // 403 : the board was locked while this tab had it open. Retrying would
    // never work, so take the lock instead and put the server's copy back on
    // screen -- what's in this browser is an edit that was never allowed.
    if(res.status === 403 || (r && r.locked)){
      dirty = false; saving = false;
      setLocked(true); clearDraft(); await loadDoc();
      toast("🔒 This board was locked while you had it open — your unsaved changes were dropped", 9000);
      return;
    }
    // 409 : the board moved on further than the server can merge this copy into
    // ( a long-idle tab across a server restart ). Nothing is lost : this copy is
    // kept as the draft, the server's is loaded, and the usual "Unsaved work
    // found" question puts it to you.
    if(res.status === 409 && r && r.conflict){
      dirty = false; saving = false;
      writeDraft(); await loadDoc(); offerDraft();
      return;
    }
    if(r && r.ok && r.merged){
      // Merged with a change made somewhere else. Take the merged board -- unless
      // you typed while the save was out, in which case keep the old base so the
      // next save merges again ( and carries what you just typed ).
      if(EDITS === sent){ dirty = false; clearDraft(); adoptDoc(r.doc, r.rev); }
      $("#savestate").classList.toggle("dirty", dirty);
      $("#savestate").textContent = dirty ? "unsaved…"
        : "saved " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
      toast(`Saved — merged with changes ${r.merged_with ? "by "+r.merged_with : "made elsewhere"}`, 5000);
    } else if(r && r.ok){
      REV = r.rev;
      if(EDITS === sent){ dirty = false; clearDraft(); }
      $("#savestate").classList.toggle("dirty", dirty);
      $("#savestate").textContent = dirty ? "unsaved…"
        : "saved " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
      // The server caps the shelf ( tiers.MAX_STAGED ). If it ever keeps fewer
      // rows than we sent, you hear about it rather than finding out on the next
      // reload.
      const kept = r.doc && r.doc.staging ? r.doc.staging.length : staged().length;
      if(kept < staged().length)
        toast(`The server kept ${kept} of ${staged().length} staged rows — the shelf is full`, 9000);
    } else { $("#savestate").textContent = "save failed — retrying"; retrySave(); }
    if(r && r.ok) notePassedOver(r.mirrored);
  } catch(e){ $("#savestate").textContent = "save failed ( offline? ) — retrying"; retrySave(); }
  saving = false;
}
// A paper's tags and cells are the same on every list that holds it : the
// server makes each edit saved here on all the others too ( src/db/sortsync.py ),
// and says where in `mirrored`. The one worth a word is a list it passed over --
// a view-only one keeps its own copy -- and only once a visit, or every save
// while you type a note would say it again.
const PASSED = new Set();
function notePassedOver(mirrored){
  const fresh = (mirrored || []).filter(m=>m.skipped === "locked" && !PASSED.has(m.list));
  if(!fresh.length) return;
  fresh.forEach(m=>PASSED.add(m.list));
  toast(`Not copied to ${fresh.map(m=>`“${m.name}”`).join(", ")} — view-only, so it keeps its own tags and notes`, 8000);
}
// The board as the server has it now replaces this tab's copy -- a merged save
// coming back. Same repairs as loadDoc, and the same fresh undo history : the
// steps on it are boards without the change that was just merged in.
function adoptDoc(doc, rev){
  DOC = doc; REV = rev;
  if(!DOC.options) DOC.options = { auto_move:false };
  if(!Array.isArray(DOC.staging)) DOC.staging = [];
  DOC.items.forEach(sortTags);
  DOC.staging.forEach(sortTags);
  resetHistory();
  renderAll();
  fetchMeta(DOC.items.concat(DOC.staging).map(it=>it.key));
}
// A save that didn't land is not a save you have to remember to redo : the draft
// below is already in this browser and we keep trying, so a server that comes
// back -- or a laptop that wakes up -- picks the work up by itself.
function retrySave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 5000); }
// False when there is no such list ( a /sort/<name> nobody made, or one since
// deleted ) -- the page says so instead of drawing an empty board to type into.
async function loadDoc(){
  const res = await fetch(API);
  if(res.status === 404){ listMissing(); return false; }
  const d = await res.json();
  DOC = d.doc; REV = d.rev; VOCAB = d.modalities || [];
  setLocked(d.locked);
  if(!DOC.options) DOC.options = { auto_move:false };
  if(!Array.isArray(DOC.staging)) DOC.staging = [];
  DOC.items.forEach(sortTags);      // the server stores them sorted ; older files may not be
  DOC.staging.forEach(sortTags);
  dirty = false;
  $("#savestate").classList.remove("dirty");
  $("#savestate").textContent = DOC.updated_at ? ("saved " + DOC.updated_at.replace("T"," ").slice(0,16)) : "empty board";
  STAGEHOW = Object.assign(readHow(), STAGEHOW);
  resetHistory();      // whatever just landed is the new zero to step back to
  renderAll();
  pruneHow();
  fetchMeta(DOC.items.concat(DOC.staging).map(it=>it.key));
  return true;
}

// ---- the draft in this browser --------------------------------------------
// The document is written to localStorage on every change and thrown away the
// moment the server confirms a save. It covers the one loss the server's own
// history cannot : work that never REACHED the server -- a reload two keystrokes
// after an import, a server killed mid-session, a laptop that slept and woke up
// somewhere else. On the next load an unsaved draft is offered back ( see
// offerDraft ), so an imported bibliography is always resumable.
const DRAFT_KEY = listKey("prma-sort-draft");
const HOW_KEY   = listKey("prma-sort-how");
let draftTimer = null;
function writeDraft(){
  clearTimeout(draftTimer); draftTimer = null;
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ rev:REV, at:Date.now(), doc:DOC })); } catch(e){}
  writeHow();
}
function queueDraft(){ if(!draftTimer) draftTimer = setTimeout(writeDraft, 250); }
function clearDraft(){
  clearTimeout(draftTimer); draftTimer = null;
  try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
}
function readDraft(){ try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch(e){ return null; } }
// How each staged row was matched ( STAGEHOW ) is a fact about the import rather
// than about the document, so it is NOT saved with the board -- but it is worth
// keeping for as long as the rows are on the shelf, which means keeping it here.
function writeHow(){ try { localStorage.setItem(HOW_KEY, JSON.stringify(STAGEHOW)); } catch(e){} }
function readHow(){ try { return JSON.parse(localStorage.getItem(HOW_KEY) || "{}") || {}; } catch(e){ return {}; } }
function pruneHow(){
  const live = new Set(staged().map(it=>it.key));
  let cut = false;
  Object.keys(STAGEHOW).forEach(k=>{ if(!live.has(k)){ delete STAGEHOW[k]; cut = true; } });
  if(cut) writeHow();
}
// What a draft and the stored document have to agree on for the draft to be
// nothing new. Deliberately NOT a JSON compare : the server normalizes on the
// way in ( sorts tags, coerces years, fills the vocabulary in from what's in
// use ), so a byte compare would call every draft different and ask about it
// forever. This is the part you would actually mourn -- the list, the shelf,
// and what is typed on them.
function docSig(d){
  const rows = list => (list||[]).map(it=>[
    it.key , it.title||"" , String(it.year||"") ,
    (it.tags||[]).map(lc).sort().join("\u0001") ,
    Object.keys(it.fields||{}).sort().filter(k=>it.fields[k])
      .map(k=>k+"="+it.fields[k]).join("\u0001") ,
  ].join("\u0002")).join("\u0003");
  return rows(d.items)+"\u0004"+rows(d.staging)+"\u0004"+
    (d.columns||[]).map(c=>c.id+":"+c.label).join(",");
}
// Called once, after the first load. A draft that matches what came back was
// saved after all ( the beacon below landed ) and is dropped without a word.
// True when it put the question up ( see boot ).
function offerDraft(){
  // Not to an anonymous visitor : they couldn't save it , and it stays in this
  // browser until someone logged in opens the board here.
  if(!canEdit()) return false;
  const d = readDraft();
  if(!d || !d.doc || !d.doc.items){ return false; }
  if(docSig(d.doc) === docSig(DOC)){ clearDraft(); return false; }
  const when = new Date(d.at || Date.now()).toLocaleString();
  sheet(`
    <h3>Unsaved work found in this browser</h3>
    <p>A copy of this board from <b>${esc(when)}</b> never reached the server — the page went away,
       or the server did, before it could be written. It holds
       <b>${(d.doc.items||[]).length}</b> paper(s) on the list and
       <b>${(d.doc.staging||[]).length}</b> on the staging shelf ; what is on the server right now
       holds ${DOC.items.length} and ${staged().length}.</p>
    <p><b>Restore</b> puts that copy back on screen and saves it. <b>Discard</b> throws it away and
       keeps the server's. Either way the server's own history is still in
       <code>output/cache/sort-history/</code>.</p>
    <div class="btns">
      <button data-act="discard">Discard it</button>
      <button class="primary" data-act="restore">Restore it</button>
    </div>`, act=>{
    // Placeholders are filled in only once this is answered : filling them is
    // an edit, and an edit rewrites the draft this is asking about.
    if(act !== "restore"){ if(act === "discard"){ clearDraft(); backfillPending(); } return; }
    DOC = d.doc;
    if(!DOC.options) DOC.options = { auto_move:false };
    if(!Array.isArray(DOC.staging)) DOC.staging = [];
    DOC.items.forEach(sortTags);
    DOC.staging.forEach(sortTags);
    renderAll(); markDirty();
    fetchMeta(DOC.items.concat(DOC.staging).map(it=>it.key));
    toast("Restored — saving it to the server now", 5000);
    backfillPending();
  });
  return true;
}
// Leaving with work in flight : write the draft synchronously, then push the
// document out with a beacon, which survives the page going away in a way
// fetch() does not. The browser's own "are you sure" is the fallback for when
// the beacon can't even be queued.
window.addEventListener("beforeunload", e=>{
  if(!dirty || LOCKED) return;
  writeDraft();
  let sent = false;
  try {
    // keepalive has the beacon's 64 KB budget ; past it , the "are you sure"
    // below is what's left.
    const body = JSON.stringify({ doc: DOC, base_rev: REV });
    if(new Blob([ body ]).size < 64000){
      postJSON(API, body, { keepalive:true, quiet:true }).catch(()=>{});
      sent = true;
    }
  } catch(err){}
  if(!sent){ e.preventDefault(); e.returnValue = ""; }
});
// Switching tabs / minimizing is the last moment anything is guaranteed to run
// on a phone or a sleeping laptop, so flush there too.
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && dirty) save(); });
// The index build stamp last seen -- undefined until the first poll, which only
// records it ( loadDoc has just backfilled ).
let INDEX;
async function pollRev(){
  try {
    const res = await fetch(API + "/version");
    // The list went away while it was open here ( deleted elsewhere ).
    if(res.status === 404 && LIST){ if(dirty) writeDraft(); listGone(); return; }
    const d = await res.json();
    // ... or was renamed : its old address still answers ( an alias ), but the
    // page belongs at the new one. Not while there's something unsaved here --
    // the save still lands through the old name, and the next poll moves us.
    if(d && LIST && d.slug && d.slug !== LIST && !dirty && !saving){
      location.replace(`/sort/${encodeURIComponent(d.slug)}${location.search}${location.hash}`);
      return;
    }
    // The lock first, and regardless of the rev / dirty checks below : a board
    // that just went view-only has to stop taking edits in THIS tab now, not
    // whenever it next happens to be safe to reload.
    if(d && typeof d.locked === "boolean" && d.locked !== SERVER_LOCKED && !canEdit()){
      setLocked(d.locked);            // only the badge changes for an anonymous visitor
    } else if(d && typeof d.locked === "boolean" && d.locked !== SERVER_LOCKED){
      setLocked(d.locked); renderAll();
      toast(d.locked ? "🔒 This board was just locked — view only"
                     : "🔓 This board was just unlocked — you can edit again", 6000);
      if(!d.locked) backfillPending();     // what it couldn't fill while locked
    }
    if(d && d.rev !== REV && !dirty && !saving){
      await loadDoc();
      toast(d.by ? `Reloaded — ${d.by} changed the board` : "Reloaded — the board changed in another tab");
    }
    // The index moved : the --watch worker ( or a ` prma reindex ` ) has just
    // processed papers, so the placeholders fill in, and an open Recently added
    // list drops the "not indexed yet" it no longer needs.
    if(d && "index" in d && d.index !== INDEX){
      const seen = INDEX !== undefined;
      INDEX = d.index;
      if(seen){
        backfillPending();
        if(recentOpen()) fetchMeta(hits.map(h=>h.key), true).then(()=>{ if(recentOpen()) renderResults(); });
      }
    }
    if(backfillOwed) backfillPending();
    if(adoptOwed) adoptLibraryKeys();
    if(recentOpen()) refreshRecent();
  } catch(e){}
  setTimeout(pollRev, 6000);
}
// `fresh` : these papers are being added, or are search hits that might be. Ask
// for everything a new row is filled in from -- the modality stamp, and the code
// / data links ( see prefill ) -- and ask again even for a key already here,
// since those are the parts a scan changes.
//
// A row whose key only NAMES a library paper -- an imported sheet's lowercased
// DOI, its zotero:ABCD1234, a title-only row -- is answered as that paper, with
// m.key the library's own key ( see adoptLibraryKeys ). The titles go along for
// the keys that have no DOI in them : a title is all the server can match those by.
async function fetchMeta(keys, fresh){
  keys = Array.from(new Set(keys.filter(k=>k && (fresh || !META[k]))));
  const got = {};
  const rows = new Map(DOC.items.concat(staged()).map(it=>[ it.key, it ]));
  for(let i=0; i<keys.length; i+=60){
    const part = keys.slice(i,i+60), titles = {};
    part.forEach(k=>{ const it = rows.get(k); if(it && it.title && !/^10\./.test(k)) titles[k] = it.title; });
    try {
      const r = await (await fetch("/api/paper-meta", { method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ keys: part, mods: !!fresh, links: !!fresh, titles }) })).json();
      Object.assign(META, r.meta || {});
      Object.assign(got,  r.meta || {});
    } catch(e){}
  }
  if(keys.length) repaintLinks();
  adoptLibraryKeys();
  return got;
}

// ---- folded columns -------------------------------------------------------
// The columns a Google Sheet import brings in ( Methods summary, Datasets, Code
// -- DOC.options.fold_cols ) hold paragraphs, not notes : drawn all the time
// they'd push the board past the edge of the window. So they fold away behind
// one header button, and whether they're out is a property of THIS browser --
// a habit, like the search mode -- not of the board. Folded or not they are
// still in the document, the export and the text filter.
const FOLD_KEY = "prma-sort-fold";
let SHOWFOLD = false;
try { SHOWFOLD = localStorage.getItem(FOLD_KEY) === "1"; } catch(e){}
const isFold    = id => (DOC.options.fold_cols||[]).includes(id);
const shownCols = () => DOC.columns.filter(c=>SHOWFOLD || !isFold(c.id));
function labelFold(){
  const f = DOC.columns.filter(c=>isFold(c.id)), b = $("#foldbtn");
  b.style.display = f.length ? "" : "none";
  b.textContent = SHOWFOLD ? "◂ Hide Extra Columns" : "▸ Show Extra Columns";
  // How MANY there are, and which, moves into the tooltip : the button sits in
  // the row with the rest of them now, where a label that changes width every
  // time a column is added or folded would shuffle its neighbours along.
  b.title = `${SHOWFOLD?"Fold away":"Show"} ${f.length} column${f.length===1?"":"s"}`+
    ` — ${f.map(c=>c.label).join(" · ")}`+
    (SHOWFOLD ? "" : " ( the board scrolls sideways while they're out )");
  b.classList.toggle("on", SHOWFOLD && f.length > 0);
  if(SHOWFOLD && f.length) document.documentElement.dataset.fold = "1";
  else delete document.documentElement.dataset.fold;
}
$("#foldbtn").addEventListener("click", ()=>{
  SHOWFOLD = !SHOWFOLD;
  try { localStorage.setItem(FOLD_KEY, SHOWFOLD ? "1" : "0"); } catch(e){}
  renderAll();
});
// The column head and the board scroll sideways together.
function syncX(from, to){ if(to.scrollLeft !== from.scrollLeft) to.scrollLeft = from.scrollLeft; }
$("#boardwrap").addEventListener("scroll", ()=>syncX($("#boardwrap"), $("#colwrap")), { passive:true });
$("#colwrap").addEventListener("scroll",   ()=>syncX($("#colwrap"), $("#boardwrap")), { passive:true });

// ---- rendering ------------------------------------------------------------
// A grid as [ minimum px, fr ] tracks ( no fr = fixed ) -> its template, and the
// width it can't go below -- which is how wide the board is made to stay.
function tracks(list, gap){
  return { css: list.map(([m,fr])=>fr ? `minmax(${m}px,${fr})` : `${m}px`).join(" "),
           min: list.reduce((s,[m])=>s+m, 0) + (gap||0)*(list.length-1) };
}
// A free-text column's track. A folded one is a paragraph and gets the room for
// one ; the rest size off how many ordinary columns there are, so bringing the
// folded ones out never squeezes the columns that were already there.
function colTrack(c, base){ return isFold(c.id) ? [ 260, "1.4fr" ] : [ base > 3 ? 112 : 150, "1.1fr" ]; }
const baseCols = () => DOC.columns.filter(c=>!isFold(c.id)).length;
function gridTemplate(){
  const n = baseCols();
  // View-only drops the tools column outright rather than emptying it : an
  // empty 54px gutter with a border down it reads as a column somebody forgot
  // to fill in. The head, the rows and the shelf all key off this, so they stay
  // lined up ( see renderColHead / rowHtml ).
  return tracks([ [52], [n>3?200:250, "2.2fr"], [170, "1.1fr"] ]
    .concat(shownCols().map(c=>colTrack(c, n)))
    .concat(LOCKED ? [] : [[54]]));
}
function renderColHead(){
  const g = gridTemplate();
  document.documentElement.style.setProperty("--grid", g.css);
  document.documentElement.style.setProperty("--gridmin", g.min + "px");
  $("#colhead").innerHTML = `<div style="text-align:right">#</div><div>Paper</div><div>Tags</div>`+
    shownCols().map(c=>`<div class="colname" data-col="${esc(c.id)}" title="Double-click to rename · shift-click to delete">${esc(c.label)}</div>`).join("")+
    (LOCKED?"":`<div></div>`);
}
const libKey = it => { const m = META[it.key]; return (m && m.in_library && m.key) || it.key; };
function rowLinks(it){
  const m = META[it.key] || {};
  const doi = it.doi || m.doi || "", wid = it.wid || m.wid || "";
  // DOI + Proxy are the same two anchors every prma surface offers
  // ( /static/common.js ) ; the rest is what a board row can additionally reach.
  const out = doiLinks(doi);
  // The library's own key, which a row spelled some other way hasn't adopted
  // yet -- or can't, on a view-only board ( see adoptLibraryKeys ).
  const lk = libKey(it);
  if(m.pdf)       out.push(`<a href="/pdf?key=${encodeURIComponent(lk)}" target="_blank">PDF</a>`);
  else if(it.pdf) out.push(`<a href="${esc(it.pdf)}" target="_blank" rel="noopener">PDF</a>`);
  if(wid)       out.push(`<a href="https://openalex.org/${esc(wid)}" target="_blank" rel="noopener">OA</a>`);
  if(m.montage) out.push(`<a href="${esc(m.montage)}" target="_blank" title="Figure montage">Figures</a>`);
  if(m.has_md)  out.push(`<a href="${mdHref(lk)}" class="mdlink" target="_blank" rel="noopener" title="The rendered Markdown, with figures">MD</a>`);
  if(m.methods) out.push(`<a href="${esc(m.methods)}" target="_blank" title="The extracted Methods section">Methods</a>`);
  return out.join(" ");
}
// While the board is view-only every text box stays on screen -- you still want
// to read a note and copy a title -- but stops taking input.
const RO = () => LOCKED ? " readonly" : "";
function tagsCell(it){
  return `<div class="cellchips">`+
    (it.tags||[]).map(v=>`<span class="chip" ${chipStyle(v)} data-val="${esc(v)}">${esc(v)}`+
      `<span class="x" data-drop="${esc(v)}" title="Remove">×</span></span>`).join("")+
    `<input class="chipin" placeholder="+" autocomplete="off"></div>`;
}
// ---- the order you are LOOKING at -----------------------------------------
// DOC.items is ALWAYS the order you put the papers in : dragging a row and
// typing into a number box are the only things that ever change it. "Order by"
// is a lens over a COPY, so a sort can never cost you an ordering -- the number
// on every row stays your own position however the list is stacked, and the
// number boxes still move papers in YOUR order from inside a sorted view.
// ⇩ Keep this order is the one control here that touches the document.
let VIEW = "";
const BY = {
  year:     (a,b)=>(b.year||0)-(a.year||0),
  year_asc: (a,b)=>(a.year||9999)-(b.year||9999),
  cites:    (a,b)=>((META[b.key]||{}).cited_by||0)-((META[a.key]||{}).cited_by||0),
  title:    (a,b)=>lc(a.title||a.key).localeCompare(lc(b.title||b.key)),
  added:    (a,b)=>String(a.added_at||"").localeCompare(String(b.added_at||"")),
};
function viewItems(){
  if(!VIEW || !DOC.items.length) return DOC.items;
  if(VIEW === "tags"){
    // Group papers carrying the same tags together, keeping each group in the
    // order you already put it in, and groups in the order they first appear.
    const order = [], groups = new Map();
    DOC.items.forEach(it=>{
      const sig = tagSig(it) || "~";     // untagged sorts last
      if(!groups.has(sig)){ groups.set(sig, []); order.push(sig); }
      groups.get(sig).push(it);
    });
    order.sort((a,b)=> (a==="~") - (b==="~") );
    return order.flatMap(sig=>groups.get(sig));
  }
  return BY[VIEW] ? DOC.items.slice().sort(BY[VIEW]) : DOC.items;
}
// key -> the number drawn on its row : its place in YOUR order, never in the
// view. One map per redraw rather than a findItem() per row.
const manualNo = () => new Map(DOC.items.map((it,i)=>[it.key, i+1]));
// The select keeps showing the lens you are in ( it is not a one-shot any more ),
// ⇩ Keep this order appears only while there is something to keep, and the
// grips go away for as long as a drop would have nowhere honest to land.
function labelView(){
  $("#keeporder").style.display = VIEW ? "" : "none";
  if(VIEW) document.documentElement.dataset.view = VIEW;
  else delete document.documentElement.dataset.view;
}

function rowHtml(it, n){
  const m = META[it.key] || {};
  const title = it.title || m.title || it.key;
  const year  = it.year || m.year || "";
  const inner = esc(title);          // plain text -- open it from the link strip
  const loose = (m.in_library === false) ? " " + looseBadge(it) : "";
  return `<div class="row${SEL.has(it.key)?" selected":""}" data-key="${esc(it.key)}">`+
    `<div class="c numc">`+
      `<input class="numin" value="${n}" title="Where this paper sits in YOUR order — type a number and press ↵ to send it there, from any view" `+
        `inputmode="numeric" autocomplete="off"${RO()}>`+
      `<span class="anchormark" title="The anchor — ⤓ To anchor brings you back here">⚓</span>`+
      `<span class="grip" title="Drag to move it up or down">⠿</span></div>`+
    `<div class="c titlec">`+
      `<div class="tt">${inner}${loose}</div>`+
      `<div class="meta">${year?esc(year):""}${it.journal?" · "+esc(it.journal):""}<span class="mkey"> · ${esc(it.key)}</span></div>`+
      `<div class="links" data-links="1">${rowLinks(it)}</div>`+
    `</div>`+
    `<div class="c" data-cell="tags">${tagsCell(it)}</div>`+
    shownCols().map(c=>`<div class="c notecell">${cellHtml(it, c)}</div>`).join("")+
    (LOCKED?"":`<div class="c rowtools">`+
      `<button class="delbtn" data-act="remove" title="Delete this paper from the board ( undoable )">🗑</button>`+
    `</div>`)+
  `</div>`;
}
// A full redraw keeps whatever you were typing in : the caret is restored to the
// same field afterwards, so a re-render never eats a word of a note.
function renderBoard(){
  const a = document.activeElement;
  let focus = null;
  if(a && a.closest && a.closest(".row")){
    focus = { key: a.closest(".row").dataset.key,
              field: a.dataset ? a.dataset.field : null,
              chip: a.classList.contains("chipin"),
              num:  a.classList.contains("numin"),
              start: a.selectionStart, end: a.selectionEnd, val: a.value };
  }
  const no = manualNo();
  $("#board").innerHTML = DOC.items.length
    ? viewItems().map(it=>rowHtml(it, no.get(it.key))).join("")
    : `<div class="empty">Nothing here yet — search above and press ↵ ( or double-click a hit ) to add papers.</div>`;
  applyFilter();
  if(focus){
    const row = rowEl(focus.key);
    if(row){
      const el = focus.chip ? row.querySelector(".chipin")
               : focus.num  ? row.querySelector(".numin")
                            : row.querySelector(`[data-field="${focus.field}"]`);
      if(el){
        if(focus.chip && focus.val != null) el.value = focus.val;
        el.focus();
        try { el.setSelectionRange(focus.start, focus.end); } catch(e){}
      }
    }
  }
}
function renderCounts(){
  const n = DOC.items.length;
  const tagged = DOC.items.filter(it=>(it.tags||[]).length).length;
  const st = staged().length;
  $("#counts").innerHTML = `<span><b>${n}</b> papers</span><span><b>${tagged}</b> tagged</span>`+
    (st ? `<span><b>${st}</b> staged</span>` : "")+
    `<span>${tagOptions().length} tags</span>`;
}
// The tag bar has three jobs, in this order of precedence :
//   FILTERING ( 🔎 on )  -- a click puts the tag in / out of the filter, and the
//                           board shows only the papers carrying it.
//   rows SELECTED        -- the chips are checkboxes for those rows : solid
//                           outline = every one has it, dashed = some do, and a
//                           click flips it on all of them.
//   otherwise            -- a click arms the tag for painting ( click rows ).
// The bar's own controls -- + new tag, the label, 🔎 Filter, any, find, 🎨 Colors --
// live at the END of the chip flow, and are REAL elements with their listeners
// already on them. So they are captured once here and moved back to the end
// after each redraw ; rewriting them as markup every time would throw those
// listeners away, and would empty the + new tag box mid-word.
const PBCTL = $("#pbctl");
function renderPaintbar(){
  const sel = filtering ? [] : selectedItems();
  $("#tagchips").innerHTML = tagOptions().map(v=>{
    const n   = DOC.items.filter(it=>hasTag(it,v)).length;
    const inF = filtering && TAGF.has(v);
    const on  = sel.length && sel.every(it=>hasTag(it,v));
    const som = !on && sel.some(it=>hasTag(it,v));
    const how = filtering  ? (filterMode === "none"
                ? `${inF?"hiding":"not hiding"} the papers tagged it — click to ${inF?"show them again":"hide them"} ( ${n} paper(s) )`
                : `${inF?"in":"not in"} the filter — click to ${inF?"drop":"add"} it ( ${n} paper(s) )`)
              : sel.length ? `${on?"on":som?"on some of":"off"} the ${sel.length} selected row(s) — click to flip it`
                           : `${n} paper(s) — click to paint it onto rows`;
    return `<span class="chip ${(inF||armed===v||on)?'on':som?'half':''}" ${chipStyle(v)} draggable="true" `+
      `data-val="${esc(v)}" title="${esc(how)} — drag it to move it along the bar">${esc(v)}<span class="n">${n||""}</span>`+
      `<span class="x" data-deltag="${esc(v)}" title="Delete this tag everywhere">×</span></span>`;
  }).join("");
  $("#tagchips").appendChild(PBCTL);
  renderAnchor();   // every selection change comes through here
  renderCopyTo();   // ... and so does ⇢ Copy to list, which only a selection has
  document.body.classList.toggle("painting", !!armed && !filtering);
}
const hasTag = (it,v) => (it.tags||[]).some(t=>lc(t)===lc(v));
function selectedItems(){
  return Array.from(SEL).map(k=>findItem(k)).filter(Boolean).map(f=>f.it);
}
// Click a row to select it ( ⌘ / ctrl adds one, shift takes the range ). A plain
// click on the only selected row deselects it again.
function selectRow(key, e){
  if(e && (e.metaKey || e.ctrlKey)){
    SEL.has(key) ? SEL.delete(key) : SEL.add(key);
    selAnchor = key;
  } else if(e && e.shiftKey && selAnchor){
    const keys = viewItems().map(it=>it.key);   // the range you can SEE
    let a = keys.indexOf(selAnchor), b = keys.indexOf(key);
    if(a>=0 && b>=0){
      if(a>b){ const t=a; a=b; b=t; }
      for(let i=a;i<=b;i++) SEL.add(keys[i]);
    }
  } else {
    const only = SEL.size===1 && SEL.has(key);
    SEL = new Set(only ? [] : [key]);
    selAnchor = only ? null : key;
  }
  paintSelection(); renderPaintbar();
}
function paintSelection(){
  $$(".row").forEach(r=>r.classList.toggle("selected", SEL.has(r.dataset.key)));
}
function clearSelection(){
  if(!SEL.size) return;
  SEL.clear(); selAnchor = null;
  paintSelection(); renderPaintbar();
}
// One tag across every selected row : off everywhere if they ALL have it,
// otherwise on everywhere ( so a half-tagged selection fills in rather than
// flipping each row's state independently ).
function toggleTagOnSelection(value){
  if(guard()) return;
  const items = selectedItems();
  if(!items.length) return;
  const all = items.every(it=>hasTag(it,value));
  items.forEach(it=>{
    it.tags = it.tags || [];
    if(all)                 it.tags = it.tags.filter(t=>lc(t)!==lc(value));
    else if(!hasTag(it,value)) it.tags.push(value);
    sortTags(it);
  });
  rememberTag(value);
  markDirty();
  if(DOC.options.auto_move){ items.forEach(it=>autoMove(it.key)); renderBoard(); }
  else { items.forEach(it=>refreshTags(it.key)); applyFilter(); }
  renderPaintbar(); renderCounts();
  toast(`${all?"Removed":"Added"} “${value}” ${all?"from":"on"} ${items.length} row(s)`);
}
function renderAll(){ labelFold(); renderColHead(); renderBoard(); renderStage(); renderCounts(); renderPaintbar(); }
// Why a row has no links past the DOI : a paper that isn't in the library, or --
// for one added from Recently added before prma had got to it -- one that is,
// but hasn't been processed yet ( see backfillPending ).
function looseBadge(it){
  return it.pending
    ? `<span class="loose" title="In your library, but prma hasn't processed it yet — its tags, Code and Datasets fill themselves in once it has">⏳ processing</span>`
    : `<span class="loose" title="Not matched to a paper in your library — links other than the DOI are unavailable">not in library</span>`;
}
function repaintLinks(){
  $$(".row").forEach(row=>{
    const f = findItem(row.dataset.key);
    if(!f) return;
    const el = row.querySelector('[data-links]');
    if(el) el.innerHTML = rowLinks(f.it);
    const m = META[f.it.key];
    // Redrawn rather than only ever added : a paper the index has caught up
    // with loses its badge, and a placeholder's reads "processing". The space
    // before the badge shares a text node with the title, so only that one
    // character goes with it.
    const old = row.querySelector(".tt .loose");
    if(m && m.in_library === false){
      if(old) old.outerHTML = looseBadge(f.it);
      else row.querySelector(".tt").insertAdjacentHTML("beforeend", " " + looseBadge(f.it));
    } else if(old && m){
      const prev = old.previousSibling;
      if(prev && prev.nodeType === 3) prev.textContent = prev.textContent.replace(/ $/, "");
      old.remove();
    }
  });
  // The shelf's rows hang off the same meta ( "in library", and which links
  // exist ), and it lands after they're first drawn. Only those two strips are
  // touched -- a title you're editing up there is left alone.
  $$(".srow").forEach(row=>{
    const it = findStage(row.dataset.key);
    if(!it) return;
    const links = row.querySelector("[data-links]");
    if(links) links.innerHTML = rowLinks(it);
    const badge = row.querySelector("[data-sbadge]");
    if(badge) badge.innerHTML = sbadgeHtml(it);
  });
}
function cssEsc(s){ return String(s).replace(/["\\]/g, "\\$&"); }
function rowEl(key){ return document.querySelector(`.row[data-key="${cssEsc(key)}"]`); }
// Only the one row's tag cell -- so tagging never disturbs anything else on the
// page ( and never moves the row, unless Auto-move is on ).
function refreshTags(key){
  const f = findItem(key), row = rowEl(key);
  if(!f || !row) return;
  const cell = row.querySelector('[data-cell="tags"]');
  if(cell) cell.innerHTML = tagsCell(f.it);
}
function toast(msg, ms, undoLabel, onUndo){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>`+(onUndo?`<button id="undobtn">${esc(undoLabel||"Undo")}</button>`:"");
  t.classList.add("show");
  if(onUndo) $("#undobtn").onclick = ()=>{ t.classList.remove("show"); onUndo(); };
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms||3200);
}

// ---- the staging shelf ----------------------------------------------------
// Where an imported reference list lands ( 📋 Import refs ) : the same rows as
// the board, OFF the list, so a bibliography can be read, corrected and TAGGED
// before any of it is given a position. Nothing here is in the sort -- the
// numbers below don't know it exists -- until you press Add.
//
// It lives in the DOCUMENT ( DOC.staging , see src/db/sortboard.py ) rather
// than in this browser : a pasted bibliography is a session of work, and a
// reload losing it would be the same kind of loss the board is written whole to
// avoid.
const staged = () => (DOC.staging = DOC.staging || []);
function findStage(key){ return staged().find(x=>x.key===key) || null; }
const picked = () => staged().filter(it=>!SOFF.has(it.key));
// Matches utils.normalize_title -- the same folding the server matched with.
const ntitle = s => String(s||"").normalize("NFKD").toLowerCase()
  .replace(/[^a-z0-9]+/g," ").trim();

const WHERE_LABEL = { bottom:"the bottom", top:"the top", placed:"after the last sorted row" };
const whereLabel = () => WHERE_LABEL[DOC.options.add_where || "bottom"] || "the bottom";

function stageHeadHtml(){
  const n = picked().length, all = n === staged().length;
  return `<div class="stagehead">`+
    `<b>Staging</b>`+
    `<span class="hint">${staged().length} imported reference(s) — not on the list yet</span>`+
    `<div class="grow"></div>`+
    `<input class="chipin stagetagin" id="stagetag" placeholder="+ tag checked" autocomplete="off" `+
      `title="Type a tag and press ↵ to put it on every checked row">`+
    `<button id="stageall" title="Check or uncheck every row">${all?"none":"all"}</button>`+
    `<button id="stagedrop" ${n?"":"disabled"} title="Throw the checked rows away ( undoable )">🗑</button>`+
    `<button class="primary" id="stageadd" ${n?"":"disabled"} `+
      `title="Move them onto the list — where the “add to…” dropdown says">＋ Add ${n} to ${whereLabel()}</button>`+
  `</div>`;
}
// Only the header, for a checkbox tick : re-rendering the whole shelf on every
// tick would throw away a note you were half-way through typing.
function refreshStageHead(){
  const head = $("#stage .stagehead");
  if(head) head.outerHTML = stageHeadHtml();
}
// year · journal · whether the library turned out to have it. The last part
// only becomes true once /api/paper-meta lands, so repaintLinks redraws it.
function sbadgeHtml(it){
  const m = META[it.key] || {};
  const bits = [ it.year || "", it.journal || "" ].filter(Boolean).map(esc).join(" · ");
  const badge = m.in_library
    ? `<span class="badge have" title="Matched a paper already in your library — it arrives with all its links">in library</span>`
    : `<span class="badge" title="Nothing in your library matched this one">new</span>`;
  const fuzzy = STAGEHOW[it.key] === "fuzzy"
    ? `<span class="badge fuzzy" title="Matched on the title alone, with no DOI to confirm it — worth a look before you add it">fuzzy</span>` : "";
  return `${bits}${bits?" · ":""}${badge}${fuzzy}`;
}
// The shelf's own grid, built the same way the board's is ( gridTemplate ) so
// the two line up column for column.
function stageGridTemplate(){
  const n = baseCols();
  // Same two tracks go when the board is view-only -- the checkbox and the
  // per-row buttons -- so the shelf keeps lining up with the list above it.
  return tracks((LOCKED ? [] : [[24]]).concat([ [n>3?200:240, "2.3fr"], [160, "1fr"] ])
    .concat(shownCols().map(c=>colTrack(c, n)))
    .concat(LOCKED ? [] : [[118]]), 9);
}
function srowHtml(it){
  return `<div class="srow" data-key="${esc(it.key)}">`+
    (LOCKED?"":`<input type="checkbox" class="pick" ${SOFF.has(it.key)?"":"checked"} title="Include this one when you add">`)+
    `<div>`+
      `<input class="stitle" value="${esc(it.title)}" title="A parsed title isn't always the right one — fix it here"${RO()}>`+
      (it.authors ? `<div class="sauth">${esc(it.authors)}</div>` : "")+
      `<div class="sauth" data-sbadge="1">${sbadgeHtml(it)}</div>`+
      `<div class="links" data-links="1">${rowLinks(it)}</div>`+
    `</div>`+
    `<div data-cell="tags">${tagsCell(it)}</div>`+
    // The notes columns, exactly as the board draws them : reading a reference
    // is when you have something to say about it, and a note typed here rides
    // onto the list with the row ( it is the same row -- same `fields` ).
    shownCols().map(c=>`<div class="notecell">${cellHtml(it, c)}</div>`).join("")+
    (LOCKED?"":`<div class="stools">`+
      `<button data-act="sadd" title="Add just this one">＋ Add</button>`+
      `<button class="delbtn" data-act="sdrop" title="Throw this one away ( undoable )">🗑</button>`+
    `</div>`)+
  `</div>`;
}
// A full redraw of the shelf puts the caret back where it was afterwards -- the
// same courtesy renderBoard pays the list, and it matters here for the same
// reason : a title you are half-way through fixing, or a note you are half-way
// through typing, must survive the shelf redrawing under you.
function renderStage(){
  const box = $("#stage");
  const a = document.activeElement;
  let focus = null;
  if(a && a.closest && a.closest(".srow"))
    focus = { key: a.closest(".srow").dataset.key,
              field: a.dataset ? a.dataset.field : null,
              title: a.classList.contains("stitle"),
              start: a.selectionStart, end: a.selectionEnd };
  const sg = stageGridTemplate();
  document.documentElement.style.setProperty("--sgrid", sg.css);
  document.documentElement.style.setProperty("--sgridmin", (sg.min + 22) + "px");   // + the row's own padding
  box.classList.toggle("show", staged().length > 0);
  box.innerHTML = staged().length
    ? stageHeadHtml() + `<div class="srows">` + staged().map(srowHtml).join("") + `</div>`
    : "";
  if(focus && (focus.title || focus.field)){
    const row = srowEl(focus.key);
    const el  = row && (focus.title ? row.querySelector(".stitle")
                                    : row.querySelector(`[data-field="${focus.field}"]`));
    if(el){
      el.focus();
      try { el.setSelectionRange(focus.start, focus.end); } catch(e){}
    }
  }
}
function srowEl(key){ return document.querySelector(`.srow[data-key="${cssEsc(key)}"]`); }
// Onto the list, at whatever the "add to…" dropdown says -- the same place a
// paper added from search would land, which is the bottom unless you changed it.
function addStaged(keys){
  if(guard()) return;
  const want  = new Set(keys.filter(k=>!findItem(k)));
  const moving = staged().filter(it=>want.has(it.key));
  if(!moving.length) return;
  DOC.staging = staged().filter(it=>!want.has(it.key));
  moving.forEach(it=>{ SOFF.delete(it.key); (it.tags||[]).forEach(rememberTag); });
  DOC.items.splice(insertIndex(), 0, ...moving);
  const y = window.scrollY;
  markDirty(); renderStage(); renderBoard(); renderCounts(); renderPaintbar();
  // You stay where you were : working through an imported list is a pass down
  // the shelf, and chasing each row to wherever it landed on the board -- the
  // bottom, a hundred rows away -- meant scrolling back for every single one.
  // The row still flashes where it went, and the toast still undoes it. Only
  // the LAST one out scrolls, because by then there is no shelf left to be in.
  window.scrollTo(0, y);
  const first = rowEl(moving[0].key);
  if(first){
    first.classList.add("flash");
    if(!staged().length) first.scrollIntoView({ block:"center", behavior:"smooth" });
  }
  toast(`Added ${moving.length} paper(s) to ${whereLabel()}`, 6000, "Undo", ()=>{
    DOC.items   = DOC.items.filter(it=>moving.indexOf(it) < 0);
    DOC.staging = moving.concat(staged());
    markDirty(); renderStage(); renderBoard(); renderCounts(); renderPaintbar();
  });
}
function dropStaged(keys){
  if(guard()) return;
  const gone = new Set(keys);
  const before = staged().slice();
  DOC.staging = staged().filter(it=>!gone.has(it.key));
  if(DOC.staging.length === before.length) return;
  keys.forEach(k=>SOFF.delete(k));
  const y = window.scrollY;
  markDirty(); renderStage(); renderCounts(); renderPaintbar();
  window.scrollTo(0, y);
  toast(`Dropped ${before.length - DOC.staging.length} staged row(s)`, 6000, "Undo", ()=>{
    DOC.staging = before; markDirty(); renderStage(); renderCounts(); renderPaintbar();
  });
}
// Every way this board already knows a paper : its key, its DOI, its title. A
// reference list is somebody else's spelling of papers you may well already
// have, so "do we have it" has to be all three -- the server resolves what it
// can to a library key first ( server._refs_payload ), and the title is the
// backstop for what it couldn't.
function haveIndex(){
  const seen = new Map();
  const add = (it, where)=>{
    if(it.key) seen.set(lc(it.key), where);
    if(it.doi) seen.set("doi:"+lc(it.doi), where);
    const t = ntitle(it.title);
    if(t) seen.set("t:"+t, where);
  };
  DOC.items.forEach(it=>add(it, "list"));
  staged().forEach(it=>add(it, "shelf"));
  return seen;
}
function stageRefs(refs, label){
  if(guard()) return;
  const seen = haveIndex();
  const fresh = [];
  let onList = 0, onShelf = 0;
  refs.forEach(r=>{
    const where = seen.get(lc(r.key)) || (r.doi && seen.get("doi:"+lc(r.doi)))
      || seen.get("t:"+ntitle(r.title)) || "";
    if(where === "list"){  onList++;  return; }
    if(where === "shelf"){ onShelf++; return; }
    const it = {
      key: r.key, title: r.title||"", authors: r.authors||"", doi: r.doi||"", wid: r.wid||"",
      pdf: r.pdf||"", year: r.year||null, journal: r.journal||"", tags: [],
      fields: Object.fromEntries(DOC.columns.map(c=>[c.id,""])), added_at: nowISO(),
    };
    STAGEHOW[it.key] = r.matched || "";
    // Two references in one file can still collide with each other.
    if(it.key) seen.set(lc(it.key), "shelf");
    const t = ntitle(it.title);
    if(t) seen.set("t:"+t, "shelf");
    fresh.push(it);
  });
  if(fresh.length){
    DOC.staging = staged().concat(fresh);
    markDirty();
  }
  renderStage(); renderCounts(); renderPaintbar();
  const skipped = [ onList ? `${onList} already on the list` : "",
                    onShelf ? `${onShelf} already staged` : "" ].filter(Boolean).join(", ");
  toast(`${label}: ${refs.length} read · ${fresh.length} staged`+(skipped?` · ${skipped}`:""), 6000);
  if(!fresh.length) return;
  // Same courtesy the board gives a paper added from search : one that turns out
  // to be in the library arrives pre-tagged from its ` prma modalities ` stamp,
  // with its Code / Datasets cells filled in ( see prefill ).
  fetchMeta(fresh.map(it=>it.key), true).then(()=>{
    let n = 0;
    fresh.forEach(it=>{
      const m = META[it.key];
      if(!it.tags.length && m && m.mods && m.mods.length){ it.tags = m.mods.slice(); sortTags(it); m.mods.forEach(rememberTag); n++; }
      if(prefill(it, m).length) n++;
    });
    if(n) markDirty();
    renderStage(); renderPaintbar();
  });
}

$("#stage").addEventListener("click", e=>{

// A staged row's notes, written into the document on every keystroke and again
// on blur -- the same belt and braces the board's own cells get ( captureField ),
// so a note survives the shelf redrawing under it.
function captureStageField(el){

}

// ---- importing a reference list -------------------------------------------
// A bibliography -- the list at the end of a review, a .docx a collaborator
// sent, a block pasted straight off a PDF -- read by src/db/refparse.py and
// staged. Papers this board already has are counted and skipped, so re-pasting
// a list you've grown only brings in what's new.
async function parseRefs(body, type, label){
  toast(`Reading ${label}…`, 20000);
  let d;
  try {
    d = await (await postJSON("/api/refs/parse", body, { type })).json();
  } catch(e){ toast("Could not read that ( offline? )", 4000); return; }
  if(!d || !d.ok){ toast(`Could not read that — ${esc((d&&d.error)||"no answer from the server")}`, 6000); return; }
  if(!(d.refs||[]).length){ toast(`No references found in ${label}`, 4000); return; }
  stageRefs(d.refs, label);
}
function refFile(f){
  $("#overlay").classList.remove("show");
  parseRefs(f, "application/octet-stream", f.name);
}
// Hold "e" and click 📋 Import refs to flip the whole board between edit and

let editHeld = false;

document.addEventListener("keyup",   e=>{ if(e.key === "e" || e.key === "E") editHeld = false; }, true);
window.addEventListener("blur", ()=>{ editHeld = false; });
