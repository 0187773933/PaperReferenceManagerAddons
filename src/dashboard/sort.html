<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prma sort</title>
<!-- Same pre-paint theme restore as the dashboard, so there's no flash. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("prma-theme")||"light";}catch(e){document.documentElement.dataset.theme="light";}</script>
<style>
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#ffffff; --line:#dce1e8;
    --fg:#1a1d23; --muted:#5b6470; --accent:#1a73e8; --green:#046A38;
    --chip:#eceff3; --warn:#c1670c; --row:#ffffff;
  }
  :root[data-theme="dark"] {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a3038;
    --fg:#e6e9ef; --muted:#8b94a3; --accent:#3ea6ff; --green:#046A38;
    --chip:#262c37; --warn:#e8a33d; --row:#141821;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; }
  .titlebar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .titlebar h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
  .counts { color:var(--muted); font-size:12px; display:flex; gap:12px; flex-wrap:wrap; }
  .counts b { color:var(--fg); font-weight:600; }
  .grow { flex:1; }
  button {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; cursor:pointer; font-size:13px;
  }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#04121f; border-color:var(--accent); font-weight:600; }
  button.on { border-color:var(--accent); color:var(--accent); }
  .navlink {
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; font-size:13px; text-decoration:none;
  }
  .navlink:hover { border-color:var(--accent); }
  .savestate { font-size:12px; color:var(--muted); min-width:104px; text-align:right; }
  .savestate.dirty { color:var(--warn); }

  .toolbar { display:flex; gap:10px; align-items:flex-start; margin-top:9px; flex-wrap:wrap; }
  .searchwrap { position:relative; flex:1; min-width:320px; }
  input[type=search], input[type=text] {
    width:100%; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px;
  }
  input[type=search]:focus, input[type=text]:focus { outline:none; border-color:var(--accent); }
  select { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 9px; font-size:13px; }
  .results {
    display:none; position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:40;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    max-height:56vh; overflow:auto; box-shadow:0 12px 34px rgba(0,0,0,.30);
  }
  .results.show { display:block; }
  .hit { display:flex; gap:10px; align-items:flex-start; padding:8px 11px; border-bottom:1px solid var(--line); cursor:grab; }
  .hit:last-child { border-bottom:none; }
  .hit.sel { background:var(--panel2); }
  .hit .ht { font-weight:500; }
  .hit .hm { color:var(--muted); font-size:12px; margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .hit .in { flex:none; color:var(--green); font-size:12px; white-space:nowrap; padding-top:3px; }
  .rhint { padding:7px 11px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }

  .paintbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:9px; }
  .pblabel { color:var(--muted); font-size:12px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .chip {
    display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:2px 8px;
    border-radius:11px; background:var(--chip); color:var(--fg); border:1px solid transparent;
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .chip:hover { filter:brightness(.96); }
  /* Every chip is drawn in ITS TAG'S colour ( see colorOf ) , so a row's
     modalities read as a pattern rather than as words you have to parse. The
     states below are outlines, not fills, so the colour survives them :
       .on   armed for painting · every selected row has it · in the filter
       .half only some of the selected rows have it */
  .chip.on   { outline:2px solid var(--accent); outline-offset:1px; font-weight:600; }
  .chip.half { outline:2px dashed var(--accent); outline-offset:1px; }
  .chip .x { color:inherit; opacity:.5; font-size:11px; cursor:pointer; }
  .chip .x:hover { opacity:1; color:#8b1a1a; }
  .chip .n { opacity:.55; font-size:11px; }
  .chip.ghost { background:transparent; border:1px dashed var(--line); color:var(--muted); }
  .pbtn { padding:3px 9px; font-size:12px; line-height:1.35; }
  .pbtn.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  /* Dragging a chip along the bar reorders the bar ( see reorderTags ) : the
     order is the document's, so a group you build here is there tomorrow. */
  .chips .chip[draggable="true"] { cursor:grab; }
  .chips .chip.tdrag { opacity:.35; }
  .chips .chip.dropL { box-shadow:-3px 0 0 var(--accent); }
  .chips .chip.dropR { box-shadow:3px 0 0 var(--accent); }
  /* the colour editor ( 🎨 Colors ) */
  .tagrow { display:flex; align-items:center; gap:9px; padding:4px 0; border-bottom:1px solid var(--line); }
  .tagrow:last-child { border-bottom:none; }
  .tagrow input[type=color] { width:30px; height:24px; padding:0; border:1px solid var(--line); border-radius:5px; background:none; cursor:pointer; }
  .tagrow .grow { flex:1; }
  .tagrow .cnt { color:var(--muted); font-size:12px; white-space:nowrap; }
  .tagrow button { padding:2px 7px; font-size:11px; }
  .newtag { width:120px !important; padding:3px 8px !important; font-size:12px !important; border-radius:11px !important; }
  body.painting .row { cursor:crosshair; }
  .paintnote { color:var(--accent); font-size:12px; }

  main { padding:12px 16px 140px; }
  .colhead, .row { display:grid; grid-template-columns:var(--grid); align-items:stretch; }
  .colhead {
    position:sticky; top:var(--headh,132px); z-index:9; background:var(--bg);
    color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    border-bottom:1px solid var(--line); padding:4px 0;
  }
  .colhead > div { padding:2px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .colhead .colname { cursor:pointer; }
  #board { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); margin-top:2px; }
  #board.dropinto { box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
  .row { border-bottom:1px solid var(--line); background:var(--row); }
  .row:last-child { border-bottom:none; }
  .row:hover { background:var(--panel2); }
  .row.dragging { opacity:.4; }
  .row.drop-before { box-shadow:inset 0 2px 0 var(--accent); }
  .row.drop-after  { box-shadow:inset 0 -2px 0 var(--accent); }
  .row.selected { background:color-mix(in srgb, var(--accent) 9%, var(--row)); }
  .row.selected .c:first-child { box-shadow:inset 3px 0 0 var(--accent); }
  .row.selected .c { border-top:1px solid var(--accent); border-bottom:1px solid var(--accent); }
  .row.flash { animation:flash 1.1s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 26%, transparent); } }
  .row.hide { display:none; }
  .c { padding:7px 8px; min-width:0; border-right:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .c:last-child { border-right:none; }
  /* The row's position : type a number in to send it there, or grab the grip
     underneath and drag it. */
  .numc { text-align:center; padding:7px 4px; }
  .numin {
    width:38px; text-align:center; background:transparent; border:1px solid transparent;
    color:var(--fg); border-radius:6px; padding:2px 3px; font:600 13px/1.2 inherit;
    font-variant-numeric:tabular-nums;
  }
  .numin:hover { border-color:var(--line); }
  .numin:focus { outline:none; border-color:var(--accent); background:var(--panel2); }
  .numc .grip { display:block; cursor:grab; font-size:11px; color:var(--muted); opacity:.6; user-select:none; }
  .numc .grip:hover { opacity:1; color:var(--accent); }
  .numc .grip:active { cursor:grabbing; }
  /* The title is TEXT, not a link : as a link it took the browser's visited
     colour the moment you opened the paper from any other prma page, so half
     the board turned gold for reasons that had nothing to do with the board.
     The link strip underneath is how you open it. */
  .titlec .tt { font-weight:500; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .links { margin-top:3px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:8px; font-size:12px; white-space:nowrap; }
  .links a:hover { text-decoration:underline; }
  .loose { color:var(--warn); font-size:11px; }
  .cellchips { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .chipin {
    width:52px; min-width:52px; background:transparent; border:1px dashed var(--line);
    color:var(--fg); border-radius:11px; padding:2px 7px; font-size:12px;
  }
  .chipin:focus { outline:none; width:120px; min-width:120px; border-style:solid; border-color:var(--accent); }
  .notecell textarea {
    width:100%; min-height:44px; resize:vertical; background:transparent; color:var(--fg);
    border:1px solid transparent; border-radius:6px; padding:4px 6px; font:13px/1.4 inherit;
  }
  .notecell textarea:hover { border-color:var(--line); }
  .notecell textarea:focus { outline:none; border-color:var(--accent); background:var(--panel2); min-height:110px; }
  .rowtools { display:flex; gap:5px; align-items:flex-start; justify-content:flex-end; }
  .delbtn { padding:2px 8px; font-size:13px; color:var(--muted); }
  .delbtn:hover { color:#fff; background:#c0392b; border-color:#c0392b; }
  .empty { color:var(--muted); padding:34px; text-align:center; }

  #acpop {
    display:none; position:absolute; z-index:80; min-width:170px; max-height:220px; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.32); padding:4px;
  }
  #acpop.show { display:block; }
  .acopt { padding:5px 9px; border-radius:6px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .acopt.sel, .acopt:hover { background:var(--panel2); color:var(--accent); }
  .acnew { color:var(--muted); font-size:11px; padding:4px 9px; }

  /* ---- the staging shelf : imported references, not on the list yet ---- */
  #stage { display:none; margin-bottom:13px; border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  #stage.show { display:block; }
  .stagehead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 11px; background:var(--panel2); border-bottom:1px solid var(--line); }
  .stagehead b { font-size:13px; }
  .stagehead .hint { color:var(--muted); font-size:12px; }
  .stagehead button { padding:3px 9px; font-size:12px; }
  .stagetagin { width:118px !important; padding:3px 9px !important; font-size:12px !important; border-radius:11px !important; }
  .srows { max-height:54vh; overflow:auto; }
  .srow { display:grid; grid-template-columns:24px minmax(240px,2.3fr) minmax(160px,1fr) 118px; gap:9px; align-items:start; padding:7px 11px; border-bottom:1px solid var(--line); }
  .srow:last-child { border-bottom:none; }
  .srow:hover { background:var(--panel2); }
  .srow .pick { margin-top:7px; }
  .stitle { width:100%; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--fg); font:500 14px/1.4 inherit; padding:3px 5px; }
  .stitle:hover { border-color:var(--line); }
  .stitle:focus { outline:none; border-color:var(--accent); background:var(--panel2); }
  .sauth { color:var(--muted); font-size:12px; padding:1px 6px 0; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .srow .links { padding-left:6px; }
  .stools { display:flex; gap:5px; justify-content:flex-end; }
  .stools button { padding:2px 8px; font-size:12px; }
  .badge { font-size:11px; border-radius:9px; padding:1px 7px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .badge.have { color:var(--green); font-weight:600; }
  .badge.fuzzy { color:var(--warn); }

  #overlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.45); align-items:center; justify-content:center; }
  #overlay.show { display:flex; }
  .sheet { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; max-width:580px; width:calc(100% - 40px); max-height:80vh; overflow:auto; }
  .sheet.wide { max-width:860px; }
  .sheet textarea {
    width:100%; min-height:200px; resize:vertical; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:9px 11px;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .sheet textarea:focus { outline:none; border-color:var(--accent); }
  .drop { border:1px dashed var(--line); border-radius:8px; padding:11px; text-align:center; color:var(--muted); font-size:12px; margin-top:10px; }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  .sheet h3 { margin:0 0 10px; font-size:15px; }
  .sheet p { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .sheet .btns { display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; margin-top:14px; }
  .sheet kbd { background:var(--chip); border-radius:4px; padding:1px 5px; font-size:11px; }
  .sheet ul { margin:0 0 12px 18px; padding:0; color:var(--muted); font-size:13px; }
  .sheet li { margin:3px 0; }
  #toast {
    position:fixed; right:18px; bottom:18px; z-index:90; display:none; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:10px 14px; font-size:13px; box-shadow:0 6px 22px rgba(0,0,0,.28);
  }
  #toast.show { display:flex; }
  #toast button { padding:3px 9px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1>prma sort</h1>
    <div class="counts" id="counts"></div>
    <div class="grow"></div>
    <a class="navlink" href="/" title="Back to the search dashboard">← Dashboard</a>
    <a class="navlink" href="/tiers" title="The other board: tier buckets you place papers in">★ Tiers</a>
    <select id="orderby" title="Reorder the whole list once — the order stays yours afterwards">
      <option value="">⇅ Order by…</option>
      <option value="tags">tags ( group them )</option>
      <option value="year">year, newest first</option>
      <option value="year_asc">year, oldest first</option>
      <option value="cites">citations</option>
      <option value="title">title A–Z</option>
      <option value="added">when added</option>
    </select>
    <button id="automove" title="Off: tagging never moves a row. On: a row jumps to sit with the others sharing its tags.">⇥ Auto-move: off</button>
    <button id="autotag" title="Tag every untagged row from its ` prma modalities ` stamp">⚡ Auto-tag</button>
    <button id="addcol" title="Add another free-text column ( like Notes )">＋ Column</button>
    <button id="refsbtn" title="Paste a reference list, or drop a .docx / .txt — the new ones land on the staging shelf">📋 Import refs</button>
    <button id="importbtn" title="Import a CSV — merge into this board or replace it">⇩ Import CSV</button>
    <button id="exportbtn" title="Download the whole board as CSV">⇧ Export CSV</button>
    <button id="pulltiers" title="Copy every paper from the /tiers board into this one">⇄ Pull from Tiers</button>
    <button id="helpbtn" title="How this page works">?</button>
    <button id="toggleTheme" title="Toggle light / dark theme">🌙 Dark</button>
    <div class="savestate" id="savestate">loading…</div>
  </div>
  <div class="toolbar">
    <div class="searchwrap">
      <input type="search" id="q" autocomplete="off"
        placeholder='Type any part of a title…   ↵ or double-click a hit to add it'>
      <div class="results" id="results"></div>
    </div>
    <select id="smode" title="Titles: type any part of a title, typos and all — closest first. Full text: the dashboard's boolean search over everything.">
      <option value="title">match titles</option>
      <option value="text">full text</option>
    </select>
    <select id="pool" title="Which pool to search">
      <option value="library">In library</option>
      <option value="external">Missing ( all )</option>
      <option value="references">In bibliographies</option>
      <option value="cited_by">Newer / citing</option>
    </select>
    <select id="addwhere" title="Where a paper you add from search lands in the list">
      <option value="bottom">add to bottom</option>
      <option value="top">add to top</option>
      <option value="placed">add after last sorted</option>
    </select>
    <input type="text" id="filter" style="max-width:220px" placeholder="Filter the list…" autocomplete="off">
  </div>
  <div class="paintbar">
    <span class="pblabel" title="Drag a tag along this bar to move it — the order is the board's, so groups you build here stay built">Tags:</span>
    <button class="pbtn" id="tagfilter" title="Turn the tag bar into a filter: click tags to show only the papers carrying them">🔎 Filter</button>
    <button class="pbtn" id="tagfilterany" style="display:none" title="any = a paper needs one of the chosen tags · all = it needs every one">any</button>
    <button class="pbtn" id="tagedit" title="Pick the colour every tag's chips are drawn in">🎨 Colors</button>
    <div class="chips" id="tagchips"></div>
    <span class="paintnote" id="paintnote"></span>
  </div>
</header>
<main>
  <section id="stage"></section>
  <div class="colhead" id="colhead"></div>
  <div id="board"></div>
</main>
<div id="acpop"></div>
<div id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
// ---------------------------------------------------------------------------
// The sort board : ONE list, in your order, numbered 1..N. No groups -- what a
// paper IS you say with tags, where it SITS you say by dragging it. Tagging
// never moves a row unless you turn Auto-move on. See src/db/sortboard.py .
// ---------------------------------------------------------------------------
const PROXY = "https://doi-org.ezproxy.libraries.wright.edu/";
const mdHref = k => "/md/" + encodeURIComponent(k).replace(/%2F/gi, "/");
const fileStem = k => String(k||"").replace(/[\/\\]/g, "_");

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48);
const nowISO = () => new Date().toISOString();
const lc = s => String(s||"").toLowerCase();

let DOC   = { version:1, options:{auto_move:false}, columns:[{id:"notes",label:"Notes"}], items:[], staging:[], vocab:{tags:[]} };
let REV   = 0;
let VOCAB = [];             // modality vocabulary ( config/methods.py )
let META  = {};             // paper key -> /api/paper-meta entry
let armed = null;           // tag armed for click-to-tag painting
let SEL   = new Set();      // keys of the selected rows ( outlined ) -- see selectRow
let selAnchor = null;       // where a shift-click range starts from
let TAGF  = new Set();      // tags the board is filtered down to ( see applyFilter )
let filtering = false;      // the tag bar is a filter right now, not a brush
let filterAll = false;      // ... and a row needs ALL of TAGF, not just one
let SOFF  = new Set();      // staged keys whose checkbox is OFF ( this browser only )
// How each staged row was matched to the library ( "doi" / "title" / "fuzzy" ).
// Deliberately NOT part of the document : it's a fact about the import you just
// ran, worth a badge while you review it and meaningless a day later.
let STAGEHOW = {};
let dirty = false, saving = false, saveTimer = null;

// ---- tag colours ----------------------------------------------------------
// A pastel wheel. Every tag gets one, so a row's chips are a pattern you can
// read at a glance instead of five words you have to. Dark ink reads on all of
// them, in either theme. A new tag takes the next colour nothing else is using ;
// anything without a stored colour falls back to a stable one picked from its
// name, so the board is never a wall of grey.
const PALETTE = [
  "#bfd8f7","#c6e8e2","#c9e9c0","#e3eeb4","#f6e7ab","#fbd9b4","#f9c9c0",
  "#f4c3ce","#e9c6e8","#d3ccf3","#c6d2f0","#bfe4f2","#e0dac6","#dfe2e8" ];
const TAGFG = "#20242c";
const isHex = c => /^#[0-9a-f]{6}$/i.test(String(c||""));
function hashIdx(s){ let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h % PALETTE.length; }
function vocabEntry(name){ return (DOC.vocab.tags||[]).find(t=>lc(t.name)===lc(name)); }
function colorOf(name){
  const e = vocabEntry(name);
  return (e && isHex(e.color)) ? e.color : PALETTE[hashIdx(lc(name))];
}
function nextColor(){
  const used = new Set((DOC.vocab.tags||[]).map(t=>lc(t.color)).filter(Boolean));
  return PALETTE.find(c=>!used.has(lc(c))) || PALETTE[(DOC.vocab.tags||[]).length % PALETTE.length];
}
const chipStyle = v => `style="background:${colorOf(v)};color:${TAGFG};border-color:transparent"`;
// A row's tags are kept alphabetical, always : the order you happened to add
// them in isn't information, and a list that shuffles is one you re-read.
const byName = (a,b) => lc(a).localeCompare(lc(b));
function sortTags(it){ if(it && it.tags) it.tags.sort(byName); }

function findItem(key){
  const i = DOC.items.findIndex(x=>x.key===key);
  return i<0 ? null : { idx:i, it:DOC.items[i] };
}
// Every tag the chips offer : the document's own tag list ( which is what makes
// an invented tag survive a restart ), the modality vocabulary, and anything
// actually in use on a row or on the staging shelf.
//
// IN THAT ORDER, and the order matters : vocab.tags is the order you dragged
// the bar into ( see reorderTags ), so it comes first and everything the
// document hasn't got a place for yet trails after it.
function tagOptions(){
  const out = [], seen = new Set();
  const push = v => { if(v && !seen.has(lc(v))){ seen.add(lc(v)); out.push(v); } };
  (DOC.vocab.tags||[]).forEach(t=>push(t.name));
  VOCAB.forEach(push);
  DOC.items.forEach(it=>(it.tags||[]).forEach(push));
  staged().forEach(it=>(it.tags||[]).forEach(push));
  return out;
}
// Dragging a chip along the bar puts it somewhere else in the bar. The order is
// the DOCUMENT's ( vocab.tags ) , not this browser's : grouping related tags
// side by side is a judgement about the tags, same as their colours, so it
// follows the board everywhere. Anything the bar was showing WITHOUT a place in
// the vocabulary gets one here -- otherwise a modality you dragged would snap
// back the next time the bar redrew.
function reorderTags(what, onto, before){
  const order = tagOptions();
  const from = order.findIndex(v=>lc(v)===lc(what));
  if(from < 0) return;
  const [v] = order.splice(from, 1);
  let to = onto ? order.findIndex(x=>lc(x)===lc(onto)) : -1;
  if(to < 0) to = order.length; else if(!before) to += 1;
  order.splice(to, 0, v);
  DOC.vocab.tags = order.map(name=>{ const e = vocabEntry(name); return { name, color: e ? e.color : "" }; });
  markDirty(); renderPaintbar();
}
const isVocab = t => VOCAB.some(v=>lc(v)===lc(t));
const tagSig  = it => (it.tags||[]).map(lc).sort().join("|");

// ---- load / save ----------------------------------------------------------
function markDirty(){
  dirty = true;
  $("#savestate").textContent = "unsaved…";
  $("#savestate").classList.add("dirty");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}
async function save(){
  clearTimeout(saveTimer);
  if(saving){ saveTimer = setTimeout(save, 400); return; }
  saving = true;
  try {
    const r = await (await fetch("/api/sort", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ doc: DOC }) })).json();
    if(r && r.ok){
      REV = r.rev; dirty = false;
      $("#savestate").classList.remove("dirty");
      $("#savestate").textContent = "saved " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    } else $("#savestate").textContent = "save failed";
  } catch(e){ $("#savestate").textContent = "save failed ( offline? )"; }
  saving = false;
}
async function loadDoc(){
  const d = await (await fetch("/api/sort")).json();
  DOC = d.doc; REV = d.rev; VOCAB = d.modalities || [];
  if(!DOC.options) DOC.options = { auto_move:false };
  if(!Array.isArray(DOC.staging)) DOC.staging = [];
  DOC.items.forEach(sortTags);      // the server stores them sorted ; older files may not be
  DOC.staging.forEach(sortTags);
  dirty = false;
  $("#savestate").classList.remove("dirty");
  $("#savestate").textContent = DOC.updated_at ? ("saved " + DOC.updated_at.replace("T"," ").slice(0,16)) : "empty board";
  renderAll();
  fetchMeta(DOC.items.concat(DOC.staging).map(it=>it.key));
}
async function pollRev(){
  try {
    const d = await (await fetch("/api/sort/version")).json();
    if(d && d.rev !== REV && !dirty && !saving){ await loadDoc(); toast("Reloaded — the board changed in another tab"); }
  } catch(e){}
  setTimeout(pollRev, 6000);
}
async function fetchMeta(keys, wantMods){
  keys = Array.from(new Set(keys.filter(k=>k && (wantMods || !META[k]))));
  if(!keys.length) return {};
  const got = {};
  for(let i=0; i<keys.length; i+=60){
    try {
      const r = await (await fetch("/api/paper-meta", { method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ keys: keys.slice(i,i+60), mods: !!wantMods }) })).json();
      Object.assign(META, r.meta || {});
      Object.assign(got,  r.meta || {});
    } catch(e){}
  }
  repaintLinks();
  return got;
}

// ---- rendering ------------------------------------------------------------
function gridTemplate(){
  const n = DOC.columns.length;
  const min = n > 3 ? "112px" : "150px";
  return `52px minmax(${n>3?"200px":"250px"},2.2fr) minmax(170px,1.1fr) `+
         DOC.columns.map(()=>`minmax(${min},1.1fr)`).join(" ")+` 54px`;
}
function renderColHead(){
  document.documentElement.style.setProperty("--grid", gridTemplate());
  $("#colhead").innerHTML = `<div style="text-align:right">#</div><div>Paper</div><div>Tags</div>`+
    DOC.columns.map(c=>`<div class="colname" data-col="${esc(c.id)}" title="Double-click to rename · shift-click to delete">${esc(c.label)}</div>`).join("")+
    `<div></div>`;
}
function rowLinks(it){
  const m = META[it.key] || {};
  const doi = it.doi || m.doi || "", wid = it.wid || m.wid || "";
  const out = [];
  if(doi){
    out.push(`<a href="https://doi.org/${esc(doi)}" target="_blank" rel="noopener">DOI</a>`);
    out.push(`<a href="${PROXY}${esc(doi)}" target="_blank" rel="noopener">Proxy</a>`);
  }
  if(m.pdf)       out.push(`<a href="/pdf?key=${encodeURIComponent(it.key)}" target="_blank">PDF</a>`);
  else if(it.pdf) out.push(`<a href="${esc(it.pdf)}" target="_blank" rel="noopener">PDF</a>`);
  if(wid)       out.push(`<a href="https://openalex.org/${esc(wid)}" target="_blank" rel="noopener">OA</a>`);
  if(m.montage) out.push(`<a href="${esc(m.montage)}" target="_blank" title="Figure montage">Figures</a>`);
  if(m.has_md)  out.push(`<a href="${mdHref(it.key)}" class="mdlink" target="_blank" rel="noopener" title="The rendered Markdown, with figures">MD</a>`);
  if(m.methods) out.push(`<a href="${esc(m.methods)}" target="_blank" title="The extracted Methods section">Methods</a>`);
  return out.join(" ");
}
function tagsCell(it){
  return `<div class="cellchips">`+
    (it.tags||[]).map(v=>`<span class="chip" ${chipStyle(v)} data-val="${esc(v)}">${esc(v)}`+
      `<span class="x" data-drop="${esc(v)}" title="Remove">×</span></span>`).join("")+
    `<input class="chipin" placeholder="+" autocomplete="off"></div>`;
}
function rowHtml(it, n){
  const m = META[it.key] || {};
  const title = it.title || m.title || it.key;
  const year  = it.year || m.year || "";
  const inner = esc(title);          // plain text -- open it from the link strip
  const loose = (m.in_library === false)
    ? ` <span class="loose" title="Not matched to a paper in your library — links other than the DOI are unavailable">not in library</span>` : "";
  return `<div class="row${SEL.has(it.key)?" selected":""}" data-key="${esc(it.key)}">`+
    `<div class="c numc">`+
      `<input class="numin" value="${n}" title="Type a position and press ↵ to send it there" `+
        `inputmode="numeric" autocomplete="off">`+
      `<span class="grip" title="Drag to move it up or down">⠿</span></div>`+
    `<div class="c titlec">`+
      `<div class="tt">${inner}${loose}</div>`+
      `<div class="meta">${year?esc(year):""}${it.journal?" · "+esc(it.journal):""}<span class="mkey"> · ${esc(it.key)}</span></div>`+
      `<div class="links" data-links="1">${rowLinks(it)}</div>`+
    `</div>`+
    `<div class="c" data-cell="tags">${tagsCell(it)}</div>`+
    DOC.columns.map(c=>`<div class="c notecell"><textarea data-field="${esc(c.id)}" `+
      `placeholder="${esc(c.label)}…" spellcheck="false">${esc((it.fields||{})[c.id]||"")}</textarea></div>`).join("")+
    `<div class="c rowtools">`+
      `<button class="delbtn" data-act="remove" title="Delete this paper from the board ( undoable )">🗑</button>`+
    `</div>`+
  `</div>`;
}
// A full redraw keeps whatever you were typing in : the caret is restored to the
// same field afterwards, so a re-render never eats a word of a note.
function renderBoard(){
  const a = document.activeElement;
  let focus = null;
  if(a && a.closest && a.closest(".row")){
    focus = { key: a.closest(".row").dataset.key,
              field: a.dataset ? a.dataset.field : null,
              chip: a.classList.contains("chipin"),
              num:  a.classList.contains("numin"),
              start: a.selectionStart, end: a.selectionEnd, val: a.value };
  }
  $("#board").innerHTML = DOC.items.length
    ? DOC.items.map((it,i)=>rowHtml(it, i+1)).join("")
    : `<div class="empty">Nothing here yet — search above and press ↵ ( or double-click a hit ) to add papers.</div>`;
  applyFilter();
  if(focus){
    const row = rowEl(focus.key);
    if(row){
      const el = focus.chip ? row.querySelector(".chipin")
               : focus.num  ? row.querySelector(".numin")
                            : row.querySelector(`[data-field="${focus.field}"]`);
      if(el){
        if(focus.chip && focus.val != null) el.value = focus.val;
        el.focus();
        try { el.setSelectionRange(focus.start, focus.end); } catch(e){}
      }
    }
  }
}
function renderCounts(){
  const n = DOC.items.length;
  const tagged = DOC.items.filter(it=>(it.tags||[]).length).length;
  const st = staged().length;
  $("#counts").innerHTML = `<span><b>${n}</b> papers</span><span><b>${tagged}</b> tagged</span>`+
    (st ? `<span><b>${st}</b> staged</span>` : "")+
    `<span>${tagOptions().length} tags</span>`;
}
// The tag bar has three jobs, in this order of precedence :
//   FILTERING ( 🔎 on )  -- a click puts the tag in / out of the filter, and the
//                           board shows only the papers carrying it.
//   rows SELECTED        -- the chips are checkboxes for those rows : solid
//                           outline = every one has it, dashed = some do, and a
//                           click flips it on all of them.
//   otherwise            -- a click arms the tag for painting ( click rows ).
function renderPaintbar(){
  const sel = filtering ? [] : selectedItems();
  $("#tagchips").innerHTML = tagOptions().map(v=>{
    const n   = DOC.items.filter(it=>hasTag(it,v)).length;
    const inF = filtering && TAGF.has(v);
    const on  = sel.length && sel.every(it=>hasTag(it,v));
    const som = !on && sel.some(it=>hasTag(it,v));
    const how = filtering  ? `${inF?"in":"not in"} the filter — click to ${inF?"drop":"add"} it ( ${n} paper(s) )`
              : sel.length ? `${on?"on":som?"on some of":"off"} the ${sel.length} selected row(s) — click to flip it`
                           : `${n} paper(s) — click to paint it onto rows`;
    return `<span class="chip ${(inF||armed===v||on)?'on':som?'half':''}" ${chipStyle(v)} draggable="true" `+
      `data-val="${esc(v)}" title="${esc(how)} — drag it to move it along the bar">${esc(v)}<span class="n">${n||""}</span>`+
      `<span class="x" data-deltag="${esc(v)}" title="Delete this tag everywhere">×</span></span>`;
  }).join("")+
    `<input class="chipin newtag" id="newtag" placeholder="+ new tag" autocomplete="off">`;
  renderNote();
  document.body.classList.toggle("painting", !!armed && !filtering);
}
// One line under the chips, saying whichever of these is true : what the board
// is filtered to, what's selected, what you're painting.
function renderNote(shown){
  const bits = [];
  if(TAGF.size || $("#filter").value.trim()){
    if(shown == null) shown = $$(".row:not(.hide)").length;
    bits.push(`showing ${shown} of ${DOC.items.length}`+
      (TAGF.size ? ` · ${filterAll?"all of":"any of"} ${Array.from(TAGF).join(", ")}` : ""));
  } else if(filtering){
    bits.push("click tags to show only the papers carrying them");
  }
  if(!filtering){
    const sel = selectedItems();
    if(sel.length) bits.push(`${sel.length} row(s) selected — click a tag above to toggle it on them ( Esc clears )`);
    else if(armed) bits.push(`painting “${armed}” — click rows to toggle it ( Esc to stop )`);
  }
  $("#paintnote").textContent = bits.join("   ·   ");
}
const hasTag = (it,v) => (it.tags||[]).some(t=>lc(t)===lc(v));
function selectedItems(){
  return Array.from(SEL).map(k=>findItem(k)).filter(Boolean).map(f=>f.it);
}
// Click a row to select it ( ⌘ / ctrl adds one, shift takes the range ). A plain
// click on the only selected row deselects it again.
function selectRow(key, e){
  if(e && (e.metaKey || e.ctrlKey)){
    SEL.has(key) ? SEL.delete(key) : SEL.add(key);
    selAnchor = key;
  } else if(e && e.shiftKey && selAnchor){
    const keys = DOC.items.map(it=>it.key);
    let a = keys.indexOf(selAnchor), b = keys.indexOf(key);
    if(a>=0 && b>=0){
      if(a>b){ const t=a; a=b; b=t; }
      for(let i=a;i<=b;i++) SEL.add(keys[i]);
    }
  } else {
    const only = SEL.size===1 && SEL.has(key);
    SEL = new Set(only ? [] : [key]);
    selAnchor = only ? null : key;
  }
  paintSelection(); renderPaintbar();
}
function paintSelection(){
  $$(".row").forEach(r=>r.classList.toggle("selected", SEL.has(r.dataset.key)));
}
function clearSelection(){
  if(!SEL.size) return;
  SEL.clear(); selAnchor = null;
  paintSelection(); renderPaintbar();
}
// One tag across every selected row : off everywhere if they ALL have it,
// otherwise on everywhere ( so a half-tagged selection fills in rather than
// flipping each row's state independently ).
function toggleTagOnSelection(value){
  const items = selectedItems();
  if(!items.length) return;
  const all = items.every(it=>hasTag(it,value));
  items.forEach(it=>{
    it.tags = it.tags || [];
    if(all)                 it.tags = it.tags.filter(t=>lc(t)!==lc(value));
    else if(!hasTag(it,value)) it.tags.push(value);
    sortTags(it);
  });
  rememberTag(value);
  markDirty();
  if(DOC.options.auto_move){ items.forEach(it=>autoMove(it.key)); renderBoard(); }
  else { items.forEach(it=>refreshTags(it.key)); applyFilter(); }
  renderPaintbar(); renderCounts();
  toast(`${all?"Removed":"Added"} “${value}” ${all?"from":"on"} ${items.length} row(s)`);
}
function renderAll(){ renderColHead(); renderBoard(); renderStage(); renderCounts(); renderPaintbar(); }
function repaintLinks(){
  $$(".row").forEach(row=>{
    const f = findItem(row.dataset.key);
    if(!f) return;
    const el = row.querySelector('[data-links]');
    if(el) el.innerHTML = rowLinks(f.it);
    const m = META[f.it.key];
    if(m && m.in_library === false && !row.querySelector(".loose"))
      row.querySelector(".tt").insertAdjacentHTML("beforeend",
        ` <span class="loose" title="Not matched to a paper in your library">not in library</span>`);
  });
  // The shelf's rows hang off the same meta ( "in library", and which links
  // exist ), and it lands after they're first drawn. Only those two strips are
  // touched -- a title you're editing up there is left alone.
  $$(".srow").forEach(row=>{
    const it = findStage(row.dataset.key);
    if(!it) return;
    const links = row.querySelector("[data-links]");
    if(links) links.innerHTML = rowLinks(it);
    const badge = row.querySelector("[data-sbadge]");
    if(badge) badge.innerHTML = sbadgeHtml(it);
  });
}
function cssEsc(s){ return String(s).replace(/["\\]/g, "\\$&"); }
function rowEl(key){ return document.querySelector(`.row[data-key="${cssEsc(key)}"]`); }
// Only the one row's tag cell -- so tagging never disturbs anything else on the
// page ( and never moves the row, unless Auto-move is on ).
function refreshTags(key){
  const f = findItem(key), row = rowEl(key);
  if(!f || !row) return;
  const cell = row.querySelector('[data-cell="tags"]');
  if(cell) cell.innerHTML = tagsCell(f.it);
}
function toast(msg, ms, undoLabel, onUndo){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>`+(onUndo?`<button id="undobtn">${esc(undoLabel||"Undo")}</button>`:"");
  t.classList.add("show");
  if(onUndo) $("#undobtn").onclick = ()=>{ t.classList.remove("show"); onUndo(); };
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms||3200);
}
function syncHeadOffset(){
  document.documentElement.style.setProperty("--headh", document.querySelector("header").offsetHeight + "px");
}

// ---- the staging shelf ----------------------------------------------------
// Where an imported reference list lands ( 📋 Import refs ) : the same rows as
// the board, OFF the list, so a bibliography can be read, corrected and TAGGED
// before any of it is given a position. Nothing here is in the sort -- the
// numbers below don't know it exists -- until you press Add.
//
// It lives in the DOCUMENT ( DOC.staging , see src/db/sortboard.py ) rather
// than in this browser : a pasted bibliography is a session of work, and a
// reload losing it would be the same kind of loss the board is written whole to
// avoid.
const staged = () => (DOC.staging = DOC.staging || []);
function findStage(key){ return staged().find(x=>x.key===key) || null; }
const picked = () => staged().filter(it=>!SOFF.has(it.key));
// Matches utils.normalize_title -- the same folding the server matched with.
const ntitle = s => String(s||"").normalize("NFKD").toLowerCase()
  .replace(/[^a-z0-9]+/g," ").trim();

const WHERE_LABEL = { bottom:"the bottom", top:"the top", placed:"after the last sorted row" };
const whereLabel = () => WHERE_LABEL[DOC.options.add_where || "bottom"] || "the bottom";

function stageHeadHtml(){
  const n = picked().length, all = n === staged().length;
  return `<div class="stagehead">`+
    `<b>Staging</b>`+
    `<span class="hint">${staged().length} imported reference(s) — not on the list yet</span>`+
    `<div class="grow"></div>`+
    `<input class="chipin stagetagin" id="stagetag" placeholder="+ tag checked" autocomplete="off" `+
      `title="Type a tag and press ↵ to put it on every checked row">`+
    `<button id="stageall" title="Check or uncheck every row">${all?"none":"all"}</button>`+
    `<button id="stagedrop" ${n?"":"disabled"} title="Throw the checked rows away ( undoable )">🗑</button>`+
    `<button class="primary" id="stageadd" ${n?"":"disabled"} `+
      `title="Move them onto the list — where the “add to…” dropdown says">＋ Add ${n} to ${whereLabel()}</button>`+
  `</div>`;
}
// Only the header, for a checkbox tick : re-rendering the whole shelf on every
// tick would throw away a note you were half-way through typing.
function refreshStageHead(){
  const head = $("#stage .stagehead");
  if(head) head.outerHTML = stageHeadHtml();
}
// year · journal · whether the library turned out to have it. The last part
// only becomes true once /api/paper-meta lands, so repaintLinks redraws it.
function sbadgeHtml(it){
  const m = META[it.key] || {};
  const bits = [ it.year || "", it.journal || "" ].filter(Boolean).map(esc).join(" · ");
  const badge = m.in_library
    ? `<span class="badge have" title="Matched a paper already in your library — it arrives with all its links">in library</span>`
    : `<span class="badge" title="Nothing in your library matched this one">new</span>`;
  const fuzzy = STAGEHOW[it.key] === "fuzzy"
    ? `<span class="badge fuzzy" title="Matched on the title alone, with no DOI to confirm it — worth a look before you add it">fuzzy</span>` : "";
  return `${bits}${bits?" · ":""}${badge}${fuzzy}`;
}
function srowHtml(it){
  return `<div class="srow" data-key="${esc(it.key)}">`+
    `<input type="checkbox" class="pick" ${SOFF.has(it.key)?"":"checked"} title="Include this one when you add">`+
    `<div>`+
      `<input class="stitle" value="${esc(it.title)}" title="A parsed title isn't always the right one — fix it here">`+
      (it.authors ? `<div class="sauth">${esc(it.authors)}</div>` : "")+
      `<div class="sauth" data-sbadge="1">${sbadgeHtml(it)}</div>`+
      `<div class="links" data-links="1">${rowLinks(it)}</div>`+
    `</div>`+
    `<div data-cell="tags">${tagsCell(it)}</div>`+
    `<div class="stools">`+
      `<button data-act="sadd" title="Add just this one">＋ Add</button>`+
      `<button class="delbtn" data-act="sdrop" title="Throw this one away ( undoable )">🗑</button>`+
    `</div>`+
  `</div>`;
}
function renderStage(){
  const box = $("#stage");
  box.classList.toggle("show", staged().length > 0);
  box.innerHTML = staged().length
    ? stageHeadHtml() + `<div class="srows">` + staged().map(srowHtml).join("") + `</div>`
    : "";
}
function srowEl(key){ return document.querySelector(`.srow[data-key="${cssEsc(key)}"]`); }
// Onto the list, at whatever the "add to…" dropdown says -- the same place a
// paper added from search would land, which is the bottom unless you changed it.
function addStaged(keys){
  const want  = new Set(keys.filter(k=>!findItem(k)));
  const moving = staged().filter(it=>want.has(it.key));
  if(!moving.length) return;
  DOC.staging = staged().filter(it=>!want.has(it.key));
  moving.forEach(it=>{ SOFF.delete(it.key); (it.tags||[]).forEach(rememberTag); });
  DOC.items.splice(insertIndex(), 0, ...moving);
  markDirty(); renderStage(); renderBoard(); renderCounts(); renderPaintbar();
  const first = rowEl(moving[0].key);
  if(first){ first.classList.add("flash"); first.scrollIntoView({ block:"center", behavior:"smooth" }); }
  toast(`Added ${moving.length} paper(s) to ${whereLabel()}`, 6000, "Undo", ()=>{
    DOC.items   = DOC.items.filter(it=>moving.indexOf(it) < 0);
    DOC.staging = moving.concat(staged());
    markDirty(); renderStage(); renderBoard(); renderCounts(); renderPaintbar();
  });
}
function dropStaged(keys){
  const gone = new Set(keys);
  const before = staged().slice();
  DOC.staging = staged().filter(it=>!gone.has(it.key));
  if(DOC.staging.length === before.length) return;
  keys.forEach(k=>SOFF.delete(k));
  markDirty(); renderStage(); renderCounts(); renderPaintbar();
  toast(`Dropped ${before.length - DOC.staging.length} staged row(s)`, 6000, "Undo", ()=>{
    DOC.staging = before; markDirty(); renderStage(); renderCounts(); renderPaintbar();
  });
}
// Every way this board already knows a paper : its key, its DOI, its title. A
// reference list is somebody else's spelling of papers you may well already
// have, so "do we have it" has to be all three -- the server resolves what it
// can to a library key first ( server._refs_payload ), and the title is the
// backstop for what it couldn't.
function haveIndex(){
  const seen = new Map();
  const add = (it, where)=>{
    if(it.key) seen.set(lc(it.key), where);
    if(it.doi) seen.set("doi:"+lc(it.doi), where);
    const t = ntitle(it.title);
    if(t) seen.set("t:"+t, where);
  };
  DOC.items.forEach(it=>add(it, "list"));
  staged().forEach(it=>add(it, "shelf"));
  return seen;
}
function stageRefs(refs, label){
  const seen = haveIndex();
  const fresh = [];
  let onList = 0, onShelf = 0;
  refs.forEach(r=>{
    const where = seen.get(lc(r.key)) || (r.doi && seen.get("doi:"+lc(r.doi)))
      || seen.get("t:"+ntitle(r.title)) || "";
    if(where === "list"){  onList++;  return; }
    if(where === "shelf"){ onShelf++; return; }
    const it = {
      key: r.key, title: r.title||"", authors: r.authors||"", doi: r.doi||"", wid: r.wid||"",
      pdf: r.pdf||"", year: r.year||null, journal: r.journal||"", tags: [],
      fields: Object.fromEntries(DOC.columns.map(c=>[c.id,""])), added_at: nowISO(),
    };
    STAGEHOW[it.key] = r.matched || "";
    // Two references in one file can still collide with each other.
    if(it.key) seen.set(lc(it.key), "shelf");
    const t = ntitle(it.title);
    if(t) seen.set("t:"+t, "shelf");
    fresh.push(it);
  });
  if(fresh.length){
    DOC.staging = staged().concat(fresh);
    markDirty();
  }
  renderStage(); renderCounts(); renderPaintbar();
  const skipped = [ onList ? `${onList} already on the list` : "",
                    onShelf ? `${onShelf} already staged` : "" ].filter(Boolean).join(", ");
  toast(`${label}: ${refs.length} read · ${fresh.length} staged`+(skipped?` · ${skipped}`:""), 6000);
  if(!fresh.length) return;
  // Same courtesy the board gives a paper added from search : one that turns out
  // to be in the library arrives pre-tagged from its ` prma modalities ` stamp.
  fetchMeta(fresh.map(it=>it.key), true).then(()=>{
    let n = 0;
    fresh.forEach(it=>{
      const m = META[it.key];
      if(!it.tags.length && m && m.mods && m.mods.length){ it.tags = m.mods.slice(); sortTags(it); m.mods.forEach(rememberTag); n++; }
    });
    if(n) markDirty();
    renderStage(); renderPaintbar();
  });
}

$("#stage").addEventListener("click", e=>{

// ---- importing a reference list -------------------------------------------
// A bibliography -- the list at the end of a review, a .docx a collaborator
// sent, a block pasted straight off a PDF -- read by src/db/refparse.py and
// staged. Papers this board already has are counted and skipped, so re-pasting
// a list you've grown only brings in what's new.
async function parseRefs(body, type, label){
  toast(`Reading ${label}…`, 20000);
  let d;
  try {
    d = await (await fetch("/api/refs/parse", { method:"POST",
      headers:{ "Content-Type": type }, body })).json();
  } catch(e){ toast("Could not read that ( offline? )", 4000); return; }
  if(!d || !d.ok){ toast(`Could not read that — ${esc((d&&d.error)||"no answer from the server")}`, 6000); return; }
  if(!(d.refs||[]).length){ toast(`No references found in ${label}`, 4000); return; }
  stageRefs(d.refs, label);
}
function refFile(f){
  $("#overlay").classList.remove("show");
  parseRefs(f, "application/octet-stream", f.name);
}
$("#refsbtn").addEventListener("click", ()=>{
  sheet(`
    <h3>Import a reference list</h3>
    <p>Paste references below — numbered or not, AMA / APA / IEEE, whatever your source uses — or
       drop a <kbd>.docx</kbd> / <kbd>.txt</kbd> on the box under it. Everything lands on the
       <b>staging shelf</b> above the list, where you fix titles and tag them before adding.
       Anything already on the board is skipped.</p>
    <textarea id="reftext" spellcheck="false" placeholder="33.&#9;Comte A, Gabriel D, Pazart L, et al. On the difficulty to communicate with fMRI-based protocols used to identify covert awareness. Neuroscience. 2015;300:448-459. doi:10.1016/j.neuroscience.2015.05.059"></textarea>
    <div class="drop" id="refdrop">or drop a <b>.docx</b> / <b>.txt</b> here, or <a href="#" id="refpick">choose a file</a></div>
    <div class="btns">
      <button data-act="cancel">Cancel</button>
      <button class="primary" data-act="parse">Read them</button>
    </div>`, act=>{
    if(act !== "parse") return;
    const text = (($("#reftext")||{}).value || "").trim();
    if(!text){ toast("Nothing pasted"); return; }
    parseRefs(JSON.stringify({ text }), "application/json", "the pasted text");
  }, true);
  const pick = $("#refpick"), drop = $("#refdrop"), ta = $("#reftext");
  pick.onclick = ev=>{
    ev.preventDefault();
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".docx,.txt,.md,.text,text/plain";
    inp.onchange = ()=>{ const f = inp.files && inp.files[0]; if(f) refFile(f); };
    inp.click();
  };
  // The page's own row / hit dragging bails on anything it didn't start ( it
  // checks dragKey / dragHit ), so a file dropped here only has the browser's
  // "navigate to it" default to beat.
  drop.ondragover  = ev=>{ ev.preventDefault(); ev.stopPropagation(); drop.classList.add("over"); };
  drop.ondragleave = ()=> drop.classList.remove("over");
  drop.ondrop = ev=>{
    ev.preventDefault(); ev.stopPropagation(); drop.classList.remove("over");
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if(f) refFile(f);
  };
  if(ta) ta.focus();
});

// ---- mutations ------------------------------------------------------------
function newItem(hit){
  return {
    key: hit.key, title: hit.title||"", doi: hit.doi||"", wid: hit.wid||"",
    pdf: hit.pdf_local ? "" : (hit.pdf||""),
    year: hit.year||null, journal: hit.journal||"", tags: [],
    fields: Object.fromEntries(DOC.columns.map(c=>[c.id,""])), added_at: nowISO(),
  };
}
// Where a paper added from search lands. "placed" means : right after the last
// row you actually put somewhere ( dragged, or typed a number into ) -- so the
// part of the list you've already ranked stays intact and new arrivals queue up
// directly under it instead of at the bottom of everything.
function insertIndex(){
  const how = DOC.options.add_where || "bottom";
  if(how === "top") return 0;
  if(how === "placed"){
    let last = -1;
    DOC.items.forEach((it,i)=>{ if(it.placed) last = i; });
    return last + 1;
  }
  return DOC.items.length;
}
async function addPaper(hit){
  if(findItem(hit.key)){ toast("Already on the board"); return; }
  const it = newItem(hit);
  const m  = META[hit.key];
  if(m && m.mods && m.mods.length){ it.tags = m.mods.slice(); sortTags(it); }  // pre-tagged from the Methods stamp
  DOC.items.splice(insertIndex(), 0, it);
  markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  const el = rowEl(it.key);
  if(el){ el.classList.add("flash"); el.scrollIntoView({ block:"center", behavior:"smooth" }); }
  const got = await fetchMeta([it.key], true);
  const gm = got[it.key];
  if(gm && !it.tags.length && gm.mods && gm.mods.length){
    it.tags = gm.mods.slice(); sortTags(it); markDirty(); refreshTags(it.key); renderPaintbar(); renderCounts();
  }
  if(hits.length) renderResults();
}
function removeItem(key){
  const f = findItem(key);
  if(!f) return;
  const at = f.idx;
  const [gone] = DOC.items.splice(at, 1);
  SEL.delete(key);
  markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  toast(`Removed “${(gone.title||gone.key).slice(0,60)}”`, 6000, "Undo", ()=>{
    DOC.items.splice(Math.min(at, DOC.items.length), 0, gone);
    markDirty(); renderBoard(); renderCounts(); renderPaintbar();
  });
}
// `index` is a 0-based position in the list. Moving a row by hand marks it
// placed -- that's what "add after last sorted" keys off.
function moveTo(key, index){
  const f = findItem(key);
  if(!f) return;
  const [it] = DOC.items.splice(f.idx, 1);
  if(f.idx < index) index--;
  DOC.items.splice(Math.max(0, Math.min(index, DOC.items.length)), 0, it);
  it.placed = true;
  markDirty(); renderBoard();
}
// Auto-move ( off by default ) : after a tag change, slide the row down to sit
// with the others carrying exactly the same tags.
function autoMove(key){
  if(!DOC.options.auto_move) return;
  const f = findItem(key);
  if(!f) return;
  const sig = tagSig(f.it);
  let last = -1;
  DOC.items.forEach((x,i)=>{ if(i!==f.idx && tagSig(x)===sig) last = i; });
  if(last < 0) return;
  const [it] = DOC.items.splice(f.idx, 1);
  DOC.items.splice(last < f.idx ? last+1 : last, 0, it);
}
function afterTagChange(key){
  const moved = DOC.options.auto_move;
  if(moved) autoMove(key);
  markDirty();
  if(moved) renderBoard(); else { refreshTags(key); applyFilter(); }
  renderPaintbar(); renderCounts();
}
function toggleTag(it, value){
  const i = (it.tags||[]).findIndex(v=>lc(v)===lc(value));
  if(i>=0) it.tags.splice(i,1); else it.tags.push(value);
  sortTags(it);
  rememberTag(value);
}
function addTag(it, value){
  value = (value||"").trim();
  if(!value) return false;
  if((it.tags||[]).some(v=>lc(v)===lc(value))) return false;
  it.tags.push(value);
  sortTags(it);
  rememberTag(value);
  return true;
}
// Any tag you use or invent joins the document's own tag list, so it's still
// offered after a restart -- even if you later take it off every paper.
function rememberTag(value){
  if(!(DOC.vocab.tags||[]).some(t=>lc(t.name)===lc(value)))
    DOC.vocab.tags.push({ name:value, color:nextColor() });   // the next unused pastel
}

// ---- search ---------------------------------------------------------------
// Two ways to find a paper, and the default is the one you actually want here :
//   match titles ( mode=title ) -- type any piece of a title and the closest
//     titles come back, best first. Nothing has to match exactly, so a typo, a
//     missing word or two words the wrong way round still lands the paper.
//   full text   ( mode=text )  -- the dashboard's boolean search over the whole
//     OCR'd body, for when you're hunting a phrase rather than a paper.
// See src/dashboard/index.py :: title_search .
let hits = [], hitIdx = 0, hitTotal = 0, hitFuzzy = false, hitMode = "title", searchTimer = null;
async function runSearch(){
  const q = $("#q").value.trim();
  if(!q){ closeResults(); return; }
  const mode = $("#smode").value;
  let d;
  try { d = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&pool=${$("#pool").value}`+
    `&mode=${mode}&sort=relevance&limit=25&hide_skipped=0`)).json(); }
  catch(e){ return; }
  if(d.status !== "ready"){
    $("#results").innerHTML = `<div class="rhint">The search index isn't built yet — open the dashboard once to build it.</div>`;
    $("#results").classList.add("show");
    return;
  }
  hits = d.results || []; hitIdx = 0; hitTotal = d.total; hitFuzzy = !!d.fuzzy;
  hitMode = d.mode || mode;
  renderResults();
  fetchMeta(hits.map(h=>h.key), true).then(()=>renderResults());
}
function renderResults(){
  if(!hits.length){
    $("#results").innerHTML = `<div class="rhint">Nothing close to that${hitMode==="title"?" in any title":""}.</div>`;
    $("#results").classList.add("show");
    return;
  }
  const hint = hitFuzzy
    ? `<div class="rhint" style="color:var(--warn)">Nothing came close — these are the least-far-off titles</div>`
    : hitMode === "title"
      ? `<div class="rhint">${hits.length} closest title${hits.length===1?"":"s"} · ↵ or double-click adds ( tagged from its Methods stamp ) · or drag a hit into the list</div>`
      : `<div class="rhint">${hits.length} of ${hitTotal} · best match first · ↵ or double-click adds · or drag a hit into the list</div>`;
  $("#results").innerHTML = hint+
    hits.map((h,i)=>{
      const f = findItem(h.key);
      const m = META[h.key] || {};
      const mods = (m.mods||[]).map(v=>`<span class="chip" ${chipStyle(v)}>${esc(v)}</span>`).join(" ");
      return `<div class="hit ${i===hitIdx?'sel':''}" data-i="${i}" draggable="true">`+
        `<div style="flex:1;min-width:0">`+
          `<div class="ht">${esc(h.title||h.key)}</div>`+
          `<div class="hm">${h.year?esc(h.year):""}${h.journal?" · "+esc(h.journal):""}`+
            `${h.cited_by!=null?` · ${h.cited_by} cites`:""} ${mods}</div>`+
        `</div>`+
        (f ? `<div class="in">✓ #${f.idx+1}</div>` : `<button class="add" data-i="${i}">＋ Add</button>`)+
      `</div>`;
    }).join("");
  $("#results").classList.add("show");
}
function closeResults(){ $("#results").classList.remove("show"); hits = []; }
function moveHit(delta){
  if(!hits.length) return;
  hitIdx = Math.max(0, Math.min(hits.length-1, hitIdx+delta));
  $$("#results .hit").forEach((el,i)=>el.classList.toggle("sel", i===hitIdx));
  const el = $$("#results .hit")[hitIdx];
  if(el) el.scrollIntoView({ block:"nearest" });
}

// ---- autocomplete ---------------------------------------------------------
let AC = { input:null, opts:[], idx:0 };
// The rows a chip input types onto : one board row, one staged row, or -- from
// the shelf's own "+ tag checked" box -- every checked staged row at once. One
// function so the autocomplete, and everything below it, is written once.
function acTargets(input){
  if(input.id === "stagetag") return picked();
  const s = input.closest(".srow");
  if(s){ const it = findStage(s.dataset.key); return it ? [ it ] : []; }
  const r = input.closest(".row");
  if(r){ const f = findItem(r.dataset.key); return f ? [ f.it ] : []; }
  return [];
}
function acOptions(input){
  const targets = acTargets(input);
  // Offer what at least one target hasn't got : with several rows picked, a tag
  // some of them are missing is exactly the one you're reaching for.
  const have = targets.length
    ? tagOptions().filter(v=>targets.every(it=>hasTag(it,v))).map(lc) : [];
  const term = lc(input.value.trim());
  return tagOptions().filter(v=>!have.includes(lc(v))).filter(v=>!term || lc(v).includes(term));
}
function acOpen(input){ AC.input = input; AC.idx = 0; AC.opts = acOptions(input); acRender(); }
function acRender(){
  const pop = $("#acpop");
  if(!AC.input){ pop.classList.remove("show"); return; }
  const term = AC.input.value.trim();
  const body = AC.opts.map((v,i)=>`<div class="acopt ${i===AC.idx?'sel':''}" data-v="${esc(v)}">${esc(v)}</div>`).join("");
  const isNew = term && !AC.opts.some(v=>lc(v)===lc(term));
  pop.innerHTML = (body + (isNew?`<div class="acnew">↵ creates “${esc(term)}”</div>`:"")) ||
    `<div class="acnew">type to create a new one</div>`;
  const r = AC.input.getBoundingClientRect();
  pop.style.left = (r.left + window.scrollX) + "px";
  pop.style.top  = (r.bottom + window.scrollY + 4) + "px";
  pop.classList.add("show");
}
function acClose(){ AC.input = null; AC.opts = []; $("#acpop").classList.remove("show"); }
function acCommit(value){
  const input = AC.input;
  if(!input) return;
  const v = (value != null ? value : input.value).trim();
  if(!v){ acClose(); return; }
  const board = input.closest(".row");
  const srow  = input.closest(".srow");
  const n = acTargets(input).filter(it=>addTag(it, v)).length;
  if(!n){ input.value = ""; acClose(); return; }
  acClose();
  if(board){
    afterTagChange(board.dataset.key);
    const row = rowEl(board.dataset.key);
    if(row) row.querySelector(".chipin").focus();
    return;
  }
  // The shelf : redraw it, then put the caret back where it was so a run of
  // tags is one uninterrupted stretch of typing.
  markDirty(); renderStage(); renderPaintbar(); renderCounts();
  const el = srow ? ( srowEl(srow.dataset.key) || document ).querySelector(".chipin")
                  : $("#stagetag");
  if(el) el.focus();
  if(!srow) toast(`Tagged ${n} staged row(s) “${v}”`);
}

// ---- drag and drop --------------------------------------------------------
let dragKey = null, dragHit = null;
function clearDropMarks(){
  $$(".row").forEach(r=>r.classList.remove("drop-before","drop-after"));
  $("#board").classList.remove("dropinto");
}
function dropTarget(e){
  const board = e.target.closest("#board");
  if(!board) return null;
  const row = e.target.closest(".row");
  if(!row) return { index: DOC.items.length, row:null, after:false };
  const r = row.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  const f = findItem(row.dataset.key);
  return { index: (f ? f.idx : DOC.items.length) + (after?1:0), row, after };
}
document.addEventListener("dragover", e=>{
  if(!dragKey && !dragHit) return;
  const t = dropTarget(e);
  if(!t) return;
  e.preventDefault();
  clearDropMarks();
  if(t.row) t.row.classList.add(t.after?"drop-after":"drop-before");
  else $("#board").classList.add("dropinto");
});
document.addEventListener("drop", e=>{
  if(!dragKey && !dragHit) return;
  const t = dropTarget(e);
  clearDropMarks();
  if(!t){ dragKey = dragHit = null; return; }
  e.preventDefault();
  if(dragKey) moveTo(dragKey, t.index);
  else if(dragHit){
    const hit = dragHit;
    if(findItem(hit.key)) toast("Already on the board");
    else {
      const it = newItem(hit);
      const m = META[hit.key];
      if(m && m.mods){ it.tags = m.mods.slice(); sortTags(it); }
      DOC.items.splice(Math.min(t.index, DOC.items.length), 0, it);
      markDirty(); renderBoard(); renderCounts(); renderPaintbar();
      fetchMeta([it.key], true);
      if(hits.length) renderResults();
    }
  }
  dragKey = dragHit = null;
});
document.addEventListener("dragend", ()=>{
  clearDropMarks();
  $$(".row.dragging").forEach(r=>r.classList.remove("dragging"));
  $$(".row").forEach(r=>r.draggable = false);
  dragKey = dragHit = null;
});
$("#board").addEventListener("mousedown", e=>{
  const h = e.target.closest(".grip");
  if(!h) return;
  const row = h.closest(".row");
  if(row) row.draggable = true;
});
$("#board").addEventListener("dragstart", e=>{
  const row = e.target.closest(".row");
  if(!row || !row.draggable){ e.preventDefault(); return; }
  dragKey = row.dataset.key;
  row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragKey); } catch(err){}
});
$("#results").addEventListener("dragstart", e=>{
  const hit = e.target.closest(".hit");
  if(!hit) return;
  dragHit = hits[+hit.dataset.i];
  e.dataTransfer.effectAllowed = "copy";
  try { e.dataTransfer.setData("text/plain", dragHit.key); } catch(err){}
});

// ---- row interactions -----------------------------------------------------
$("#board").addEventListener("click", e=>{
  const row = e.target.closest(".row");
  const x = e.target.closest(".cellchips .x");
  if(x && row){
    const f = findItem(row.dataset.key);
    if(f){ toggleTag(f.it, x.dataset.drop); afterTagChange(f.it.key); }
    return;
  }
  if(e.target.closest('[data-act="remove"]') && row){ removeItem(row.dataset.key); return; }
  // A click on the body of a row : paints the armed tag if you're painting,
  // otherwise selects the row ( so the tag bar can tag it ). The grip is exempt
  // -- grabbing a row to drag it shouldn't select or tag it.
  if(row && !e.target.closest("input,textarea,select,button,a,.chip,.grip")){
    if(armed){
      const f = findItem(row.dataset.key);
      if(f){ toggleTag(f.it, armed); afterTagChange(f.it.key); }
    } else selectRow(row.dataset.key, e);
  }
});
$("#board").addEventListener("click", e=>{
  const a = e.target.closest(".mdlink");
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button!==0) return;
  e.preventDefault();
  const w = window.open(a.href, "_blank");
  if(w){ try { w.blur(); } catch(err){} }
  window.focus();
});
// Notes + custom columns : written into the document on every keystroke, and
// again on blur ( belt and braces -- anything that ever ends up in the box ends
// up in the file ).
function captureField(el){
  const row = el.closest(".row");
  if(!row) return;
  const f = findItem(row.dataset.key);
  if(!f) return;
  const was = (f.it.fields||{})[el.dataset.field];
  if(was === el.value) return;
  (f.it.fields = f.it.fields||{})[el.dataset.field] = el.value;
  markDirty();
}
// Type a position into a row's number and press ↵ ( or tab away ) to send it
// there. Anything out of range clamps to the ends of the list.
function applyNumber(input){
  const row = input.closest(".row");
  if(!row) return;
  const f = findItem(row.dataset.key);
  if(!f) return;
  const want = parseInt(String(input.value).replace(/[^0-9]/g,""), 10);
  if(isNaN(want) || want === f.idx+1){ input.value = f.idx+1; return; }
  const to = Math.max(0, Math.min(want-1, DOC.items.length-1));
  moveTo(f.it.key, to > f.idx ? to+1 : to);
  const again = rowEl(f.it.key);
  if(again){
    const el = again.querySelector(".numin");
    if(el){ el.focus(); el.select(); }
    again.classList.add("flash");
    again.scrollIntoView({ block:"nearest" });
  }
}
$("#board").addEventListener("keydown", e=>{
  if(!e.target.matches(".numin")) return;
  if(e.key==="Enter"){ e.preventDefault(); applyNumber(e.target); }
  else if(e.key==="Escape"){ const f = findItem(e.target.closest(".row").dataset.key); if(f) e.target.value = f.idx+1; e.target.blur(); }
});
$("#board").addEventListener("focusout", e=>{ if(e.target.matches(".numin")) applyNumber(e.target); });
$("#board").addEventListener("focusin",  e=>{ if(e.target.matches(".numin")) e.target.select(); });

$("#board").addEventListener("input",  e=>{ if(e.target.matches("textarea[data-field]")) captureField(e.target); });
$("#board").addEventListener("change", e=>{ if(e.target.matches("textarea[data-field]")) captureField(e.target); });
$("#board").addEventListener("focusout", e=>{ if(e.target.matches("textarea[data-field]")) captureField(e.target); });

// chip inputs -> autocomplete
document.addEventListener("focusin", e=>{ if(e.target.matches(".chipin:not(#newtag)")) acOpen(e.target); });
document.addEventListener("input", e=>{ if(e.target.matches(".chipin:not(#newtag)") && AC.input===e.target){ AC.opts = acOptions(e.target); AC.idx = 0; acRender(); } });
document.addEventListener("keydown", e=>{
  if(!e.target.matches(".chipin:not(#newtag)")) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); AC.idx = Math.min(AC.opts.length-1, AC.idx+1); acRender(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); AC.idx = Math.max(0, AC.idx-1); acRender(); }
  else if(e.key==="Enter"){
    e.preventDefault();
    const typed = e.target.value.trim(), pick = AC.opts[AC.idx];
    acCommit(pick && (!typed || lc(pick).startsWith(lc(typed))) ? pick : typed);
  }
  else if(e.key==="Escape"){ acClose(); e.target.blur(); }
});
document.addEventListener("focusout", e=>{ if(e.target.matches(".chipin:not(#newtag)")) setTimeout(()=>{ if(AC.input===e.target) acClose(); }, 120); });

$("#tagchips").addEventListener("click", e=>{
  const del = e.target.closest("[data-deltag]");
  if(del){
    const v = del.dataset.deltag;
    const n = DOC.items.filter(it=>(it.tags||[]).some(t=>lc(t)===lc(v))).length;
    if(!confirm(`Delete the tag “${v}”${n?` from ${n} paper(s)`:""}?`)) return;
    DOC.vocab.tags = (DOC.vocab.tags||[]).filter(t=>lc(t.name)!==lc(v));
    DOC.items.forEach(it=>{ it.tags = (it.tags||[]).filter(t=>lc(t)!==lc(v)); });
    if(armed===v) armed = null;
    markDirty(); renderBoard(); renderPaintbar(); renderCounts();
    return;
  }
  const c = e.target.closest(".chip");
  if(!c) return;
  const v = c.dataset.val;
  // Filtering -> in / out of the filter. Rows selected -> tag them. Otherwise
  // -> arm for painting.
  if(filtering){
    TAGF.has(v) ? TAGF.delete(v) : TAGF.add(v);
    applyFilter(); renderPaintbar();
    return;
  }
  if(SEL.size){ toggleTagOnSelection(v); return; }
  armed = (armed===v) ? null : v;
  renderPaintbar();
});
// ---- rearranging the tag bar ----------------------------------------------
// Drag a chip along the bar and it stays where you put it : the bar's order is
// DOC.vocab.tags ( see tagOptions / reorderTags ), so tags you want read
// together -- the modalities, then your own judgements -- can be grouped, and
// the grouping is the board's rather than this browser's.
//
// A drag that never moves isn't a drag : the browser fires no dragstart, the
// click lands as usual, and a chip still arms / filters / tags exactly as before.
let dragTag = null;
function clearTagMarks(){ $$("#tagchips .chip").forEach(c=>c.classList.remove("dropL","dropR","tdrag")); }
$("#tagchips").addEventListener("dragstart", e=>{
  const c = e.target.closest(".chip");
  if(!c){ return; }
  dragTag = c.dataset.val;
  c.classList.add("tdrag");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragTag); } catch(err){}
});
$("#tagchips").addEventListener("dragover", e=>{
  if(dragTag == null) return;
  e.preventDefault(); e.stopPropagation();
  $$("#tagchips .chip").forEach(c=>c.classList.remove("dropL","dropR"));
  const c = e.target.closest(".chip");
  if(!c || lc(c.dataset.val) === lc(dragTag)) return;
  const r = c.getBoundingClientRect();
  c.classList.add((e.clientX - r.left) > r.width/2 ? "dropR" : "dropL");
});
$("#tagchips").addEventListener("drop", e=>{
  if(dragTag == null) return;
  e.preventDefault(); e.stopPropagation();
  const c = e.target.closest(".chip");
  let onto = null, before = false;
  if(c && lc(c.dataset.val) !== lc(dragTag)){
    const r = c.getBoundingClientRect();
    onto = c.dataset.val;
    before = (e.clientX - r.left) <= r.width/2;
  }
  const what = dragTag;
  dragTag = null;
  clearTagMarks();
  reorderTags(what, onto, before);        // no target -> the end of the bar
});
document.addEventListener("dragend", ()=>{ dragTag = null; clearTagMarks(); });

$("#tagchips").addEventListener("keydown", e=>{
  if(e.target.id!=="newtag" || e.key!=="Enter") return;
  const v = e.target.value.trim();
  if(!v) return;
  rememberTag(v);          // saved with the document, so it's here after a restart
  markDirty();
  if(SEL.size){
    // A brand-new tag with rows selected goes straight onto them.
    toggleTagOnSelection(v);
  } else {
    armed = v;
    renderPaintbar(); renderCounts();
    toast(`Painting “${v}” — click papers to tag them`);
  }
  const nt = $("#newtag"); if(nt){ nt.value=""; nt.focus(); }
});

// Every tag, its colour, and how many papers carry it. The swatch writes into
// the DOCUMENT, so the colour follows the board to every browser you open it in.
function tagEditor(){
  const rows = tagOptions().sort(byName).map(v=>{
    const n = DOC.items.filter(it=>hasTag(it,v)).length;
    return `<div class="tagrow">`+
      `<input type="color" data-tagcolor="${esc(v)}" value="${esc(colorOf(v))}" title="Pick a colour">`+
      `<span class="chip" ${chipStyle(v)}>${esc(v)}</span>`+
      `<span class="grow"></span>`+
      `<span class="cnt">${n} paper${n===1?"":"s"}${isVocab(v)?" · modality":""}</span>`+
      `<button data-tagact="auto" data-tag="${esc(v)}" title="Back to the colour picked from its name">auto</button>`+
    `</div>`;
  }).join("");
  sheet(`<h3>Tag colours</h3>
    <p>Chips are drawn in these colours everywhere on the board. A new tag takes the
       next unused one by itself — this is only for when you want a different one.</p>
    ${rows || `<p>No tags yet.</p>`}
    <div class="btns"><button data-act="ok">Done</button></div>`);
}
function setTagColor(name, color){
  const e = vocabEntry(name);
  if(e) e.color = color;
  else DOC.vocab.tags.push({ name, color });
  markDirty(); renderBoard(); renderPaintbar();
}

// Two filters, ANDed : the text box, and the set of tags picked in the tag bar
// ( 🔎 Filter ). A row hidden by either drops out of the selection too, so the
// chips never tag a paper you can't see.
function matchesTags(it){
  if(!TAGF.size) return true;
  const have = (it.tags||[]).map(lc);
  const want = Array.from(TAGF).map(lc);
  return filterAll ? want.every(w=>have.includes(w)) : want.some(w=>have.includes(w));
}
function applyFilter(){
  const q = lc($("#filter").value.trim());
  let shown = 0, pruned = false;
  $$(".row").forEach(row=>{
    const f = findItem(row.dataset.key);
    if(!f) return;
    const hay = q ? lc([ f.it.title, f.it.key, f.it.doi, (f.it.tags||[]).join(" "),
      Object.values(f.it.fields||{}).join(" ") ].join(" ")) : "";
    const hide = (q && !hay.includes(q)) || !matchesTags(f.it);
    row.classList.toggle("hide", hide);
    if(hide){ if(SEL.delete(row.dataset.key)) pruned = true; }
    else shown++;
  });
  if(pruned) paintSelection();
  renderNote(shown);
}
// 🔎 : the tag bar stops being a brush and becomes a filter. Turning it off

// One-shot reorder. It rewrites the list once and hands it straight back to you
// -- nothing keeps re-sorting behind your back.
$("#orderby").addEventListener("change", ()=>{
  const how = $("#orderby").value;
  $("#orderby").value = "";
  if(!how || !DOC.items.length) return;
  const before = DOC.items.slice();
  const by = {
    year:     (a,b)=>(b.year||0)-(a.year||0),
    year_asc: (a,b)=>(a.year||9999)-(b.year||9999),
    cites:    (a,b)=>((META[b.key]||{}).cited_by||0)-((META[a.key]||{}).cited_by||0),
    title:    (a,b)=>lc(a.title||a.key).localeCompare(lc(b.title||b.key)),
    added:    (a,b)=>String(a.added_at||"").localeCompare(String(b.added_at||"")),
  }[how];
  if(how === "tags"){
    // Group papers carrying the same tags together, keeping each group in the
    // order you already put it in, and groups in the order they first appear.
    const order = [], groups = new Map();
    DOC.items.forEach(it=>{
      const sig = tagSig(it) || "~";     // untagged sorts last
      if(!groups.has(sig)){ groups.set(sig, []); order.push(sig); }
      groups.get(sig).push(it);
    });
    order.sort((a,b)=> (a==="~") - (b==="~") );
    DOC.items = order.flatMap(sig=>groups.get(sig));
  } else DOC.items.sort(by);
  markDirty(); renderBoard();
  toast(`Reordered by ${how.replace("_"," ")}`, 5000, "Undo", ()=>{
    DOC.items = before; markDirty(); renderBoard();
  });
});
