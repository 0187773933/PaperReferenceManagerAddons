<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prma sort</title>
<!-- The chrome every prma page shares : the pre-paint theme restore ( so nothing
     flashes ) , then the palette and the header / button / link styling. The
     <style> below loads after and wins wherever it redefines something. -->
<script src="/static/boot.js"></script>
<link rel="stylesheet" href="/static/common.css">
<style>
  /* The palette and the base header / button / .navlink chrome are in
     /static/common.css. What is left here is where this board differs from it :
     a tighter header that has to sit above the drag layer , smaller buttons ,
     and everything below that is the board's own. */
  header { z-index:20; padding:8px 16px; }
  .titlebar { gap:12px; }
  .counts { gap:12px; }
  button { padding:6px 11px; }
  button.on { border-color:var(--accent); color:var(--accent); }
  .navlink { padding:6px 11px; }
  /* The save stamp, in the action row after 🆕 Recently added rather than in the
     pinned bar, where it pushed the bar onto a second line. Wide enough for
     "saved <date> <time>" , so flipping to "unsaved…" and back doesn't slide
     the filter box along every time you type. */
  .savestate { font-size:12px; color:var(--muted); min-width:150px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .savestate.dirty { color:var(--warn); }
  /* Getting around a long list, in the pinned bar so it's in reach from
     anywhere down it : ⚓ Anchor, ⤓ To anchor, Jump to, ↑ Top, ↓ Bottom. Its auto margin is what
     keeps ↶ ↷ ? 🌙 over on the right. */
  .jumpctl { display:flex; gap:8px; align-items:center; margin-right:auto; }
  #jumpto { width:88px; padding:6px 9px; font-size:13px; }
  /* The pinned bar is ONE row, however narrow the window -- a second row is a
     row less of the board, on every screen, all the way down the list. So it
     never wraps : when everything won't fit it gives things up, in this order,
     until the row does ( see fitBar ) :
       .fit1  the room between and inside its buttons
       .fit2  the words on the anchor and jump buttons ( the arrows stay, the
              tooltips say the rest ) , and every count but the papers
       .fit3  the page title, and the glyphs on the links to the other pages
       .fit4  their words instead ( glyphs back -- ✎ Review and ✎ Missing
              only look alike this far down )
     and only past all four -- a phone -- does it wrap after all. Nothing in
     it shrinks or wraps its own text, so "doesn't fit" is something fitBar
     can measure. */
  .titlebar { flex-wrap:nowrap; }
  .titlebar > *, .titlebar :is(.navlinks, .jumpctl, .counts) > * { flex-shrink:0; }
  .titlebar :is(.navlinks, .counts) { flex-wrap:nowrap; }
  .titlebar :is(button, .navlink, .counts span) { white-space:nowrap; }
  .titlebar.fit1 { gap:6px; }
  .titlebar.fit1 :is(.navlinks, .jumpctl, .counts) { gap:5px; }
  .titlebar.fit1 :is(button, .navlink) { padding:6px 7px; }
  .titlebar.fit2 .jumpctl .w, .titlebar.fit2 .counts > span:not(:first-child) { display:none; }
  .titlebar.fit2 #listbtn { max-width:140px; }
  .titlebar.fit3 h1, .titlebar.fit3:not(.fit4) .navlinks .g, .titlebar.fit4 .navlinks .w { display:none; }
  .titlebar.fitwrap { flex-wrap:wrap; }

  /* #tools : everything the bar doesn't pin. In its place under the bar it's
     part of the page and scrolls away with the list ; .float drops it down over
     the list from the bar instead, while its slot holds its place. */
  #tools { background:var(--panel); border-bottom:1px solid var(--line); padding:9px 16px 10px; }
  #tools.float {
    position:fixed; top:var(--headh); left:0; right:0; z-index:19;
    box-shadow:0 14px 34px rgba(0,0,0,.30); animation:toolsin .12s ease-out;
  }
  #tools.float .paintbar { max-height:34vh; overflow-y:auto; }
  @keyframes toolsin { from { opacity:0; transform:translateY(-6px); } }
  /* The other pages, in the pinned bar : its own flex row so the six of them
     wrap together as a block rather than one at a time into the counts. */
  .navlinks { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .actionrow { display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; }

  .toolbar { display:flex; gap:10px; align-items:flex-start; margin-top:9px; flex-wrap:wrap; }
  /* The select and the filter box in the action row sit in a line of BUTTONS,
     so they take a button's height rather than the search row's taller one --
     otherwise either one of them sets the height of the whole row. */
  .actionrow select { padding:6px 8px; }
  .actionrow input[type=search] { padding:6px 10px; font-size:13px; }
  .searchwrap { position:relative; flex:1; min-width:320px; }
  input[type=search], input[type=text] {
    width:100%; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px;
  }
  input[type=search]:focus, input[type=text]:focus { outline:none; border-color:var(--accent); }
  select { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 9px; font-size:13px; }
  .results {
    display:none; position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:40;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    max-height:56vh; overflow:auto; box-shadow:0 12px 34px rgba(0,0,0,.30);
  }
  .results.show { display:block; }
  .hit { display:flex; gap:10px; align-items:flex-start; padding:8px 11px; border-bottom:1px solid var(--line); cursor:grab; }
  .hit:last-child { border-bottom:none; }
  .hit.sel { background:var(--panel2); }
  .hit .ht { font-weight:500; }
  .hit .hm { color:var(--muted); font-size:12px; margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .hit .in { flex:none; color:var(--green); font-size:12px; white-space:nowrap; padding-top:3px; }
  /* What a hit can be done with, kept together on the right : the position box
     and the button that uses it. */
  .hit .acts { flex:none; display:flex; gap:6px; align-items:flex-start; }
  .hit .at {
    width:46px; text-align:center; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:7px; padding:6px 4px;
    font:13px/1.2 inherit; font-variant-numeric:tabular-nums;
  }
  .hit .at::placeholder { color:var(--muted); }
  .hit .at:focus { outline:none; border-color:var(--accent); background:var(--panel); }
  .rhint { padding:7px 11px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
  /* "show 25 · 50" in the recently-added hint line -- how many of them to ask
     for, put where it costs the ( already full ) toolbar row nothing. */
  .rhint a { color:var(--accent); text-decoration:none; }
  .rhint a:hover { text-decoration:underline; }
  /* A recently-added paper the dashboard index has never seen : addable, but
     nothing has read it yet, so it comes in bare. */
  .hit .nyet { color:var(--warn); white-space:nowrap; }

  .paintbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:9px; }
  .pblabel { color:var(--muted); font-size:12px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  /* The bar's own controls, trailing the chips as one more item in their flow
     so they take whatever is left of the last chip line instead of a line of
     their own. Held together so a wrap never splits the label off its buttons. */
  .pbctl { display:inline-flex; gap:7px; align-items:center; margin-left:5px; }
  .chip {
    display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:2px 8px;
    border-radius:11px; background:var(--chip); color:var(--fg); border:1px solid transparent;
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .chip:hover { filter:brightness(.96); }
  /* Every chip is drawn in ITS TAG'S colour ( see colorOf ) , so a row's
     modalities read as a pattern rather than as words you have to parse. The
     states below are outlines, not fills, so the colour survives them :
       .on   armed for painting · every selected row has it · in the filter
       .half only some of the selected rows have it */
  .chip.on   { outline:2px solid var(--accent); outline-offset:1px; font-weight:600; }
  .chip.half { outline:2px dashed var(--accent); outline-offset:1px; }
  .chip .x { color:inherit; opacity:.5; font-size:11px; cursor:pointer; }
  .chip .x:hover { opacity:1; color:#8b1a1a; }
  .chip .n { opacity:.55; font-size:11px; }
  .chip.ghost { background:transparent; border:1px dashed var(--line); color:var(--muted); }
  .pbtn { padding:3px 9px; font-size:12px; line-height:1.35; }
  .pbtn.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  /* Dragging a chip along the bar reorders the bar ( see reorderTags ) : the
     order is the document's, so a group you build here is there tomorrow. */
  .chips .chip[draggable="true"] { cursor:grab; }
  .chips .chip.tdrag { opacity:.35; }
  .chips .chip.dropL { box-shadow:-3px 0 0 var(--accent); }
  .chips .chip.dropR { box-shadow:3px 0 0 var(--accent); }
  /* the colour editor ( 🎨 Colors ) */
  .tagrow { display:flex; align-items:center; gap:9px; padding:4px 0; border-bottom:1px solid var(--line); }
  .tagrow:last-child { border-bottom:none; }
  .tagrow input[type=color] { width:30px; height:24px; padding:0; border:1px solid var(--line); border-radius:5px; background:none; cursor:pointer; }
  .tagrow .grow { flex:1; }
  .tagrow .cnt { color:var(--muted); font-size:12px; white-space:nowrap; }
  .tagrow button { padding:2px 7px; font-size:11px; }
  .newtag { width:120px !important; padding:3px 8px !important; font-size:12px !important; border-radius:11px !important; }
  body.painting .row { cursor:crosshair; }

  main { padding:12px 16px 140px; }
  .colhead, .row { display:grid; grid-template-columns:var(--grid); align-items:stretch; }
  /* The board is never narrower than the sum of its columns' minimums ( --gridmin ,
     see gridTemplate ) : past the edge of the window it scrolls sideways instead
     of squeezing, which is what the folded columns need when they're out. The
     head and the board are two scrollers kept in step ( see syncX ), and the
     head -- sticky, so always in reach -- is the one with the scrollbar. */
  .colwrap {
    position:sticky; top:var(--headh,132px); z-index:9; background:var(--bg);
    overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .boardwrap { overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
  .boardwrap::-webkit-scrollbar { display:none; }
  .colhead {
    min-width:calc(var(--gridmin,0px) + 2px); background:var(--bg);
    color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    border-bottom:1px solid var(--line); padding:4px 0;
  }
  .colhead > div { padding:2px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .colhead .colname { cursor:pointer; }
  /* `clip`, not `hidden` : a `hidden` box is a scroll container, and the frozen
     columns below would stick to it ( which never scrolls ) instead of to
     .boardwrap ( which does ). */
  #board { border:1px solid var(--line); border-radius:10px; overflow:clip; background:var(--panel); margin-top:2px;
           min-width:calc(var(--gridmin,0px) + 2px); }
  /* With the folded columns out, the number and the paper stay put while the
     rest scrolls under them -- a Methods summary is no use without the title it
     belongs to. */
  :root[data-fold] .row > .c:nth-child(-n+2),
  :root[data-fold] .colhead > div:nth-child(-n+2) { position:sticky; z-index:2; background:inherit; }
  :root[data-fold] .row > .c:nth-child(1), :root[data-fold] .colhead > div:nth-child(1) { left:0; }
  :root[data-fold] .row > .c:nth-child(2), :root[data-fold] .colhead > div:nth-child(2) { left:52px; }
  #board.dropinto { box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
  .row { border-bottom:1px solid var(--line); background:var(--row); }
  .row:last-child { border-bottom:none; }
  .row:hover { background:var(--panel2); }
  .row.dragging { opacity:.4; }
  .row.drop-before { box-shadow:inset 0 2px 0 var(--accent); }
  .row.drop-after  { box-shadow:inset 0 -2px 0 var(--accent); }
  .row.selected { background:color-mix(in srgb, var(--accent) 9%, var(--row)); }
  .row.selected .c:first-child { box-shadow:inset 3px 0 0 var(--accent); }
  .row.selected .c { border-top:1px solid var(--accent); border-bottom:1px solid var(--accent); }
  .row.flash { animation:flash 1.1s ease-out; }
  @keyframes flash { from { background:color-mix(in srgb, var(--accent) 26%, transparent); } }
  .row.hide { display:none; }
  .c { padding:7px 8px; min-width:0; border-right:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .c:last-child { border-right:none; }
  /* The row's position : type a number in to send it there, or grab the grip
     underneath and drag it. */
  .numc { text-align:center; padding:7px 4px; }
  .numin {
    width:38px; text-align:center; background:transparent; border:1px solid transparent;
    color:var(--fg); border-radius:6px; padding:2px 3px; font:600 13px/1.2 inherit;
    font-variant-numeric:tabular-nums;
  }
  .numin:hover { border-color:var(--line); }
  .numin:focus { outline:none; border-color:var(--accent); background:var(--panel2); }
  .numc .grip { display:block; cursor:grab; font-size:11px; color:var(--muted); opacity:.6; user-select:none; }
  .numc .grip:hover { opacity:1; color:var(--accent); }
  .numc .grip:active { cursor:grabbing; }
  /* The ⚓ on the row ⤓ To anchor brings you back to -- this browser's, not the board's. */
  .numc .anchormark { display:none; font-size:11px; line-height:1.3; color:var(--accent); user-select:none; }
  .row.anchored .numc .anchormark { display:block; }
  /* The title is TEXT, not a link : as a link it took the browser's visited
     colour the moment you opened the paper from any other prma page, so half
     the board turned gold for reasons that had nothing to do with the board.
     The link strip underneath is how you open it. */
  .titlec .tt { font-weight:500; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .links { margin-top:3px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:8px; font-size:12px; white-space:nowrap; }
  .links a:hover { text-decoration:underline; }
  .loose { color:var(--warn); font-size:11px; }
  .cellchips { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .chipin {
    width:52px; min-width:52px; background:transparent; border:1px dashed var(--line);
    color:var(--fg); border-radius:11px; padding:2px 7px; font-size:12px;
  }
  .chipin:focus { outline:none; width:120px; min-width:120px; border-style:solid; border-color:var(--accent); }
  /* A free-text cell is the box plus -- when its text has a URL in it -- a copy
     of that text laid exactly over the box with the links live ( see cellHtml ).
     The two have to agree on every metric that decides where a character lands,
     which is why the overlay repeats the border + padding as one padding and
     wraps the same way. */
  /* A cell fills its row. The box used to be a flat 44px however tall the row
     was, so a Code cell with three links sat scrunched into a scrollbar beside
     a title that had taken the row to twice that. The grid already stretches
     the CELL to the row's height ( .row is align-items:stretch ) ; these pass
     that height down to the box inside it, and so to the copy of its text laid
     over the box. The shelf stretches only its note cells -- the rest of a
     staged row is deliberately top-aligned.

     44px stays the floor for a short row, and dragging the corner still works:
     a dragged height is an inline one, and stretching only applies while the
     height is auto. */
  .notecell { display:flex; }
  .srow > .notecell { align-self:stretch; }
  .cellbox { position:relative; flex:1; min-width:0; display:flex; }
  .cellbox > textarea { display:block; flex:1; }
  /* The cell font, said ONCE for the box and for the copy of its text laid over
     it : the two have to agree on every metric that decides where a character
     lands, or the same string wraps in two different places.

     Monospace because that is what the board has always drawn these in -- the
     rule below used to read ` font:13px/1.4 inherit ` , which is not valid CSS
     ( the shorthand takes no ` inherit ` family ) , so the whole declaration was
     thrown away and the textarea kept the browser's own monospace default.
     Spelled out properly now, and shared, so the two copies can't drift. */
  .notecell textarea, .cellbox .lnk {
    font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  .notecell textarea {
    width:100%; min-height:44px; resize:vertical; background:transparent; color:var(--fg);
    border:1px solid transparent; border-radius:6px; padding:4px 6px;
  }
  .notecell textarea:hover { border-color:var(--line); }
  .notecell textarea:focus { outline:none; border-color:var(--accent); background:var(--panel2); min-height:110px; }
  .cellbox .lnk {
    /* inset:0 over .cellbox , whose box IS the textarea's : 5px / 7px of padding
       here is the textarea's 1px border plus its 4px / 6px. */
    position:absolute; inset:0; overflow:hidden; padding:5px 7px; color:var(--fg);
    white-space:pre-wrap; overflow-wrap:break-word;
    /* The mouse goes straight through to the box underneath -- so a click on
       the words still puts the caret where you clicked -- and is caught only by
       the links themselves. */
    pointer-events:none; user-select:none;
  }
  .cellbox .lnk a { pointer-events:auto; color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
  .cellbox .lnk a:hover { color:var(--fg); background:color-mix(in srgb, var(--accent) 18%, transparent); }
  /* Unfocused, the box's own text is invisible and what you read is the overlay.
     Focus gives the text back and takes the overlay away -- except on a locked
     board, where there is no editing to make room for and the links stay live. */
  /* At rest the box's own text is invisible and what you read is the overlay ;
     .editing ( the caret is in this box -- see the focusin pair below the
     script's cell section ) gives the text back and takes the overlay away. A
     class rather than :focus because :focus stops matching the moment the
     WINDOW loses focus, which would drop the overlay back over a box you are
     still typing in the instant you glanced at another app. A locked board
     never gets the class, so there the links simply stay live.

     The scrollbar goes with it : inside the box it would narrow the text by its
     own width, and the same string would then wrap in two different places. */
  .cellbox.linked:not(.editing) > textarea { color:transparent; caret-color:var(--fg); scrollbar-width:none; }
  .cellbox.linked:not(.editing) > textarea::-webkit-scrollbar { display:none; }
  .cellbox.linked.editing > .lnk { visibility:hidden; }
  .rowtools { display:flex; gap:5px; align-items:flex-start; justify-content:flex-end; }
  .delbtn { padding:2px 8px; font-size:13px; color:var(--muted); }
  .delbtn:hover { color:#fff; background:#c0392b; border-color:#c0392b; }
  .empty { color:var(--muted); padding:34px; text-align:center; }

  #acpop {
    display:none; position:absolute; z-index:80; min-width:170px; max-height:220px; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.32); padding:4px;
  }
  #acpop.show { display:block; }
  .acopt { padding:5px 9px; border-radius:6px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .acopt.sel, .acopt:hover { background:var(--panel2); color:var(--accent); }
  .acnew { color:var(--muted); font-size:11px; padding:4px 9px; }

  /* ---- the staging shelf : imported references, not on the list yet ---- */
  #stage { display:none; margin-bottom:13px; border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  #stage.show { display:block; }
  .stagehead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 11px; background:var(--panel2); border-bottom:1px solid var(--line); }
  .stagehead b { font-size:13px; }
  .stagehead .hint { color:var(--muted); font-size:12px; }
  .stagehead button { padding:3px 9px; font-size:12px; }
  .stagetagin { width:118px !important; padding:3px 9px !important; font-size:12px !important; border-radius:11px !important; }
  .srows { max-height:54vh; overflow:auto; }
  /* Same shape as a board row -- checkbox, paper, tags, one cell per free-text
     column, tools -- so a staged row is the row it is about to become, notes
     and all ( --sgrid , set by renderStage ). */
  .srow { display:grid; grid-template-columns:var(--sgrid); gap:9px; align-items:start; padding:7px 11px; border-bottom:1px solid var(--line);
          min-width:var(--sgridmin,0px); }
  .srow:last-child { border-bottom:none; }
  .srow:hover { background:var(--panel2); }
  .srow .pick { margin-top:7px; }
  .stitle { width:100%; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--fg); font:500 14px/1.4 inherit; padding:3px 5px; }
  .stitle:hover { border-color:var(--line); }
  .stitle:focus { outline:none; border-color:var(--accent); background:var(--panel2); }
  .sauth { color:var(--muted); font-size:12px; padding:1px 6px 0; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .srow .links { padding-left:6px; }
  .stools { display:flex; gap:5px; justify-content:flex-end; }
  .stools button { padding:2px 8px; font-size:12px; }
  .badge { font-size:11px; border-radius:9px; padding:1px 7px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .badge.have { color:var(--green); font-weight:600; }
  .badge.fuzzy { color:var(--warn); }

  #overlay { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.45); align-items:center; justify-content:center; }
  #overlay.show { display:flex; }
  .sheet { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; max-width:580px; width:calc(100% - 40px); max-height:80vh; overflow:auto; }
  .sheet.wide { max-width:860px; }
  .sheet textarea {
    width:100%; min-height:200px; resize:vertical; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:8px; padding:9px 11px;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .sheet textarea:focus { outline:none; border-color:var(--accent); }
  .drop { border:1px dashed var(--line); border-radius:8px; padding:11px; text-align:center; color:var(--muted); font-size:12px; margin-top:10px; }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  .sheet h3 { margin:0 0 10px; font-size:15px; }
  .sheet p { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .sheet .btns { display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; margin-top:14px; }

  /* Looking at the list in someone else's order ( see VIEW ). There is no
     honest place a drop could land -- the row would not stay where you let go
     of it -- so the grips go, and the number box is how you move a paper from
     inside a lens. */
  :root[data-view] .numc .grip { display:none !important; }

  /* ---- view-only mode ------------------------------------------------------
     The latch is the SERVER's ( src/db/boardlock.py ) and the same answer for
     every browser, so this is what the board looks like to EVERYONE while it is
     on. Anything that would change the board goes away rather than greying out
     -- a row you can't reorder shouldn't still be offering you a grip -- and

  #lockstate {

    border:1px solid var(--warn); border-radius:7px; padding:5px 10px; white-space:nowrap;
  }
  :root[data-locked] #lockstate { display:inline-block; }
  :root[data-locked] .numc .grip,
  :root[data-locked] .delbtn,
  :root[data-locked] .chipin,
  :root[data-locked] .chip .x,
  :root[data-locked] .srow .pick,
  :root[data-locked] .stools,
  :root[data-locked] .stagehead button { display:none !important; }
  /* The text boxes STAY -- a note is worth reading, and a title worth copying --
     they just stop looking like somewhere you can type. ( `readonly`, not
     `disabled` : disabled text greys out and can't be selected. ) */
  :root[data-locked] .numin { pointer-events:none; }
  :root[data-locked] .numin:hover,
  :root[data-locked] .notecell textarea:hover,
  :root[data-locked] .stitle:hover { border-color:transparent; }
  :root[data-locked] .colhead .colname,
  :root[data-locked] .row,
  :root[data-locked] .hit { cursor:default; }
  :root[data-locked] .tagrow input[type=color],
  :root[data-locked] .tagrow button { pointer-events:none; opacity:.45; }

  /* 🔎 Filter on "none" : the picked tags are the ones a paper must NOT carry. */
  #tagchips.nonef .chip.on { text-decoration:line-through; }

  /* ---- the lists ------------------------------------------------------------
     /sort is the main list ; /sort/<slug> are the others ( src/db/sortlists.py ).

  .listctl { position:relative; }

  #listpop a.lpitem:hover { background:var(--panel2); color:var(--accent); }

<!-- The header is two parts ( see the "header" section of the script ). The bar

     tags and the board itself are what the page is for. So the nav links ride
     in the pinned bar -- it had a whole window's worth of space doing

      <a class="navlink" href="/code" title="Every paper ` prma code ` found a repo for , with a column for each board that holds it — sortable , filterable , exportable to xlsx"><span class="g">{ }</span><span class="w"> Code</span></a>
      <a class="navlink" href="/datasets" title="The public data every paper stands on — the archives it links and the collections it only names"><span class="g">⛁</span><span class="w"> Datasets</span></a>

      <button id="anchorbtn" title="Select a row, then click here to drop the anchor on it" disabled>⚓<span class="w"> Anchor</span></button>

<div id="toolslot"><div id="tools">
  <!-- Everything that happens TO the board : what comes in, what goes out, the
