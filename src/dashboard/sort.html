async function loadSource(v){
  const st = IM;
  if(!st) return;
  const ticket = ++st.ticket;
  Object.assign(st, { src:v, rows:[], vocab:[], colors:{}, sdoc:null, sel:new Set(), anchor:null, tags:new Set() });
  $("#imfl").style.display = v === "@rest" ? "none" : "";
  $("#imtags").innerHTML = "";
  drawImport("Loading…");
  if(v === "@rest"){
    $("#imstat").textContent = "reading your library — the first time takes a few seconds…";
    let d;
    try { d = await (await fetch(`/api/sort/remaining?list=${encodeURIComponent(LIST)}&mods=1`)).json(); }
    catch(e){ d = { ok:false, error:"the server isn't answering" }; }
    if(IM !== st || st.ticket !== ticket) return;
    if(!d.ok){
      // The index the library is read from builds lazily -- wait for it.
      if(d.status && d.status !== "error"){
        $("#imstat").textContent = `the library index is ${d.status}${d.message?` — ${d.message}`:""} … still waiting`;
        setTimeout(()=>{ if(IM === st && st.ticket === ticket) loadSource(v); }, 3000);
      } else $("#imstat").textContent = d.error || "the library couldn't be read";
      drawImport(" ");
      return;
    }
    st.rows = d.rows.map((r,i)=>({ pos:i+1, it:Object.assign({}, r, { tags:(r.mods||[]).slice() }) }));
    const used = new Set(st.rows.flatMap(({it})=>it.tags.map(lc)));
    st.vocab = VOCAB.filter(t=>used.has(lc(t)));
    st.rows.forEach(({it})=>it.tags.forEach(t=>{ if(!st.vocab.some(x=>lc(x)===lc(t))) st.vocab.push(t); }));
    $("#imstat").textContent = `${d.rows.length} of the ${d.library} papers in your library aren't on this list — `+
      `newest added first, tagged by their Methods stamp`;
  } else {
    const l = LISTS.find(x=>x.slug===v);
    let d;
    try { d = await (await fetch(l.api)).json(); } catch(e){ d = null; }
    if(IM !== st || st.ticket !== ticket) return;
    if(!d || !d.doc){ $("#imstat").textContent = "that list couldn't be read"; drawImport(" "); return; }
    st.sdoc = d.doc;
    st.rows = (d.doc.items||[]).map((it,i)=>({ pos:i+1, it }));
    (d.doc.vocab.tags||[]).forEach(t=>{ st.vocab.push(t.name); st.colors[lc(t.name)] = t.color || ""; });
    st.rows.forEach(({it})=>(it.tags||[]).forEach(t=>{ if(!st.vocab.some(x=>lc(x)===lc(t))) st.vocab.push(t); }));
    $("#imstat").textContent = `${st.rows.length} paper(s), numbered as they are on “${l.name}”`;
  }
  drawImTags(); drawImport();
}
// A chip in the source's own colour where it has one, else in this board's.
const imColor = t => { const c = IM && IM.colors[lc(t)]; return isHex(c) ? reskin(c) : colorOf(t); };
function drawImTags(){
  const st = IM, n = {};
  st.rows.forEach(({it})=>(it.tags||[]).forEach(t=>{ n[lc(t)] = (n[lc(t)]||0) + 1; }));
  $("#imtags").innerHTML = st.vocab.filter(t=>n[lc(t)]).map(t=>
    `<span class="chip${st.tags.has(t)?" on":""}" data-t="${esc(t)}" `+
    `style="background:${imColor(t)};color:${TAGFG};border-color:transparent" title="Papers tagged ${esc(t)} — in or out, as any / all / none says">`+
    `${esc(t)}<span class="n">${n[lc(t)]}</span></span>`).join("") ||
    `<span class="imstat">no tags on these papers</span>`;
}
const imYear = v => { const n = parseInt(String(v==null?"":v).trim(), 10); return isNaN(n) ? null : n; };
// Already on this list ( or its shelf ) -- by key, DOI or title, the way a
// pasted bibliography is checked ( haveIndex ).
const imHere = (it, st = IM) => !!(st.have.get(lc(it.key)) || (it.doi && st.have.get("doi:"+lc(it.doi)))
  || (ntitle(it.title) && st.have.get("t:"+ntitle(it.title))));
// The filters, as src/db/sortops.py :: pick_rows reads them.
function imFilter(){
  const st = IM, y0 = imYear($("#imy0").value), y1 = imYear($("#imy1").value), q = $("#imq").value.trim();
  const noYear = (y0 == null && y1 == null) || $("#imny").checked;
  const want = Array.from(st.tags).map(lc);
  return st.rows.filter(({it})=>{
    if(!tagMatch(it.tags, want, st.mode)) return false;
    const y = imYear(it.year);
    if(y == null){ if(!noYear) return false; }
    else if((y0 != null && y < y0) || (y1 != null && y > y1)) return false;
    if(q && !textHas([ it.title, it.key, it.doi, (it.tags||[]).join(" "),
      Object.values(it.fields||{}).join(" ") ].join(" "), q)) return false;
    return true;
  });
}
const imLive = (st = IM) => st.shown.filter(({it})=>!imHere(it, st));
// What Import takes : the selected rows the filter still shows -- or, with
// nothing selected, everything it shows.
const imPick = (st = IM) => st.sel.size ? imLive(st).filter(({it})=>st.sel.has(it.key)) : imLive(st);
const IMCAP = 3000;
function drawImport(msg){
  const st = IM;

          `<span class="iy">${esc(it.year||"")}</span></div>`;
      }).join("") + (st.shown.length > IMCAP
        ? `<div class="empty">… and ${st.shown.length - IMCAP} more not drawn — narrow the filter to see them ; with nothing selected they are still imported</div>` : "")
    : `<div class="empty">Nothing on it matches.</div>`;

function paintImSel(){
  $$("#imrows .imr").forEach(r=>{
    if(r.classList.contains("have")) return;
    const on = IM.sel.has(r.dataset.k);
    r.classList.toggle("on", on);
    r.firstElementChild.checked = on;

function imCount(){
  const st = IM;
  if(!st) return;
  const pick = imPick(), here = st.shown.length - imLive().length;
  $("#imcount").textContent = `${st.shown.length} shown`+(st.sel.size ? ` · ${pick.length} selected` : "")+
    (here ? ` · ${here} already here` : "");

    : st.sel.size ? `Import ${pick.length} selected` : `Import all ${pick.length} shown`;

// The board's own selection rules ( selectRow ) : a click picks one, ⌘ / ctrl
// adds or drops one, ⇧ takes the run from the last one clicked. The checkbox is
// the ⌘-click for whoever doesn't know about ⌘.
function imClick(e){
  const r = e.target.closest(".imr");
  if(!r || r.classList.contains("have")) return;
  const st = IM, k = r.dataset.k;
  const keys = imLive().map(({it})=>it.key);
  if(e.shiftKey && st.anchor && keys.includes(st.anchor) && keys.includes(k)){
    const a = keys.indexOf(st.anchor), b = keys.indexOf(k);
    for(let i=Math.min(a,b); i<=Math.max(a,b); i++) st.sel.add(keys[i]);
  } else if(e.metaKey || e.ctrlKey || e.target.type === "checkbox"){
    st.sel.has(k) ? st.sel.delete(k) : st.sel.add(k);
    st.anchor = k;
  } else {
    const only = st.sel.size === 1 && st.sel.has(k);
    st.sel = new Set(only ? [] : [k]);
    st.anchor = k;
  }
  paintImSel();
}
// "1-40, 55, 60-70" -> those positions, or null for something that isn't one
// ( src/db/sortops.py :: parse_range ).
function parseRange(spec){
  const out = new Set();
  for(const part of String(spec||"").trim().split(/[,\s]+/)){
    if(!part) continue;
    const m = part.match(/^#?(\d+)(?:[-–](\d+))?$/);
    if(!m) return null;
    let a = +m[1], b = m[2] ? +m[2] : a;
    if(b < a) [a, b] = [b, a];
    if(b - a > 100000) return null;
    for(let i=a; i<=b; i++) out.add(i);
  }
  return out;
}
function imRange(){
  const v = $("#imrange").value.trim();
  if(!v) return;
  const want = parseRange(v);
  if(!want){ toast("Positions look like 1-40, 55, 60-70"); return; }
  IM.sel = new Set(imLive().filter(({pos})=>want.has(pos)).map(({it})=>it.key));
  paintImSel();
}
// Onto the board, as one edit. A row from another list comes as it is there --
// tags in that list's colours, notes and the columns they sit in ( folded if
// they were folded there ) -- less its hand-placed mark, which was about THAT
// order. A remaining paper comes the way a search hit does ( addPaper ) : tagged
// from its Methods stamp, Code and Datasets filled once the lookup lands.
function runImport(st){
  if(guard()) return;
  const pick = imPick(st);
  if(!pick.length) return;
  const how = $("#imat").value, withFields = $("#imfields").checked;
  const before = cloneDoc(DOC);
  const from = st.src === "@rest" ? "Remaining Papers" : `“${(LISTS.find(l=>l.slug===st.src)||{}).name || "the other list"}”`;
  let rows;
  if(st.src === "@rest"){
    rows = pick.map(({it})=>{
      const row = newItem(Object.assign({}, it, { pdf_local:true }));
      row.tags = (it.mods||[]).slice(); sortTags(row);
      row.tags.forEach(rememberTag);
      return row;
    });
  } else {
    const scol = st.sdoc.columns || [], used = new Set();
    rows = pick.map(({it})=>{
      const fields = {};
      if(withFields) Object.entries(it.fields||{}).forEach(([c,v])=>{
        if(v && scol.some(x=>x.id===c)){ fields[c] = v; used.add(c); }
      });
      const row = { key:it.key, title:it.title||"", authors:it.authors||"", doi:it.doi||"", wid:it.wid||"",
        pdf:it.pdf||"", year:it.year||null, journal:it.journal||"", tags:(it.tags||[]).slice(), fields,
        added_at: nowISO() };
      if(it.pending) row.pending = true;
      row.tags.forEach(t=>{
        if(vocabEntry(t)) return;
        const c = st.colors[lc(t)];
        DOC.vocab.tags.push({ name:t, color: isHex(c) ? c : nextColor() });
      });
      return row;
    });
    const fold = new Set((st.sdoc.options||{}).fold_cols||[]);
    scol.forEach(c=>{
      if(!used.has(c.id) || DOC.columns.some(x=>x.id===c.id)) return;
      DOC.columns.push({ id:c.id, label:c.label });
      if(fold.has(c.id)) DOC.options.fold_cols = (DOC.options.fold_cols||[]).concat(c.id);
    });
    rows.forEach(row=>DOC.columns.forEach(c=>{ if(row.fields[c.id] == null) row.fields[c.id] = ""; }));
  }
  if(how === "shelf") DOC.staging = staged().concat(rows);
  else DOC.items.splice(insertIndex(how), 0, ...rows);
  markDirty(); renderAll();
  toast(`Imported ${rows.length} paper(s) from ${from}`+(how === "shelf" ? " onto the staging shelf" : ""), 12000,
    "Undo", ()=>{ DOC = before; markDirty(); renderAll(); toast("Import undone"); });
  const keys = rows.map(r=>r.key);
  if(st.src !== "@rest"){ fetchMeta(keys); return; }
  fetchMeta(keys, true).then(()=>{
    let n = 0;
    rows.forEach(row=>{
      const m = META[row.key];
      if(!row.tags.length && m && m.mods && m.mods.length){ row.tags = m.mods.slice(); sortTags(row); m.mods.forEach(rememberTag); n++; }
      if(prefill(row, m).length) n++;
    });
    if(n){ markDirty(); renderAll(); }
  });
}
