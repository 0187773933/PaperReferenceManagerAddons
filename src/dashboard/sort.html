// ---- CSV ------------------------------------------------------------------
// #, DOI_or_Key, Title, Year, Tags, <columns…>, MD_File. Anything else in an
// imported file becomes its own free-text column, so the hand-made sheets ( and
// the tier page's exports, Tier column and all ) come in without losing
// anything ; Modalities / Section_Tags columns merge into the tag list.
const csvCell = v => {
  const s = (v==null ? "" : String(v));
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
};
function toCSV(){
  const head = [ "#","DOI_or_Key","Title","Year","Tags" ]
    .concat(DOC.columns.map(c=>c.label)).concat([ "MD_File" ]);
  const lines = [ head.map(csvCell).join(",") ];
  DOC.items.forEach((it,i)=>{
    const m = META[it.key] || {};
    lines.push([ i+1, it.key, it.title||m.title||"", it.year||m.year||"", (it.tags||[]).join("; ") ]
      .concat(DOC.columns.map(c=>(it.fields||{})[c.id]||""))
      .concat([ m.has_md ? fileStem(it.key)+".md" : "" ])
      .map(csvCell).join(","));
  });
  return lines.join("\n");
}
$("#exportbtn").addEventListener("click", ()=>{
  const blob = new Blob([ toCSV() ], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `prma-sort-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});
function parseCSV(text){
  const rows = []; let row = [], field = "", q = false, i = 0;
  text = text.replace(/^\uFEFF/, "").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i < text.length){
    const c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ q = true; i++; continue; }
    if(c === ','){ row.push(field); field = ""; i++; continue; }
    if(c === '\n'){ row.push(field); field = ""; rows.push(row); row = []; i++; continue; }
    field += c; i++;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim().length));
}
const H_NUM   = /^#$|^no\.?$|^rank$/i;
const H_KEY   = /^(doi[_ ]?or[_ ]?key|key)$/i, H_DOI = /^doi$/i;
const H_TITLE = /^title$/i, H_YEAR = /^year$/i;
const H_TAGS  = /^(tags?|modalit\w*|section[_ ]?tags?)$/i, H_MD = /^md[_ ]?file$/i;
const splitList = s => String(s||"").split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
function docFromCSV(rows, merge){
  const head = rows[0].map(h=>String(h||"").trim());
  const idx = { key:-1, doi:-1, title:-1, year:-1 };
  const tagCols = [], extra = [];
  head.forEach((h,i)=>{
    if(H_KEY.test(h)) idx.key = i;
    else if(H_DOI.test(h)) idx.doi = i;
    else if(H_TITLE.test(h)) idx.title = i;
    else if(H_YEAR.test(h)) idx.year = i;
    else if(H_TAGS.test(h)) tagCols.push(i);
    else if(H_MD.test(h) || H_NUM.test(h)) { /* derived — not stored */ }
    else if(h) extra.push({ i, id: slug(h,"col"), label: h });
  });
  const doc = merge
    ? JSON.parse(JSON.stringify(DOC))
    : { version:1, updated_at:"", options:{ auto_move: !!DOC.options.auto_move }, columns:[], items:[],
        // "Replace everything" replaces the LIST. The staging shelf is not the
        // list -- it is references you haven't triaged yet -- so it survives ,
        // the same way the tag vocabulary below does.
        staging: JSON.parse(JSON.stringify(DOC.staging||[])) ,
        vocab:{ tags: JSON.parse(JSON.stringify(DOC.vocab.tags||[])) } };
  extra.forEach(x=>{ if(!doc.columns.some(c=>c.id===x.id)) doc.columns.push({ id:x.id, label:x.label }); });
  if(!doc.columns.length) doc.columns.push({ id:"notes", label:"Notes" });
  let added = 0, updated = 0;
  rows.slice(1).forEach(r=>{
    const cell = i => (i>=0 && i<r.length) ? String(r[i]).trim() : "";
    const title = cell(idx.title);
    const key   = cell(idx.key) || cell(idx.doi) || ("loose-" + (slug(title,"row") || Math.random().toString(36).slice(2,9)));
    let tags = [];
    tagCols.forEach(i=>{ tags = tags.concat(splitList(cell(i))); });
    const fields = {};
    extra.forEach(x=>{ fields[x.id] = cell(x.i); });
    const year = parseInt(cell(idx.year), 10);
    const existing = doc.items.find(x=>x.key===key);
    if(existing){
      if(title) existing.title = title;
      if(!isNaN(year)) existing.year = year;
      if(tags.length) existing.tags = Array.from(new Set(existing.tags.concat(tags))).sort(byName);
      existing.fields = Object.assign(existing.fields||{}, fields);
      updated++;
    } else {
      doc.items.push({ key, title, doi: cell(idx.doi) || (/^10\./.test(key) ? key : ""), wid:"",
        pdf:"", year: isNaN(year) ? null : year, journal:"", tags: tags.sort(byName),
        fields, added_at: nowISO() });
      added++;
    }
  });
  doc.items.forEach(it=>it.tags.forEach(tag=>{
    if(!doc.vocab.tags.some(x=>lc(x.name)===lc(tag)))
      doc.vocab.tags.push({ name:tag, color:PALETTE[doc.vocab.tags.length % PALETTE.length] });
  }));
  return { doc, added, updated };
}
$("#importbtn").addEventListener("click", ()=>{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".csv,text/csv";
  inp.onchange = async ()=>{
    const file = inp.files && inp.files[0];
    if(!file) return;
    let rows;
    try { rows = parseCSV(await file.text()); }
    catch(e){ toast("Could not read that file"); return; }
    if(rows.length < 2){ toast("That CSV has no rows"); return; }
    sheet(`
      <h3>Import ${rows.length-1} row(s) from ${esc(file.name)}</h3>
      <p>Columns found: ${rows[0].filter(Boolean).map(h=>`<kbd>${esc(h)}</kbd>`).join(" ")}</p>
      <p><b>Tags</b> / <b>Modalities</b> columns merge into each paper's tag list; everything else
         becomes its own free-text column. Rows already on the board are updated in place, and the
         file's row order becomes the list order.</p>
      <div class="btns">
        <button data-act="cancel">Cancel</button>
        <button data-act="merge">Merge into this board</button>
        <button data-act="replace">Replace everything</button>
      </div>`, act=>{
      if(act==="cancel" || !act) return;
      const r = docFromCSV(rows, act==="merge");
      DOC = r.doc;
      markDirty(); renderAll();
      fetchMeta(DOC.items.map(it=>it.key), true).then(()=>{
        let n = 0;
        DOC.items.forEach(it=>{
          const m = META[it.key];
          if(!it.tags.length && m && m.mods && m.mods.length){ it.tags = m.mods.slice(); sortTags(it); m.mods.forEach(rememberTag); n++; }
        });
        if(n){ markDirty(); renderAll(); }
        toast(`Imported — ${r.added} added, ${r.updated} updated${n?`, ${n} auto-tagged`:""}`, 4200);
      });
    });
  };
  inp.click();
});

// ---- overlay + help -------------------------------------------------------
function sheet(html, onAct, wide){
  $("#sheet").innerHTML = html;
  $("#sheet").classList.toggle("wide", !!wide);
  $("#overlay").classList.add("show");
  $("#sheet").onclick = e=>{
    const b = e.target.closest("button[data-act]");
    if(!b) return;
    $("#overlay").classList.remove("show");
    if(onAct) onAct(b.dataset.act);
  };
}
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") $("#overlay").classList.remove("show"); });
$("#helpbtn").addEventListener("click", ()=>sheet(`
  <h3>How this page works</h3>

    <li><b>One list, in your order</b>, numbered as you see it. Grab a row's <kbd>⠿</kbd> to drag it,

        position. Everything renumbers itself.</li>
    <li><b>Search</b> ( <kbd>/</kbd> ) <b>matches titles</b>: type any piece of a title and the
        closest titles come back, best first — nothing has to match exactly, so a typo, a missing
        word or two words the wrong way round still land the paper ( pasting a DOI works too ).
        Switch the dropdown to <kbd>full text</kbd> for the dashboard's boolean search over whole
        papers. <kbd>↵</kbd> or a <b>double-click</b> adds the highlighted hit, already tagged from
        its <code>prma modalities</code> stamp. Drag a hit in to drop it at an exact position.</li>
    <li><b>Where adds land</b> is the dropdown next to the search box: the bottom, the top, or

    <li><b>Tags</b> say what a paper is — <kbd>fMRI</kbd>, <kbd>EEG</kbd>, both, or anything you invent.

        <b>click a row to select it</b> ( <kbd>⌘</kbd>-click adds another, <kbd>⇧</kbd>-click takes the
        range ) and then click tags at the top to flip them on and off the whole selection ;
        or, with nothing selected, click a tag to <b>paint</b> it and click rows to toggle it.

    <li><b>Rearrange the tag bar</b> by dragging a chip along it — put the modalities together,

    <li><b>📋 Import refs</b> takes somebody else's bibliography — <b>paste</b> it in, or drop a

        that isn't already here lands on the <b>staging shelf</b> above the list: <i>not</i> in
        the sort, nothing renumbered, nothing to undo if the parse was wrong. There you fix a
        title, tag rows one at a time or check several and use <kbd>+ tag checked</kbd>, then
        press <kbd>＋ Add</kbd> to move them onto the list — to the bottom, unless the

    <li><b>Only show some of them</b>: <kbd>🔎 Filter</kbd> turns the tag bar into a filter — click

    <li><b>Colours</b>: every tag gets its own pastel, so a row's chips are a pattern you can read

    <li><b>Tagging never moves a row.</b> <kbd>⇥ Auto-move</kbd> ( off by default ) changes that: with it

labelTheme();

try { $("#smode").value = localStorage.getItem("prma-search-mode") || "title"; } catch(e){}
labelMode();
loadDoc().then(()=>{
  labelAutoMove();
  $("#addwhere").value = DOC.options.add_where || "bottom";
  syncHeadOffset(); pollRev();
