openalex:
  api_key: "asdf"
mendeley:
  client_id: "12345"
  secret: "asdf"
  redirect_uri: "http://localhost:1234"
  auth_url: "https://api.mendeley.com/oauth/authorize?client_id=12345&redirect_uri=http%3a%2f%2flocalhost%3a1234&response_type=code&scope=all"
  email: "asdf@example.edu"
  password: "asdf"
# `prma summarize` reads these. Each provider is optional ; whichever
# you set lets `--provider <name>` use it.
#
# `key`   : API key. Falls back to env vars if missing :
#             claude -> ANTHROPIC_API_KEY
#             openai -> OPENAI_API_KEY
#             gemini -> GEMINI_API_KEY ( fallback : GOOGLE_API_KEY )
# `model` : optional model override. CLI --model still wins. If neither
#           is set , a sensible per-provider default is used.
gpts:
  claude:
    key:   "sk-ant-..."
    model: "claude-opus-4-5"
  openai:
    key:   "sk-..."
    model: "gpt-4o"
  gemini:
    key:   "AIza..."
    model: "gemini-2.0-flash"

# `prma code` reads this ( optional ). When set , it fetches each UNIQUE GitHub
# repo found in your papers ( metadata + README ) via the GitHub API , caches
# them under output/cache/github/ , and tags each repo by neuroimaging method
# ( fMRI / EEG / ECoG / fNIRS / MEG / PET / EMG ) in output/code/code.xlsx so you
# can sort by method. A classic PAT or a fine-grained token with public-repo
# read access is plenty. Leave blank / omit to skip the enrichment.
github:
  api_key: "ghp_..."

# `prma code` reads this too ( optional ). Same idea as github , for OSF ( osf.io )
# links : it resolves each UNIQUE OSF node found in your papers , fetches its
# metadata + Home wiki via the OSF API , caches them under output/cache/osf/ , and
# tags each by neuroimaging method in output/code/code.xlsx. Create a Personal
# Access Token at https://osf.io/settings/tokens ( the read-only 'osf.full_read'
# scope is enough ). Leave blank / omit to skip the OSF enrichment.
osfio:
  api_key: "..."

# The dashboard server's accounts ( ` prma auth ` , src/server/auth.py ). All
# optional -- these are the defaults. Anonymous visitors can view but change
# nothing ; logged-in users can do everything ; admins also manage accounts.
auth:
  enabled: true           # false : no accounts at all , everyone can do everything
  session_days: 30        # how long a login lasts
  login_link_hours: 72    # how long an unused one-time login link stays valid
  api_key_days: 90        # default expiry for a new API key ( 0 = never )
  secure_cookies: auto    # auto = Secure cookie when X-Forwarded-Proto is https ; true / false to force
  public_url: ""          # e.g. https://prma.example.org -- where terminal-printed login links point

# The citation style the /sort board's rows are cited in ( src/db/cite.py ) :
# the in-text citation drawn on each row , and the full reference its second
# copy button puts on the clipboard. Optional -- without it the bundled
# the-journal-of-neuroscience is used.
#
# The value is the FILE NAME , without .csl , of a style in the
# citation-styles/ directory beside this file. Download more from
#   https://www.zotero.org/styles/
# and drop them in ; the picker in the /sort toolbar lists whatever is there ,
# and each board can override this default for itself.
#
# They must be INDEPENDENT styles. A good half of zotero.org/styles is
# DEPENDENT stubs -- a file whose only content is a pointer to the style it
# defers to -- and those carry no rules to render with. One is listed in the
# picker greyed out , naming the parent to go and fetch instead.
citation:
  style: the-journal-of-neuroscience
